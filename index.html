              <button class="btn-outline" data-action="exportData">내보내기</button>
              <button class="btn-outline" data-action="importTrigger">가져오기</button>
            </div>
          </div>
        </div>
      </div>
    </div>`;
  }

  /* ============ 유틸 ============ */
  function escapeHtml(s){ return (s||'').replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
  function fmtDate(ts){ const d=new Date(ts); return `${d.getMonth()+1}/${d.getDate()}`; }

  /* ============ 액션: 할 일 ============ */
  function addTask(text, boxKey, corner){
    text = (text||'').trim(); if(!text) return;
    state.data.tasks.push({id:genId(), text, boxKey: hasBox(boxKey) ? boxKey : null,
                           corner: corner==='review' ? 'review' : 'self', createdAt:Date.now()});
    persist(); render();
  }
  function saveTaskEdit(id){
    const t = document.getElementById('taskEditText');
    const text = t ? t.value.trim() : '';
    if(!text) return;                       // 빈 내용으로는 저장 안 함
    const it = state.data.tasks.find(x=>x.id===id); if(!it) return;
    it.text = text;
    const bs = document.getElementById('taskEditBox');
    if(bs) it.boxKey = hasBox(bs.value) ? bs.value : null;
    const cs = document.getElementById('taskEditCorner');
    if(cs) it.corner = cs.value==='review' ? 'review' : 'self';
    state.editingTask = null;
    persist(); render();
  }
  function completeTask(id){
    const idx = state.data.tasks.findIndex(i=>i.id===id); if(idx<0) return;
    const [it] = state.data.tasks.splice(idx,1);
    const completedAt = Date.now();
    state.data.completed.push({...it, completedAt});
    const box = it.boxKey && hasBox(it.boxKey) ? findBox(it.boxKey) : null;
    logArchiveEvent({id, ts:completedAt, createdAt:it.createdAt||null,
      subject: box?box.label:'미분류', subjectKey: box?box.key:null, kind:it.corner, text:it.text});
    lastCompletion = {id, text:it.text, snapshot:{...it}};
    persist(); openCompletionFeedback(id);
  }
  function deleteTask(id){
    state.data.tasks = state.data.tasks.filter(i=>i.id!==id);
    persist(); render();
  }
  function restoreTask(id){
    const idx = state.data.completed.findIndex(i=>i.id===id); if(idx<0) return;
    const [it] = state.data.completed.splice(idx,1);
    delete it.completedAt;
    state.data.tasks.push(it);
    persist(); render();
  }
  function deletePermanent(id){
    state.data.completed = state.data.completed.filter(i=>i.id!==id);
    persist(); render();
  }

  const FOOD_ORDER = ['choc','straw','graham','cheese','sausage','glazed','sub','club','corndog'];
  function examSubjects(){ return (state.data.examWeek && state.data.examWeek.subjects) || []; }
  function toggleExamAdd(){ state.examAddOpen = !state.examAddOpen; render(); }
  function addExamSubject(name, itemLines){
    name = (name||'').trim(); if(!name) return;
    const items = (itemLines||'').split('\n').map(s=>s.trim()).filter(Boolean).map(text=>({id:genId(), text, done:false}));
    state.data.examWeek = state.data.examWeek || {subjects:[]};
    const food = FOOD_ORDER[state.data.examWeek.subjects.length % FOOD_ORDER.length];
    state.data.examWeek.subjects.push({id:genId(), name, food, items});
    persist(); render();
  }
  function submitExamSubject(){
    const nameEl = document.getElementById('examNewName');
    const itemsEl = document.getElementById('examNewItems');
    if(!nameEl || !nameEl.value.trim()) return;
    state.examAddOpen = false;
    addExamSubject(nameEl.value, itemsEl ? itemsEl.value : '');
  }
  function deleteExamSubject(id){
    state.data.examWeek.subjects = examSubjects().filter(s=>s.id!==id);
    persist(); render();
  }
  function addExamItem(subjectId, text){
    text = (text||'').trim(); if(!text) return;
    const s = examSubjects().find(x=>x.id===subjectId); if(!s) return;
    s.items.push({id:genId(), text, done:false});
    persist(); render();
  }
  function toggleExamItem(subjectId, itemId){
    const s = examSubjects().find(x=>x.id===subjectId); if(!s) return;
    const it = s.items.find(x=>x.id===itemId); if(!it) return;
    it.done = !it.done;
    persist(); render();
  }
  function deleteExamItem(subjectId, itemId){
    const s = examSubjects().find(x=>x.id===subjectId); if(!s) return;
    s.items = s.items.filter(x=>x.id!==itemId);
    persist(); render();
  }
  function examSubjectCardHtml(s){
    const food = FOOD_SPRITES[s.food] || FOOD_SPRITES.choc;
    const n = s.items.length;
    const done = s.items.filter(i=>i.done).length;
    const pct = n>0 ? Math.round(done/n*100) : 0;
    const itemsHtml = s.items.map(it=>`
      <div class="exam-item ${it.done?'done':''}">
        <button class="exam-item-check" data-action="toggleExamItem" data-subject="${s.id}" data-id="${it.id}">${icon('check')}</button>
        <div class="exam-item-text">${escapeHtml(it.text)}</div>
        <button class="task-del" style="opacity:1;" title="삭제" data-action="deleteExamItem" data-subject="${s.id}" data-id="${it.id}">${icon('trash')}</button>
      </div>`).join('');
    const barHtml = n===0 ? `<div class="empty" style="padding:4px 0 10px;">아직 항목이 없어요 — 아래에서 추가해줘.</div>` : `
      <div class="food-bar" style="--n:${n};">
        <div class="food-bar-img" style="background-image:url('${food.src}');"></div>
        <div class="food-bar-blocks"></div>
        <div class="food-bar-eaten" style="width:${pct}%;"></div>
      </div>`;
    return `<div class="exam-card">
      <div class="exam-card-head">
        <div>
          <div class="exam-card-title">${escapeHtml(s.name)}</div>
          <div class="exam-card-meta">${food.label} · ${done}/${n} 완료</div>
        </div>
        <button class="task-del" style="opacity:1;" title="과목 삭제" data-action="deleteExamSubject" data-id="${s.id}">${icon('trash')}</button>
      </div>
      ${barHtml}
      <div class="exam-items">${itemsHtml}</div>
      <div class="add-row" style="margin-top:10px;margin-bottom:0;">
        <input type="text" class="add-input exam-item-input" data-subject="${s.id}" placeholder="항목 추가 후 Enter">
        <button class="btn-outline" data-action="addExamItemFromRow" data-subject="${s.id}">추가</button>
      </div>
    </div>`;
  }
  function renderExamPage(){
    const subjects = examSubjects();
    const addForm = state.examAddOpen ? `<div class="box-add-form exam-add-form">
        <input type="text" id="examNewName" placeholder="과목 이름 (예: 수학)" autofocus>
        <textarea id="examNewItems" rows="5" placeholder="이번 주에 끝낼 것들을 한 줄에 하나씩 적어줘
예)
미적분 7단원 복습
기출 3회분 풀기"></textarea>
        <div class="add-row-line">
          <button class="btn" data-action="submitExamSubject">추가</button>
          <button class="btn-outline" data-action="toggleExamAdd">취소</button>
        </div>
      </div>`
      : `<button class="box-add-btn" data-action="toggleExamAdd">+ 과목 추가</button>`;
    return `<div class="fade-in">
      <div class="page-head"><h1>이번주</h1></div>
      <div class="empty" style="padding:0 0 14px;">과목마다 이번 주에 끝낼 것들을 적어두면, 끝낸 만큼 그 과목 간식이 사라져요.</div>
      <div class="exam-add-wrap">${addForm}</div>
      ${subjects.length===0 ? '' : `<div class="exam-grid">${subjects.map(examSubjectCardHtml).join('')}</div>`}
    </div>`;
  }

  /* ============ 아카이브 로그 — append-only 원자료 ============
     완료 즉시 한 줄 기록하고, 이후 이 항목을 지우거나 다른 배열로 옮겨도 이 로그는
     건드리지 않는다. 완료 피드백/실행취소(undo)가 이 원자료를 그대로 쓴다. */
  function logArchiveEvent(entry){
    state.data.archiveLog = state.data.archiveLog || [];
    state.data.archiveLog.push(entry);
  }
  function findAnyCompletedItem(id){
    return state.data.completed.find(i=>i.id===id) || null;
  }

  /* ============ 완료 피드백 — 화면을 막지 않는 대화창 ============
     끝낸 것마다 얼마나 확실히 알고 있었는지 자기평가 4단계 + 짧은 설명을 받는다.
     등급 버튼은 고르기만 하고 바로 제출되지 않는다 — 이어서 설명까지 쓰고 별도
     제출 버튼을 눌러야 반영됨(등급 클릭 = 즉시 제출이면 쓰던 글이 날아가는 문제가 있었음). */
  let lastCompletion = null; // 실행취소용 — 가장 최근 완료 한 건만 기억
  function openCompletionFeedback(id){
    state.feedbackTargetId = id;
    state.feedbackSelectedRating = null;
    render();
  }
  function selectFeedbackRating(rating){
    state.feedbackSelectedRating = rating;
    renderOverlaysOnly();
  }
  function submitCompletionFeedback(){
    const id = state.feedbackTargetId;
    const rating = state.feedbackSelectedRating;
    if(!rating) return;
    const it = findAnyCompletedItem(id);
    if(it){
      const noteEl = document.getElementById('feedbackNoteInput');
      it.recallRating = rating;
      const note = noteEl ? noteEl.value.trim() : '';
      if(note) it.feedbackNote = note;
      it.feedbackAt = Date.now();
      const log = (state.data.archiveLog||[]).find(e=>e.id===id);
      if(log){ log.rating = rating; if(note) log.note = note; }
      persist();
    }
    state.feedbackTargetId = null;
    state.feedbackSelectedRating = null;
    render();
  }
  function skipCompletionFeedback(){
    state.feedbackTargetId = null;
    state.feedbackSelectedRating = null;
    render();
  }
  function renderCompletionFeedbackModal(){
    const it = findAnyCompletedItem(state.feedbackTargetId);
    if(!it) return '';
    const RATINGS = [['AGAIN','거의 기억 안 남'],['HARD','가물가물했음'],['GOOD','잘 기억남'],['EASY','완벽했음']];
    const selected = state.feedbackSelectedRating;
    const ratingBtns = RATINGS.map(([key,label])=>
      `<button class="btn-outline ${selected===key?'is-selected':''}" data-action="selectFeedbackRating" data-rating="${key}">${label}</button>`
    ).join('');
    return `<div class="feedback-dock" role="dialog" aria-label="학습 후기" data-target="${escapeHtml(state.feedbackTargetId||'')}">
      <div class="feedback-dock-head">
        <b>학습 후기</b>
        <button class="modal-close" data-action="skipCompletionFeedback" aria-label="후기 건너뛰기">${icon('close')}</button>
      </div>
      <div class="feedback-dock-body">
        <div class="feedback-item-text" style="margin-bottom:4px;">${escapeHtml(it.text)}</div>
        <div class="feedback-item-meta" style="margin-bottom:10px;">방금 끝낸 거, 얼마나 확실하게 알고 있었어요?</div>
        <div class="feedback-hint">등급을 고른다고 바로 제출되지 않아요 — 아래에 설명까지 쓰고 제출을 눌러주세요.</div>
        <div class="feedback-ratings">${ratingBtns}</div>
        <div class="feedback-explain-label">방금 이해한 걸 네 언어로 설명해봐요</div>
        <div class="feedback-hint">여기서 막히면 아직 모르는 거예요. 짧아도 되니까 남의 말 말고 네 말로. 나중에 이 설명 자체가 복습 자료가 돼요.</div>
        <textarea class="ai-textarea" id="feedbackNoteInput" placeholder="예: 급수가 수렴하는지는 항이 0으로 가는 속도로 판단하는데, 0으로 가도 느리면 발산할 수 있다"></textarea>
        <div class="feedback-dock-actions">
          <button class="section-link" data-action="skipCompletionFeedback">그냥 넘어가기</button>
          <button class="btn" data-action="submitCompletionFeedback" ${selected?'':'disabled'}>제출</button>
        </div>
      </div>
    </div>`;
  }
  // 완료 자체를 잘못 눌렀을 때 되돌린다. 가장 최근 완료 한 건만 대상.
  function undoLastCompletion(){
    const lc = lastCompletion;
    if(!lc) return;
    const idx = state.data.completed.findIndex(i=>i.id===lc.id); if(idx<0) return;
    state.data.completed.splice(idx,1);
    state.data.tasks.push(lc.snapshot);
    state.data.archiveLog = (state.data.archiveLog||[]).filter(e=>e.id!==lc.id);
    if(state.feedbackTargetId===lc.id){ state.feedbackTargetId=null; state.feedbackSelectedRating=null; }
    lastCompletion = null;
    persist(); render();
  }

  /* ============ 액션: 과제 ============ */
  /* ============ 액션: 설정 ============ */
  let templateCopyStatus = ''; // 방금 복사한 템플릿 id (버튼에 "복사됨!" 잠깐 표시용)
  function saveStudentName(){
    const input = document.getElementById('studentNameInput');
    setStudentName(input ? input.value.trim() : '');
    render();
  }

  /* ============ 내보내기/가져오기 ============ */
  function exportData(){
    const blob = new Blob([JSON.stringify(state.data,null,2)],{type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href=url; a.download=`city-of-brain-backup-${now.getFullYear()}${String(now.getMonth()+1).padStart(2,'0')}${String(now.getDate()).padStart(2,'0')}.json`;
    document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);
  }
  function importDataFromFile(file){
    const reader = new FileReader();
    reader.onload = e=>{
      try{
        const parsed = JSON.parse(e.target.result);
        state.data = {
          tasks: parsed.tasks || [],
          completed: parsed.completed || [],
          ddays: parsed.ddays || [],
          boxes: parsed.boxes || [],
          archiveLog: parsed.archiveLog || [],
          examWeek: parsed.examWeek || {subjects:[]}
        };
        persist(); render();
      }catch(err){ alert('파일을 읽지 못했어요. JSON 형식이 맞는지 확인해주세요.'); }
    };
    reader.readAsText(file);
  }

  /* ============ 홈 박스 드래그 (물방울처럼 마우스로 움직이기) ============ */
  const BOX_DRAG_RANGE = 90;
  let suppressNextClick = false;
  let boxDrag = null;
  document.body.addEventListener('pointerdown', function(e){
    if(e.button!=null && e.button!==0) return;
    const wrap = e.target.closest('.box-drag');
    if(!wrap || e.target.closest('button') || e.target.closest('.box-task-row')) return;
    const key = wrap.dataset.boxkey;
    const off = boxDragOffsets[key] || {x:0, y:0};
    boxDrag = { key, el:wrap, startX:e.clientX, startY:e.clientY, origX:off.x, origY:off.y, moved:false, pointerId:e.pointerId };
    wrap.classList.add('dragging');
    // setPointerCapture는 일부러 안 씀 — 캡처를 걸면 click 이벤트의 target이 wrap(래퍼)으로
    // 바뀌어서 안쪽 <button data-action>을 closest()로 못 찾게 됨. document.body에서
    // pointerId로 걸러 듣고 있어서 캡처 없이도 드래그 추적에는 문제 없음.
  });
  document.body.addEventListener('pointermove', function(e){
    if(!boxDrag || e.pointerId!==boxDrag.pointerId) return;
    const dx = e.clientX - boxDrag.startX, dy = e.clientY - boxDrag.startY;
    if(Math.abs(dx)>4 || Math.abs(dy)>4) boxDrag.moved = true;
    if(boxDrag.moved){
      const x = Math.max(-BOX_DRAG_RANGE, Math.min(BOX_DRAG_RANGE, boxDrag.origX+dx));
      const y = Math.max(-BOX_DRAG_RANGE, Math.min(BOX_DRAG_RANGE, boxDrag.origY+dy));
      boxDrag.el.style.transform = `translate(${x}px,${y}px)`;
    }
  });
  function endBoxDrag(e){
    if(!boxDrag || (e.pointerId!==undefined && e.pointerId!==boxDrag.pointerId)) return;
    boxDrag.el.classList.remove('dragging');
    if(boxDrag.moved){
      const dx = e.clientX - boxDrag.startX, dy = e.clientY - boxDrag.startY;
      const x = Math.max(-BOX_DRAG_RANGE, Math.min(BOX_DRAG_RANGE, boxDrag.origX+dx));
      const y = Math.max(-BOX_DRAG_RANGE, Math.min(BOX_DRAG_RANGE, boxDrag.origY+dy));
      boxDragOffsets[boxDrag.key] = {x, y};
      suppressNextClick = true;
      const cell = boxDrag.el.querySelector('.box-cell');
      if(cell){
        cell.classList.add('drop-bounce');
        cell.addEventListener('animationend', ()=>cell.classList.remove('drop-bounce'), {once:true});
      }
    }
    boxDrag = null;
  }
  document.body.addEventListener('pointerup', endBoxDrag);
  document.body.addEventListener('pointercancel', endBoxDrag);

  /* ============ 할 일 항목 드래그 ============
     두 가지 목적을 하나의 네이티브 드래그로 처리한다:
     1) 그냥 드래그해서 스톱워치/뽀모도로 카드에 놓으면 연결(기존 기능)
     2) 몇백 ms 이상 누르고 있으면(움직이기 전부터) 오른쪽 아래에 휴지통이 뜨고,
        그 상태로 끌어다 놓으면 삭제(신규 기능)
     휴지통 노출은 순수 포인터 타이머로 재고, 실제 드래그 자체는 그대로 네이티브
     HTML5 dragstart/dragover/drop을 쓴다 — 빠르게 휙 끌면(타이머가 뜨기 전) 휴지통이
     안 뜨니 기존 스톱워치 연결 동작은 그대로 유지됨. */
  const TASK_LONGPRESS_MS = 550;
  let taskLongPressTimer = null, taskLongPressRow = null, taskDragActive = false;
  function showTaskTrash(row){
    const trash = document.getElementById('taskTrashZone');
    if(trash) trash.classList.add('visible');
    if(row) row.classList.add('longpress-armed');
  }
  function hideTaskTrash(){
    const trash = document.getElementById('taskTrashZone');
    if(trash) trash.classList.remove('visible', 'drag-over');
    document.querySelectorAll('.box-task-row.longpress-armed').forEach(r=>r.classList.remove('longpress-armed'));
  }
  document.body.addEventListener('pointerdown', function(e){
    const row = e.target.closest('.box-task-row');
    if(!row || e.target.closest('button')) return;
    taskLongPressRow = row;
    taskLongPressTimer = setTimeout(()=>{
      if(taskLongPressRow===row) showTaskTrash(row);
    }, TASK_LONGPRESS_MS);
  });
  function clearTaskLongPress(){
    clearTimeout(taskLongPressTimer);
    taskLongPressTimer = null;
    taskLongPressRow = null;
    if(!taskDragActive) hideTaskTrash();
  }
  document.body.addEventListener('pointerup', clearTaskLongPress);
  document.body.addEventListener('pointercancel', clearTaskLongPress);

  document.body.addEventListener('dragstart', function(e){
    const row = e.target.closest('.box-task-row');
    if(!row) return;
    const payload = {type:'task', id:row.dataset.dragId};
    e.dataTransfer.setData('application/json', JSON.stringify(payload));
    e.dataTransfer.effectAllowed = 'copyMove';
    row.classList.add('dragging-task');
    taskDragActive = true;
  });
  document.body.addEventListener('dragend', function(e){
    const row = e.target.closest('.box-task-row');
    if(row) row.classList.remove('dragging-task');
    document.querySelectorAll('.pomo-card.drag-over').forEach(c=>c.classList.remove('drag-over'));
    taskDragActive = false;
    hideTaskTrash();
  });
  document.body.addEventListener('dragover', function(e){
    const card = e.target.closest('.pomo-card');
    const trash = e.target.closest('.task-trash.visible');
    if(!card && !trash) return;
    e.preventDefault();
    if(card){ e.dataTransfer.dropEffect='copy'; card.classList.add('drag-over'); }
    else document.querySelectorAll('.pomo-card.drag-over').forEach(c=>c.classList.remove('drag-over'));
    if(trash){ e.dataTransfer.dropEffect='move'; trash.classList.add('drag-over'); }
    else { const t=document.getElementById('taskTrashZone'); if(t) t.classList.remove('drag-over'); }
  });
  document.body.addEventListener('drop', function(e){
    const card = e.target.closest('.pomo-card');
    const trash = e.target.closest('.task-trash.visible');
    if(!card && !trash) return;
    e.preventDefault();
    if(card) card.classList.remove('drag-over');
    try{
      const data = JSON.parse(e.dataTransfer.getData('application/json'));
      if(!data || !data.type) return;
      if(trash){
        if(data.type==='task') deleteTask(data.id);
        trash.classList.remove('drag-over');
        trash.classList.add('deleted');
        trash.addEventListener('animationend', ()=>{ trash.classList.remove('deleted','visible'); }, {once:true});
        return;
      }
      sw.target = data;
      render();
      const newCard = document.querySelector('.pomo-card');
      if(newCard){
        newCard.classList.add('linked-flash');
        newCard.addEventListener('animationend', ()=>newCard.classList.remove('linked-flash'), {once:true});
      }
    }catch(err){}
  });

  /* ============ 이벤트 위임 ============ */
  document.body.addEventListener('click', function(e){
    if(suppressNextClick){ suppressNextClick = false; return; }
    const el = e.target.closest('[data-action]'); if(!el) return;
    if(el.dataset.action==='closeModal' && el.classList.contains('modal-overlay') && e.target!==el) return;
    switch(el.dataset.action){
      case 'goView': {
        const target = el.dataset.view;
        if(chainModeActive && SCROLL_CHAIN.includes(target)){
          // 이미 스크롤 체인 화면 안이면 다시 그리지 않고 그 섹션까지 그냥 부드럽게 스크롤만
          const sec = document.getElementById('sec-'+target);
          if(sec) sec.scrollIntoView({behavior:'smooth', block:'start'});
        } else {
          state.view = target;
          if(SCROLL_CHAIN.includes(target)) pendingScrollTarget = target;
          render();
        }
        break;
      }
      case 'setTaskAddType': setTaskAddType(el.dataset.type); break;
      case 'addTaskUnified': addTaskUnified(); break;
      case 'completeTask': completeTask(el.dataset.id); break;
      case 'deleteTask': deleteTask(el.dataset.id); break;
      case 'restoreTask': restoreTask(el.dataset.id); break;
      case 'deletePermanent': deletePermanent(el.dataset.id); break;
      case 'openCompleted': state.modal='completed'; renderOverlaysOnly(); break;
      case 'openQuickAdd': state.quickAddBoxKey = el.dataset.boxkey; state.quickAddCorner = 'review'; state.modal = 'quickAdd'; renderOverlaysOnly(); break;
      case 'setQuickAddCorner': state.quickAddCorner = el.dataset.corner; renderOverlaysOnly(); break;
      case 'quickAddSubmit': {
        const input = document.getElementById('quickAddInput');
        addTask(input.value, el.dataset.boxkey, el.dataset.corner);
        break;
      }
      case 'openSettings': state.modal='settings'; renderOverlaysOnly(); break;
      case 'openPrivacy': state.modal='privacy'; renderOverlaysOnly(); break;
      case 'openNotifications': state.modal='notifications'; renderOverlaysOnly(); break;
      case 'closeModal': state.modal=null; renderOverlaysOnly(); break;
      case 'exportData': exportData(); break;
      case 'importTrigger': document.getElementById('importFile').click(); break;
      case 'selectFeedbackRating': selectFeedbackRating(el.dataset.rating); break;
      case 'submitCompletionFeedback': if(!el.disabled) submitCompletionFeedback(); break;
      case 'skipCompletionFeedback': skipCompletionFeedback(); break;
      case 'undoLastCompletion': undoLastCompletion(); break;
      case 'addDday': addDday(); break;
      case 'deleteDday': deleteDday(el.dataset.id); break;
      case 'toggleDdayHidden': toggleDdayHidden(el.dataset.id); break;
      case 'toggleDdayAdd': toggleDdayAdd(); break;
      case 'toggleBoxAdd': toggleBoxAdd(); break;
      case 'submitAddBox': submitAddBox(); break;
      case 'deleteBox': deleteBox(el.dataset.key); break;
      case 'toggleExamAdd': toggleExamAdd(); break;
      case 'submitExamSubject': submitExamSubject(); break;
      case 'deleteExamSubject': deleteExamSubject(el.dataset.id); break;
      case 'toggleExamItem': toggleExamItem(el.dataset.subject, el.dataset.id); break;
      case 'deleteExamItem': deleteExamItem(el.dataset.subject, el.dataset.id); break;
      case 'addExamItemFromRow': {
        const input = document.querySelector(`.exam-item-input[data-subject="${el.dataset.subject}"]`);
        if(input) addExamItem(el.dataset.subject, input.value);
        break;
      }
      case 'editTask': state.editingTask = {id:el.dataset.id}; render(); break;
      case 'cancelTaskEdit': state.editingTask = null; render(); break;
      case 'saveTaskEdit': saveTaskEdit(el.dataset.id); break;
      case 'swStart': swStart(); break;
      case 'swPause': swPause(); break;
      case 'swReset': swReset(); break;
      case 'swCompleteLinked': swCompleteLinked(); break;
      case 'setSwMode': setSwMode(el.dataset.mode); break;
      case 'pomoStart': pomoStart(); break;
      case 'pomoPause': pomoPause(); break;
      case 'pomoReset': pomoReset(); break;
      case 'saveStudentName': saveStudentName(); break;
      case 'signInGoogle': signInGoogle(); break;
      case 'signOut': signOut(); break;
      case 'copyTemplate': {
        const t = getTemplates().find(x=>x.id===el.dataset.id);
        if(t){
          navigator.clipboard.writeText(t.content).then(()=>{
            templateCopyStatus = el.dataset.id;
            render();
            setTimeout(()=>{ if(templateCopyStatus===el.dataset.id){ templateCopyStatus=''; render(); } }, 1500);
          }).catch(()=>{});
        }
        break;
      }
      case 'addTemplate': {
        const input = document.getElementById('newTplName');
        const name = (input.value||'').trim();
        if(!name) break;
        const list = getTemplates();
        list.push({id:genId(), name, content:''});
        setTemplates(list);
        input.value = '';
        render();
        break;
      }
      case 'deleteTemplate': {
        setTemplates(getTemplates().filter(t=>t.id!==el.dataset.id));
        render();
        break;
      }
    }
  });

  document.body.addEventListener('keydown', function(e){
    if(e.key!=='Enter') return;
    if(e.target.dataset.role==='taskEditText'){
      const ed = state.editingTask;
      if(ed) saveTaskEdit(ed.id);
      return;
    }
    if(e.target.id==='newBoxName'){
      submitAddBox();
    } else if(e.target.id==='quickAddInput'){
      addTask(e.target.value, e.target.dataset.boxkey, e.target.dataset.corner);
    } else if(e.target.id==='taskAddInput'){
      addTaskUnified();
    } else if(e.target.classList.contains('exam-item-input')){
      addExamItem(e.target.dataset.subject, e.target.value);
    }
  });

  let debTimer = null;
  document.body.addEventListener('input', function(e){
    if(e.target.dataset.role==='templateName' || e.target.dataset.role==='templateContent'){
      const field = e.target.dataset.role==='templateName' ? 'name' : 'content';
      const id = e.target.dataset.id, val = e.target.value;
      clearTimeout(debTimer);
      debTimer = setTimeout(()=>{
        const list = getTemplates();
        const t = list.find(x=>x.id===id);
        if(t){ t[field] = val; setTemplates(list); }
      }, 400);
    }
  });

  document.getElementById('importFile').addEventListener('change', function(e){
    if(e.target.files && e.target.files[0]) importDataFromFile(e.target.files[0]);
    e.target.value = '';
  });

  /* ============ 초기화 ============ */
  (function init(){
    const trashZone = document.getElementById('taskTrashZone');
    if(trashZone) trashZone.innerHTML = icon('trash');

    const saved = loadData();
    if(saved){
      state.data = {
        tasks: saved.tasks || [],
        completed: saved.completed || [],
        ddays: saved.ddays || [],
        boxes: saved.boxes || [],
        archiveLog: saved.archiveLog || [],
        examWeek: saved.examWeek || {subjects:[]}
      };
    }
    // 세션 확인은 비동기로 흘려보냄 — 네트워크가 느리거나 막혀도 첫 화면은 바로 그려짐.
    // sb가 있으면 세션 확인 전까지는 기본적으로 로그인 게이트가 보이고, 확인되면 initAuth가 다시 그려줌
    render();
    initAuth();
  })();

})();
</script>
</body>
</html>
