<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>City of Brain</title>
<meta name="theme-color" content="#0B0B0E">
<link rel="icon" href="favicon.ico?v=4" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="assets/icon-32.png?v=4">
<link rel="icon" type="image/png" sizes="512x512" href="assets/icon-512.png?v=4">
<link rel="apple-touch-icon" href="assets/icon-180.png?v=4">
<link rel="manifest" href="manifest.json?v=4">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="City of Brain">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.css" />
<style>
  :root{
    /* 라이트 모드가 없는 앱이라, 브라우저가 대신 그리는 요소(select 팝업 목록, 날짜
       picker, 스크롤바)도 다크로 맞춰야 함 — 안 그러면 select를 열었을 때 목록만
       흰 배경으로 튀는 문제가 생김. */
    color-scheme: dark;
    --bg:#0B0B0E;
    --glass:rgba(255,255,255,.08); --glass-strong:rgba(255,255,255,.15); --glass-press:rgba(255,255,255,.2);
    --border:rgba(255,255,255,.13); --border-strong:rgba(255,255,255,.22); --border-hi:rgba(255,255,255,.36);
    --text:#FFFFFF; --text-2:rgba(255,255,255,.76); --text-3:rgba(255,255,255,.52);
    --blue:#0A84FF; --red:#FF453A; --green:#30D158; --orange:#FF9F0A; --purple:#BF5AF2; --pink:#FF375F; --indigo:#5E5CE6; --teal:#64D2FF;
    --accent:var(--blue);
    --danger:var(--red); --good:var(--green);
    --sans:-apple-system,BlinkMacSystemFont,'SF Pro Text','Pretendard Variable','Pretendard','Malgun Gothic',sans-serif;
    --r-sm:10px; --r-md:16px; --r-lg:22px; --r-pill:999px;
    --blur:26px;
    --dur:200ms; --ease:cubic-bezier(.4,0,.2,1);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(ellipse 900px 620px at 12% -8%, rgba(10,132,255,.20), transparent 60%),
      radial-gradient(ellipse 780px 680px at 105% 8%, rgba(191,90,242,.14), transparent 55%),
      radial-gradient(ellipse 700px 640px at 25% 108%, rgba(255,69,58,.08), transparent 58%),
      var(--bg);
    background-attachment:fixed;
    color:var(--text);font-family:var(--sans);min-height:100vh;-webkit-font-smoothing:antialiased;font-feature-settings:'tnum' 1;
  }
  ::selection{background:rgba(10,132,255,.35);}
  button,input,textarea{font-family:inherit;}
  a{color:inherit;}
  :focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:6px;}
  button{cursor:pointer;}

  /* ---- glass utility ---- */
  .glass{
    background:var(--glass);
    -webkit-backdrop-filter:blur(var(--blur)) saturate(1.7);
    backdrop-filter:blur(var(--blur)) saturate(1.7);
    border:1px solid var(--border);
    border-top-color:var(--border-hi);
  }

  /* ---- shell / nav ---- */
  .app-shell{display:flex;min-height:100vh;align-items:stretch;}
  .sidebar{width:236px;flex-shrink:0;margin:14px 0 14px 14px;padding:20px 12px;border-radius:var(--r-lg);position:sticky;top:14px;height:calc(100vh - 28px);overflow-y:auto;display:flex;flex-direction:column;}
  .sidebar-brand{padding:4px 10px 22px;display:flex;align-items:center;gap:9px;cursor:pointer;}
  .sidebar-brand .mark{
    width:26px;height:26px;border-radius:9px;flex-shrink:0;position:relative;overflow:hidden;
    background:conic-gradient(from 220deg at 50% 50%,
      var(--blue), var(--teal), var(--green), var(--pink), var(--indigo), var(--purple), var(--orange), var(--blue));
    box-shadow:
      inset 0 1px 1px rgba(255,255,255,.6),
      inset 0 -3px 5px -2px rgba(0,0,0,.4),
      0 2px 5px rgba(0,0,0,.3);
  }
  .sidebar-brand .mark::after{
    content:'';position:absolute;inset:0;border-radius:inherit;
    background:linear-gradient(135deg, rgba(255,255,255,.5), rgba(255,255,255,0) 55%);
    -webkit-backdrop-filter:blur(1px) saturate(1.4);
    backdrop-filter:blur(1px) saturate(1.4);
  }
  .sidebar-brand b{font-size:14.5px;font-weight:600;letter-spacing:-.01em;}
  .nav-list{display:flex;flex-direction:column;gap:2px;}
  .nav-item{display:flex;align-items:center;gap:11px;padding:8px 10px;border-radius:11px;font-size:14px;color:var(--text-2);background:none;border:none;text-align:left;width:100%;transition:background var(--dur) var(--ease),color var(--dur) var(--ease);position:relative;}
  .nav-icon{width:27px;height:27px;border-radius:8px;background:var(--nc,var(--blue));display:flex;align-items:center;justify-content:center;flex-shrink:0;color:#fff;box-shadow:0 1px 2px rgba(0,0,0,.35);}
  .nav-icon svg{opacity:1;}
  .nav-item:hover{background:var(--glass);color:var(--text);}
  .nav-item.active{background:var(--glass-strong);color:var(--text);font-weight:600;}
  .nav-item .label{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .sidebar-foot{margin-top:auto;padding-top:14px;border-top:1px solid var(--border);}
  .footer-link{display:block;width:100%;background:none;border:none;color:var(--text-3);font-size:11px;text-align:left;padding:8px 12px;cursor:pointer;font-family:var(--sans);}
  .footer-link:hover{color:var(--text-2);}
  .sidebar-auth-status{font-size:11px;color:var(--text-3);padding:0 12px 10px;}
  .sidebar-account{padding:0 12px 10px;}
  .sidebar-account-email{font-size:11px;color:var(--text-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-bottom:2px;}
  .sidebar-foot .sidebar-login-btn{margin:0 0 10px;padding:9px 14px;font-size:12.5px;}

  .bottom-nav{display:none;}
  .main{flex:1;min-width:0;}
  .main-inner{max-width:720px;margin:0 auto;padding:40px 32px 110px;}
  .main-inner.wide{max-width:1560px;}
  /* 홈→할일→과제→아카이브→도시가 화면 전환 없이 하나로 이어지는 스크롤 화면.
     각 섹션이 자기 폭을 갖도록 바깥 컨테이너의 max-width는 풀고, 섹션마다 다시 좁혀
     중앙 정렬한다(도시 섹션만 더 넓게 튀어나올 수 있도록). */
  .main-inner.chain-mode{max-width:none;padding-left:0;padding-right:0;}
  .scroll-sec{max-width:720px;margin:0 auto;padding:0 32px;scroll-margin-top:20px;}
  .scroll-sec+.scroll-sec{margin-top:72px;}
  .scroll-sec.sec-city{max-width:1560px;}

  .topbar-mini{display:flex;justify-content:flex-end;margin-bottom:10px;}
  .notif-badge{display:inline-flex;align-items:center;justify-content:center;min-width:15px;height:15px;padding:0 3px;border-radius:8px;background:var(--red);color:#fff;font-size:9.5px;font-weight:700;}
  .notif-row{font-size:13px;line-height:1.6;padding:9px 0;border-bottom:1px solid var(--border);}
  .notif-row:last-child{border-bottom:none;}
  .iconbtn{background:var(--glass);border:1px solid var(--border);color:var(--text-2);font-size:12.5px;padding:7px 14px;border-radius:var(--r-pill);display:inline-flex;align-items:center;gap:6px;transition:all var(--dur) var(--ease);-webkit-backdrop-filter:blur(var(--blur));backdrop-filter:blur(var(--blur));}
  .iconbtn:hover{color:var(--text);border-color:var(--border-strong);background:var(--glass-strong);}

  @media(max-width:979px){
    .sidebar{width:64px;padding:20px 8px;}
    .sidebar-brand{justify-content:center;padding:4px 0 20px;}
    .sidebar-brand b{display:none;}
    .nav-item{justify-content:center;padding:8px;}
    .nav-item .label{display:none;}
    .main-inner{padding:34px 22px 110px;}
    .main-inner.chain-mode{padding-left:0;padding-right:0;}
    .scroll-sec{padding:0 22px;}
  }
  @media(max-width:639px){
    .app-shell{display:block;}
    .sidebar{display:none;}
    .bottom-nav{display:flex;position:fixed;left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom));border-radius:var(--r-lg);padding:8px 6px;justify-content:space-around;z-index:60;box-shadow:0 12px 32px rgba(0,0,0,.45);}
    .bottom-nav .nav-item{flex-direction:column;gap:3px;font-size:9.5px;padding:5px 4px;border-radius:12px;flex:1;min-width:0;}
    .bottom-nav .nav-icon{width:26px;height:26px;}
    .bottom-nav .nav-item .label{display:block;font-size:9.5px;}
    .main-inner{padding:24px 16px 110px;max-width:100%;}
    .main-inner.chain-mode{padding-left:0;padding-right:0;}
    .scroll-sec{padding:0 16px;max-width:100%;}
    .scroll-sec.sec-city{max-width:100%;}
  }

  /* ---- page header ---- */
  .page-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:30px;flex-wrap:wrap;}
  .page-head h1{font-size:28px;font-weight:700;letter-spacing:-.02em;margin:0;}
  .page-head .sub{font-size:13px;color:var(--text-3);}

  .home-date{font-size:13px;color:var(--text-3);margin-bottom:6px;}
  .home-greeting{font-size:32px;font-weight:700;letter-spacing:-.02em;margin:0 0 40px;}

  /* ---- home: 처음 쓰는 사람을 위한 가이드 (과목 박스가 하나도 없을 때만) ---- */
  .onboard-guide{
    background:var(--glass);-webkit-backdrop-filter:blur(var(--blur)) saturate(1.7);backdrop-filter:blur(var(--blur)) saturate(1.7);
    border:1px solid var(--border);border-top-color:var(--border-hi);border-radius:var(--r-lg);
    padding:20px 22px;margin-bottom:20px;
  }
  .onboard-title{font-size:13px;font-weight:700;color:var(--text-3);text-transform:uppercase;letter-spacing:.06em;margin-bottom:12px;}
  .onboard-steps{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:8px;font-size:13.5px;line-height:1.6;color:var(--text-2);}
  .onboard-steps b{color:var(--text);}

  /* ---- home: 과목별 박스 (실제 할 일 텍스트 + 선생님 이름이 잘 보이도록 큼직하게) ---- */
  .box-grid{
    display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px;margin-bottom:24px;align-items:start;
  }
  .box-drag{position:relative;touch-action:none;will-change:transform;}
  .box-drag.dragging{z-index:5;}
  .box-float{
    animation:boxFloat var(--float-dur,7s) ease-in-out infinite;
    animation-delay:var(--float-delay,0s);
    will-change:transform;
  }
  .box-drag.dragging .box-float{animation-play-state:paused;}
  @keyframes boxFloat{
    0%,100%{transform:translateY(0);}
    50%{transform:translateY(-5px);}
  }
  @keyframes boxDrop{
    0%{transform:scale(1);} 35%{transform:scale(1.04);} 65%{transform:scale(.98);} 100%{transform:scale(1);}
  }
  .box-cell{
    min-height:150px;display:flex;flex-direction:column;
    background:var(--glass);
    -webkit-backdrop-filter:blur(var(--blur)) saturate(1.8);
    backdrop-filter:blur(var(--blur)) saturate(1.8);
    border:1px solid var(--border);border-top-color:var(--border-hi);
    border-radius:20px;padding:16px 18px 12px;
    position:relative;overflow:hidden;color:var(--text);isolation:isolate;
    cursor:grab;transition:box-shadow var(--dur) var(--ease);
  }
  .box-cell button{cursor:pointer;}
  .box-drag.dragging .box-cell{cursor:grabbing;box-shadow:0 18px 40px rgba(0,0,0,.45);}
  .box-cell.drop-bounce{animation:boxDrop .34s ease;}
  .box-cell::after{content:'';position:absolute;top:-60%;right:-40%;width:85%;height:150%;background:var(--qg);opacity:.30;filter:blur(34px);border-radius:50%;pointer-events:none;z-index:0;}
  .box-head{position:relative;z-index:1;display:block;width:calc(100% - 22px);background:none;border:none;padding:4px 6px;margin:-4px -6px 10px;text-align:left;color:var(--text);border-radius:10px;transition:background var(--dur) var(--ease);}
  .box-head:hover{background:var(--glass-strong);}
  .box-label{font-size:16px;font-weight:700;letter-spacing:-.01em;line-height:1.25;}
  .box-meta{font-size:11px;color:var(--text-3);margin-top:2px;}
  .box-del{position:absolute;top:14px;right:14px;z-index:2;width:22px;height:22px;border-radius:50%;border:none;background:none;color:var(--text-3);display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity var(--dur) var(--ease),color var(--dur) var(--ease);padding:0;}
  .box-cell:hover .box-del{opacity:1;}
  .box-del:hover{color:var(--red);}
  .box-add-cell{align-items:center;justify-content:center;border-style:dashed;cursor:default;}
  .box-add-btn{background:none;border:none;color:var(--text-3);font-size:13px;font-weight:600;cursor:pointer;padding:10px 16px;transition:color var(--dur) var(--ease);}
  .box-add-btn:hover{color:var(--text);}
  .box-add-form{display:flex;flex-direction:column;gap:8px;width:100%;position:relative;z-index:1;}
  .box-add-form input{background:var(--glass);border:1px solid var(--border);border-radius:var(--r-pill);color:var(--text);padding:8px 14px;font-size:13px;text-align:center;}
  .box-add-form .add-row-line{display:flex;gap:6px;}
  .box-add-form .add-row-line button{flex:1;}
  .box-tasks{position:relative;z-index:1;display:flex;flex-direction:column;gap:8px;flex:1;min-width:0;}
  .box-task-row{display:flex;align-items:flex-start;gap:9px;min-width:0;cursor:grab;border-radius:7px;transition:opacity var(--dur) var(--ease);}
  .box-task-row.dragging-task{opacity:.35;}
  /* ---- 홈 할 일 카드를 길게 눌렀다 끌어서 지우기 ---- */
  .task-trash{
    position:fixed;right:22px;bottom:22px;width:60px;height:60px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;z-index:65;
    background:rgba(20,22,28,.9);-webkit-backdrop-filter:blur(var(--blur)) saturate(1.7);backdrop-filter:blur(var(--blur)) saturate(1.7);
    border:1px solid var(--border-strong);color:var(--text-2);
    opacity:0;transform:scale(.7);pointer-events:none;
    box-shadow:0 12px 28px rgba(0,0,0,.4);
    transition:opacity 200ms var(--ease),transform 200ms var(--ease),background 150ms var(--ease),border-color 150ms var(--ease),color 150ms var(--ease);
  }
  .task-trash svg{width:24px;height:24px;}
  .task-trash.visible{opacity:1;transform:scale(1);pointer-events:auto;}
  .task-trash.drag-over{background:var(--glass-press);border-color:var(--border-hi);color:var(--text);transform:scale(1.18);}
  @keyframes taskTrashPop{0%{transform:scale(1.18);}50%{transform:scale(.85);}100%{transform:scale(0);opacity:0;}}
  .task-trash.deleted{animation:taskTrashPop 320ms var(--ease) forwards;}
  .box-task-row.longpress-armed{transform:translateY(-7px) scale(1.045);z-index:20;position:relative;
    background:var(--glass-strong);box-shadow:0 16px 34px rgba(0,0,0,.5);}
  .box-cell:has(.box-task-row.longpress-armed){overflow:visible;}
  .box-cell:has(.box-task-row.longpress-armed)::after{opacity:0;}
  @media(max-width:639px){ .task-trash{right:16px;bottom:calc(80px + env(safe-area-inset-bottom));} }
  .box-task-check{width:18px;height:18px;border-radius:50%;border:1.5px solid var(--border-strong);flex-shrink:0;margin-top:1px;background:var(--glass);display:flex;align-items:center;justify-content:center;padding:0;transition:border-color var(--dur) var(--ease);}
  .box-task-check svg{width:11px;height:11px;opacity:0;transform:scale(.4);}
  .box-task-check:hover{border-color:var(--qc,var(--blue));}
  .box-task-main{min-width:0;flex:1;}
  .box-task-text{font-size:12.5px;line-height:1.4;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .box-task-tag{font-size:10px;color:var(--text-3);margin-top:1px;}
  .box-empty{font-size:11px;color:var(--text-3);}
  @media(max-width:639px){
    .box-grid{grid-template-columns:1fr;}
  }

  /* ---- 디데이 + 스톱워치를 가로로 절반씩 ---- */
  .dday-sw-row{
    display:grid;grid-template-columns:1fr 1fr;align-items:stretch;margin-bottom:20px;
    background:var(--glass);-webkit-backdrop-filter:blur(var(--blur)) saturate(1.7);backdrop-filter:blur(var(--blur)) saturate(1.7);
    border:1px solid var(--border);border-top-color:var(--border-hi);border-radius:var(--r-lg);overflow:hidden;
  }
  .dday-sw-row > *{min-width:0;}
  .dday-sw-row .dday-card{margin-bottom:0;background:none;border:none;border-radius:0;box-shadow:none;border-right:1px solid var(--border);}
  .dday-sw-row .pomo-card{margin-bottom:0;height:100%;background:none;border:none;border-radius:0;box-shadow:none;}
  @media (max-width:720px){
    .dday-sw-row{grid-template-columns:1fr;}
    .dday-sw-row .dday-card{border-right:none;border-bottom:1px solid var(--border);}
  }

  /* ---- 디데이 ---- */
  .dday-card{
    background:var(--glass);-webkit-backdrop-filter:blur(var(--blur)) saturate(1.7);backdrop-filter:blur(var(--blur)) saturate(1.7);
    border:1px solid var(--border);border-top-color:var(--border-hi);border-radius:var(--r-lg);
    padding:16px 20px;margin-bottom:20px;
  }
  .dday-card-head-row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px;}
  .dday-card-head{font-size:11px;color:var(--text-3);font-weight:700;text-transform:uppercase;letter-spacing:.06em;}
  .dday-add-toggle{display:flex;align-items:center;gap:3px;background:none;border:none;color:var(--text-3);font-size:11.5px;font-weight:600;cursor:pointer;padding:2px 2px;transition:color var(--dur) var(--ease);}
  .dday-add-toggle:hover{color:var(--text);}
  .dday-add-chevron{display:inline-flex;transition:transform var(--dur) var(--ease);}
  .dday-add-toggle.open .dday-add-chevron{transform:rotate(90deg);}
  .dday-empty{padding:6px 0;}
  .dday-item{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--border);}
  .dday-item:last-of-type{border-bottom:none;}
  .dday-item-name{flex:1;font-size:14px;font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .dday-item-val{font-size:15px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--blue);flex-shrink:0;}
  .dday-item-val.masked{font-size:12.5px;font-weight:600;color:var(--text-3);}
  .dday-eye,.dday-del{width:24px;height:24px;border-radius:50%;border:none;background:none;color:var(--text-3);flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:color var(--dur) var(--ease);padding:0;}
  .dday-eye:hover{color:var(--text);}
  .dday-del:hover{color:var(--red);}
  .dday-add-panel{overflow:hidden;max-height:0;transition:max-height 260ms var(--ease);}
  .dday-add-panel.open{max-height:170px;}
  .dday-add-row{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;}
  .dday-add-input{flex:1;min-width:100px;background:var(--glass);border:1px solid var(--border);border-radius:var(--r-pill);color:var(--text);padding:7px 13px;font-size:12.5px;}
  .dday-add-date{background:var(--glass);border:1px solid var(--border);border-radius:var(--r-pill);color:var(--text);padding:7px 13px;font-size:12.5px;}

  /* ---- 스톱워치 ---- */
  .pomo-card{
    display:flex;align-items:center;gap:18px;position:relative;
    background:var(--glass);-webkit-backdrop-filter:blur(var(--blur)) saturate(1.7);backdrop-filter:blur(var(--blur)) saturate(1.7);
    border:1px solid var(--border);border-top-color:var(--border-hi);border-radius:var(--r-lg);
    padding:16px 20px;margin-bottom:28px;flex-wrap:wrap;
    transition:border-color var(--dur) var(--ease),box-shadow var(--dur) var(--ease);
  }
  .pomo-card.drag-over{border-color:var(--blue);box-shadow:0 0 0 3px rgba(10,132,255,.35) inset;}
  .pomo-drop-hint{
    position:absolute;inset:0;border-radius:inherit;z-index:5;
    display:flex;align-items:center;justify-content:center;
    background:rgba(10,132,255,.22);border:2px dashed var(--blue);
    color:#fff;font-weight:700;font-size:14px;
    opacity:0;pointer-events:none;transition:opacity .12s ease;
  }
  .pomo-card.drag-over .pomo-drop-hint{opacity:1;}
  @keyframes pomoLinked{0%{box-shadow:0 0 0 0 rgba(48,209,88,.55);}100%{box-shadow:0 0 0 16px rgba(48,209,88,0);}}
  .pomo-card.linked-flash{animation:pomoLinked .55s ease;}
  .pomo-ring{
    width:76px;height:76px;border-radius:50%;flex-shrink:0;
    border:3px solid var(--border);
    display:flex;align-items:center;justify-content:center;position:relative;
  }
  .pomo-ring::after{
    content:'';position:absolute;inset:-3px;border-radius:50%;
    border:3px solid transparent;border-top-color:var(--blue);
    opacity:0;
  }
  .pomo-ring.running::after{opacity:1;animation:swSpin 1.6s linear infinite;}
  @keyframes swSpin{to{transform:rotate(360deg);}}
  .pomo-display{position:relative;z-index:1;font-size:14px;font-weight:700;font-variant-numeric:tabular-nums;}
  .pomo-body{flex:1;min-width:220px;display:flex;flex-direction:column;gap:8px;}
  .pomo-select{width:100%;background:var(--glass);border:1px solid var(--border);border-radius:var(--r-pill);color:var(--text);padding:7px 13px;font-size:12.5px;}
  .pomo-row{display:flex;gap:6px;flex-wrap:wrap;align-items:center;}

  .section{margin-bottom:36px;}
  .section-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:12px;gap:10px;}
  .section-title{font-size:12.5px;font-weight:600;color:var(--text-3);text-transform:uppercase;letter-spacing:.055em;}
  .section-link{font-size:12.5px;color:var(--text-3);background:none;border:none;padding:0;}
  .section-link:hover{color:var(--text);}

  .empty{color:var(--text-3);font-size:13.5px;padding:18px 0;}

  .panel{border-radius:var(--r-md);padding:6px 16px;}

  /* ---- task rows ---- */
  .task-row{display:flex;align-items:flex-start;gap:12px;padding:11px 4px;border-bottom:1px solid var(--border);}
  .task-row:last-child{border-bottom:none;}
  .task-check{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--border-strong);flex-shrink:0;margin-top:1px;background:var(--glass);display:flex;align-items:center;justify-content:center;transition:background var(--dur) var(--ease),border-color var(--dur) var(--ease);padding:0;}
  .task-check:hover{border-color:var(--blue);}
  .task-check svg{opacity:0;transform:scale(.4);transition:all var(--dur) var(--ease);}
  .task-row.done .task-check{background:var(--blue);border-color:var(--blue);}
  .task-row.done .task-check svg{opacity:1;transform:scale(1);}
  .task-body{flex:1;min-width:0;}
  .task-tag{font-size:12px;color:var(--text-3);margin-bottom:2px;}
  .task-text{font-size:14.5px;line-height:1.5;transition:color var(--dur) var(--ease);word-break:break-word;}
  .task-row.done .task-text{color:var(--text-3);text-decoration:line-through;text-decoration-color:var(--border-strong);}
  .task-badge{font-size:11px;color:var(--text-3);flex-shrink:0;margin-top:3px;font-variant-numeric:tabular-nums;}
  .task-del{width:22px;height:22px;border-radius:50%;border:none;background:none;color:var(--text-3);flex-shrink:0;display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity var(--dur) var(--ease);}
  .task-row:hover .task-del{opacity:1;}
  .task-del:hover{color:var(--red);}
  .task-row.stale{position:relative;padding-left:13px;}
  .task-row.stale::before{content:'';position:absolute;left:0;top:9px;bottom:9px;width:3px;border-radius:3px;background:var(--orange);animation:taskStaleGlow 2.4s ease-in-out infinite;}
  @keyframes taskStaleGlow{0%,100%{opacity:.4;}50%{opacity:1;}}
  .task-stale-badge{font-size:10.5px;color:var(--orange);font-weight:600;margin-top:3px;}
  .box-task-row.stale .box-task-tag{color:var(--orange);font-weight:600;}

  /* ---- assignment rows ---- */
  .asg-row{display:flex;align-items:center;gap:14px;padding:13px 4px;border-bottom:1px solid var(--border);}
  .asg-row:last-child{border-bottom:none;}
  .asg-row.done{opacity:.4;}
  .asg-check{width:22px;height:22px;border-radius:7px;border:1.5px solid var(--border-strong);flex-shrink:0;background:var(--glass);display:flex;align-items:center;justify-content:center;padding:0;transition:all var(--dur) var(--ease);}
  .asg-row.done .asg-check{background:var(--green);border-color:var(--green);}
  .asg-check svg{opacity:0;transform:scale(.4);transition:all var(--dur) var(--ease);}
  .asg-row.done .asg-check svg{opacity:1;transform:scale(1);}
  .asg-main{flex:1;min-width:0;}
  .asg-tag{font-size:12px;color:var(--text-3);}
  .asg-title{font-size:14.5px;margin-top:1px;word-break:break-word;}
  .asg-row.done .asg-title{text-decoration:line-through;text-decoration-color:var(--border-strong);}
  .asg-due{font-size:12.5px;color:var(--text-2);flex-shrink:0;font-variant-numeric:tabular-nums;white-space:nowrap;}
  .asg-due.urgent{color:var(--orange);font-weight:600;}
  .asg-due.overdue{color:var(--red);font-weight:600;}
  .asg-del{width:24px;height:24px;border-radius:50%;border:none;background:none;color:var(--text-3);flex-shrink:0;display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity var(--dur);}
  .asg-row:hover .asg-del{opacity:1;}
  .asg-del:hover{color:var(--red);}
  .asg-row.asg-complete-anim{pointer-events:none;overflow:hidden;animation:asgCollapse 260ms cubic-bezier(.4,0,.2,1) 260ms forwards;}
  .asg-row.asg-complete-anim .asg-check{background:var(--green);border-color:var(--green);transform:scale(1.08);transition:all 240ms cubic-bezier(.34,1.56,.64,1);}
  .asg-row.asg-complete-anim .asg-check svg{opacity:1;transform:scale(1);transition:all 240ms cubic-bezier(.34,1.56,.64,1) 30ms;}
  .asg-row.asg-complete-anim .asg-title{text-decoration:line-through;text-decoration-color:var(--border-strong);transition:text-decoration-color 200ms var(--ease);}
  @keyframes asgCollapse{
    0%{opacity:1;max-height:200px;transform:translateX(0);}
    60%{opacity:0;max-height:200px;transform:translateX(48px);}
    100%{opacity:0;max-height:0;margin-top:0;margin-bottom:0;padding-top:0;padding-bottom:0;border-bottom-width:0;transform:translateX(48px);}
  }
  .asg-priority{display:flex;align-items:center;gap:6px;margin-top:7px;}
  .asg-priority-label{font-size:11px;color:var(--text-3);}
  .pri-btn{background:var(--glass);border:1px solid var(--border);color:var(--text-3);border-radius:var(--r-pill);padding:3px 11px;font-size:11px;font-weight:600;}
  .pri-btn.active[data-val="high"]{background:var(--red);border-color:var(--red);color:#fff;}
  .pri-btn.active[data-val="mid"]{background:var(--blue);border-color:var(--blue);color:#fff;}
  .pri-btn.active[data-val="low"]{background:rgba(255,255,255,.22);border-color:var(--border-strong);color:var(--text);}

  .sync-health{font-size:12px;color:var(--text-3);padding:0 0 14px;}
  .sync-health.warn{color:var(--orange);font-weight:600;}


  /* ---- 아카이브 ---- */
  .arc-subject-row{margin-bottom:16px;}
  .arc-subject-head{display:flex;justify-content:space-between;align-items:baseline;font-size:13.5px;margin-bottom:6px;}
  .arc-subject-head span{font-size:11.5px;color:var(--text-3);}
  .arc-bar{display:flex;height:8px;border-radius:4px;overflow:hidden;background:var(--glass-strong);}
  .arc-bar-seg{height:100%;}
  .arc-bar-empty{font-size:11.5px;color:var(--text-3);}
  .arc-log-row{display:flex;gap:10px;align-items:baseline;padding:8px 0;border-bottom:1px solid var(--border);font-size:12.5px;}
  .arc-log-row:last-child{border-bottom:none;}
  .arc-log-date{color:var(--text-3);flex-shrink:0;width:34px;}
  .arc-log-subject{color:var(--text-2);flex-shrink:0;max-width:80px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .arc-log-text{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .arc-log-rating{color:var(--text-3);flex-shrink:0;font-size:11px;}

  /* ---- 완료 후기 — 화면을 덮지 않고 구석에 뜨는 대화창(오버레이 없음) ---- */
  .btn[disabled]{opacity:.4;cursor:not-allowed;}
  .feedback-dock{position:fixed;right:18px;bottom:18px;width:340px;max-width:calc(100vw - 36px);z-index:70;
    background:rgba(20,22,28,.92);-webkit-backdrop-filter:blur(var(--blur)) saturate(1.7);backdrop-filter:blur(var(--blur)) saturate(1.7);
    border:1px solid var(--border-strong);border-top-color:var(--border-hi);border-radius:var(--r-lg);
    box-shadow:0 18px 48px rgba(0,0,0,.55);animation:dockIn 260ms var(--ease);}
  @keyframes dockIn{from{opacity:0;transform:translateY(12px);}to{opacity:1;transform:none;}}
  .feedback-dock-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px 8px;font-size:13.5px;}
  .feedback-dock-body{padding:0 14px 14px;max-height:min(70vh,520px);overflow-y:auto;}
  .feedback-ratings{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px;}
  .feedback-ratings .btn-outline.is-selected{background:var(--blue);border-color:var(--blue);color:#fff;}
  .feedback-dock-actions{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:12px;}
  .feedback-hint{font-size:11.5px;color:var(--text-3);line-height:1.55;margin-bottom:10px;}
  .feedback-explain-label{font-size:13px;font-weight:600;color:var(--text-2);margin-bottom:4px;}
  @media(max-width:639px){ .feedback-dock{right:12px;left:12px;bottom:calc(76px + env(safe-area-inset-bottom));width:auto;} }

  /* ---- D-day 역산 타임라인 ---- */
  .dday-legend{font-size:11.5px;color:var(--text-3);margin:0 14px 6px;display:flex;align-items:center;gap:5px;flex-wrap:wrap;}
  .dday-legend-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--orange);flex-shrink:0;}
  .dday-legend-dot.overdue{background:var(--red);}
  .dday-timeline{position:relative;height:92px;margin:4px 14px 28px;}
  .dday-track{position:absolute;left:0;right:0;bottom:26px;height:2px;background:var(--border);}
  .dday-today{position:absolute;bottom:20px;width:2px;height:14px;background:var(--blue);box-shadow:0 0 8px rgba(10,132,255,.7);}
  .dday-cluster{position:absolute;bottom:26px;display:flex;flex-direction:column-reverse;align-items:center;gap:3px;transform:translateX(-50%);cursor:default;}
  .dday-dot{width:9px;height:9px;border-radius:50%;background:var(--orange);flex-shrink:0;border:1.5px solid var(--bg);box-shadow:0 0 0 1px var(--border);}
  .dday-dot.overdue{background:var(--red);}
  .dday-count{font-size:9.5px;color:var(--text-3);}
  .dday-label{position:absolute;bottom:0;font-size:10.5px;color:var(--text-3);white-space:nowrap;}
  .dday-label.start{left:0;color:var(--blue);font-weight:600;}
  .dday-label.end{right:0;}

  .asg-form{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:24px;padding-bottom:24px;border-bottom:1px solid var(--border);align-items:center;}
  .asg-form input{background:var(--glass);border:1px solid var(--border);border-radius:var(--r-pill);color:var(--text);padding:9px 14px;font-size:13px;}
  .asg-form input.title{flex:2;min-width:180px;}
  .asg-form input.date{flex:1;min-width:130px;}
  .asg-form input.tag{flex:1;min-width:110px;}
  .btn{background:var(--blue);color:#fff;border:none;border-radius:var(--r-pill);padding:9px 20px;font-size:13.5px;font-weight:600;transition:filter var(--dur) var(--ease),transform var(--dur) var(--ease);}
  .btn:hover{filter:brightness(1.12);}
  .btn:active{transform:scale(.97);}
  .btn-outline{background:var(--glass);-webkit-backdrop-filter:blur(var(--blur));backdrop-filter:blur(var(--blur));border:1px solid var(--border-strong);color:var(--text);border-radius:var(--r-pill);padding:9px 20px;font-size:13.5px;font-weight:600;transition:all var(--dur) var(--ease);}
  .btn-outline:hover{background:var(--glass-strong);}
  .btn-outline:active{transform:scale(.97);}
  .btn-danger{background:var(--red);color:#fff;border:none;border-radius:var(--r-pill);padding:9px 20px;font-size:13.5px;font-weight:600;transition:filter var(--dur) var(--ease);}
  .btn-danger:hover{filter:brightness(1.12);}

  /* ---- schedule ---- */
  .sched-row{display:flex;align-items:center;gap:16px;padding:10px 6px;border-bottom:1px solid var(--border);font-size:14px;border-radius:10px;}
  .sched-row:last-child{border-bottom:none;}
  .sched-row .p{width:46px;color:var(--text-3);font-size:12.5px;flex-shrink:0;}
  .sched-row .s-main{flex:1;min-width:0;}
  .sched-row .s-teacher{font-size:12.5px;color:var(--text-3);margin-top:1px;}
  .sched-row.today{background:rgba(10,132,255,.14);padding-left:10px;padding-right:10px;margin:0 -10px;border-bottom:none;}
  .sched-row.today .s-main{font-weight:600;}
  .sched-row.clickable{cursor:pointer;transition:background var(--dur) var(--ease);}
  .sched-row.clickable:hover{background:var(--glass);padding-left:10px;padding-right:10px;margin:0 -10px;border-bottom-color:transparent;}
  .sched-row.clickable:hover .sched-add{opacity:1;}
  .sched-add{width:22px;height:22px;border-radius:50%;background:var(--glass-strong);color:var(--purple);display:flex;align-items:center;justify-content:center;flex-shrink:0;opacity:0;transition:opacity var(--dur) var(--ease);}
  .wcell.clickable{cursor:pointer;transition:background var(--dur) var(--ease);}
  .wcell.clickable:hover{background:var(--glass-strong);}

  .week-grid{display:grid;grid-template-columns:52px repeat(5,1fr);gap:1px;background:var(--border);border:1px solid var(--border);border-top-color:var(--border-hi);border-radius:var(--r-md);overflow:hidden;-webkit-backdrop-filter:blur(var(--blur)) saturate(1.7);backdrop-filter:blur(var(--blur)) saturate(1.7);}
  .week-grid .wcell{background:rgba(255,255,255,.03);padding:9px 8px;font-size:12px;min-height:52px;}
  .week-grid .whead{background:rgba(255,255,255,.07);font-size:12px;color:var(--text-3);font-weight:600;text-align:center;padding:9px 4px;}
  .week-grid .whead.today{color:var(--blue);}
  .week-grid .wcell.today{background:rgba(10,132,255,.14);}
  .week-grid .wcell .subj{font-weight:600;font-size:12.5px;}
  .week-grid .wcell .who{color:var(--text-3);font-size:11px;margin-top:2px;}
  .week-grid .wcell.empty{color:var(--text-3);}
  .week-stack{display:none;}
  @media(max-width:639px){
    .week-grid-wrap{display:none;}
    .week-stack{display:flex;flex-direction:column;gap:20px;}
    .week-day-block h3{font-size:13px;color:var(--text-2);margin:0 0 8px;font-weight:600;}
  }

  /* ---- teachers ---- */
  .teacher-group{margin-bottom:26px;}
  .teacher-group-label{font-size:12.5px;font-weight:600;color:var(--text-3);text-transform:uppercase;letter-spacing:.05em;margin-bottom:8px;padding:0 4px;}
  .teacher-row{border-bottom:1px solid var(--border);}
  .teacher-row:last-child{border-bottom:none;}
  .teacher-head{display:flex;align-items:center;gap:12px;padding:13px 4px;background:none;border:none;width:100%;text-align:left;color:var(--text);border-radius:10px;}
  .teacher-head:hover{background:var(--glass);}
  .teacher-name{font-size:15px;font-weight:500;flex:1;}
  .teacher-subj{font-size:12.5px;color:var(--text-3);}
  .teacher-dot{width:7px;height:7px;border-radius:50%;background:var(--blue);flex-shrink:0;box-shadow:0 0 6px rgba(10,132,255,.7);}
  .teacher-chevron{color:var(--text-3);transition:transform var(--dur) var(--ease);flex-shrink:0;}
  .teacher-row.open .teacher-chevron{transform:rotate(90deg);}
  .teacher-detail{overflow:hidden;max-height:0;transition:max-height 260ms var(--ease);}
  .teacher-row.open .teacher-detail{max-height:4000px;}
  .teacher-detail-inner{padding:10px 4px 28px;}

  .field-label{font-size:12px;color:var(--text-3);margin-bottom:7px;display:flex;align-items:center;gap:6px;}
  .field-box{margin-bottom:16px;}
  .field-box textarea{width:100%;min-height:44px;resize:vertical;background:var(--glass);-webkit-backdrop-filter:blur(var(--blur));backdrop-filter:blur(var(--blur));border:1px solid var(--border);border-radius:var(--r-md);color:var(--text);padding:11px 13px;font-size:13.5px;line-height:1.55;}
  .field-box textarea::placeholder{color:var(--text-3);}

  .corner-tabs{display:inline-flex;gap:2px;margin-bottom:16px;padding:3px;border-radius:var(--r-pill);background:var(--glass);-webkit-backdrop-filter:blur(var(--blur));backdrop-filter:blur(var(--blur));border:1px solid var(--border);}
  .corner-tab{background:none;border:none;padding:7px 14px;border-radius:var(--r-pill);font-size:12.5px;color:var(--text-2);transition:all var(--dur) var(--ease);}
  .corner-tab.active{color:var(--text);background:var(--glass-strong);font-weight:600;}
  .corner-tab .n{color:inherit;opacity:.6;font-weight:400;}

  .add-row{display:flex;gap:8px;margin-bottom:14px;}
  .add-row input,.add-row select{flex:1;background:var(--glass);border:1px solid var(--border);border-radius:var(--r-pill);color:var(--text);padding:9px 15px;font-size:13px;min-width:0;}
  .add-row input::placeholder{color:var(--text-3);}

  .rep-row{display:flex;align-items:center;gap:8px;margin-top:8px;}
  .rep-btn{font-size:11px;background:var(--glass);border:1px solid var(--border);color:var(--text-2);border-radius:var(--r-pill);padding:4px 11px;}
  .rep-count{font-size:11px;color:var(--text-3);}
  .retry-btn{width:22px;height:22px;border-radius:50%;border:1px solid var(--border);background:var(--glass);color:var(--text-3);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .retry-btn.on{color:#fff;border-color:var(--red);background:var(--red);}
  .meter{position:relative;height:4px;background:var(--border);border-radius:4px;margin-top:9px;max-width:220px;}
  .meter .fill{position:absolute;left:0;top:0;height:100%;border-radius:4px;background:linear-gradient(90deg,var(--blue),var(--purple));}

  .ot-box{border:1px solid var(--border);border-top-color:var(--border-hi);border-radius:var(--r-lg);padding:18px;margin-top:26px;background:var(--glass);-webkit-backdrop-filter:blur(var(--blur)) saturate(1.7);backdrop-filter:blur(var(--blur)) saturate(1.7);}
  .ot-head{font-size:13.5px;font-weight:600;margin-bottom:10px;}
  .ot-textarea{width:100%;min-height:72px;background:var(--glass);border:1px solid var(--border);border-radius:var(--r-md);color:var(--text);padding:11px 13px;font-size:13px;margin-bottom:10px;}
  .ot-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
  .ot-status{font-size:11.5px;color:var(--text-3);}
  .ot-note{font-size:11px;color:var(--text-3);margin-top:9px;line-height:1.5;}

  .completed-link{font-size:12.5px;color:var(--text-3);background:none;border:none;padding:0;margin-top:8px;}
  .completed-link:hover{color:var(--text);}

  /* ---- materials/notices ---- */
  .mat-row{display:flex;flex-direction:column;gap:2px;padding:11px 4px;border-bottom:1px solid var(--border);}
  .mat-row:last-child{border-bottom:none;}
  .mat-title{font-size:13.5px;}
  .mat-tag{font-size:12px;color:var(--text-3);}
  .row-link{color:var(--blue);text-decoration:none;display:inline-flex;align-items:center;gap:4px;}
  .row-link:hover{text-decoration:underline;}
  .row-link svg{opacity:.8;flex-shrink:0;}

  /* ---- AI classify box ---- */
  .ai-box{border:1px solid var(--border);border-top-color:var(--border-hi);border-radius:var(--r-lg);padding:16px 18px;margin-bottom:26px;background:var(--glass);-webkit-backdrop-filter:blur(var(--blur)) saturate(1.7);backdrop-filter:blur(var(--blur)) saturate(1.7);}
  .ai-box .ai-head{font-size:13.5px;font-weight:600;margin-bottom:4px;display:flex;align-items:center;gap:7px;}
  .ai-box .ai-head svg{color:var(--purple);}
  .ai-box .ai-desc{font-size:11.5px;color:var(--text-3);margin-bottom:10px;line-height:1.55;}
  .ai-textarea{width:100%;min-height:64px;background:var(--glass);border:1px solid var(--border);border-radius:var(--r-md);color:var(--text);padding:11px 13px;font-size:13px;margin-bottom:10px;}
  .ai-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
  .ai-status{font-size:11.5px;color:var(--text-3);}
  .btn-ai{background:linear-gradient(135deg,var(--purple),var(--blue));color:#fff;border:none;border-radius:var(--r-pill);padding:9px 18px;font-size:13.5px;font-weight:600;display:inline-flex;align-items:center;gap:6px;transition:filter var(--dur) var(--ease);}

  /* ---- settings modal ---- */

<script>
(function(){
  "use strict";

  /* ============ 로그인 (Supabase) ============
     아래 두 값이 채워지기 전까지는 로그인 없이 게스트 모드로 그냥 동작한다.
     supabase.com에서 프로젝트를 만든 뒤 Project Settings → API에서 값을 복사해 넣으면
     그 순간부터 이메일 매직 링크 로그인 화면이 켜진다. */
  const SUPABASE_URL = 'https://emgsydavlzdzfkbsihpx.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVtZ3N5ZGF2bHpkemZrYnNpaHB4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc3ODY0ODIsImV4cCI6MjEwMzM2MjQ4Mn0.EoeaLGX94bIETQh14zPjnMW6sP5b3JFh3JyiUCZlSuE';
  // window.supabase가 없으면(CDN 로드 실패 등) 앱 전체가 죽지 않고 게스트 모드로 내려가야 함
  const sb = (SUPABASE_URL.indexOf('https://')===0 && SUPABASE_ANON_KEY && window.supabase)
    ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;
  let authSession = null;
  // sb가 있으면 처음부터 "확인 중" 상태로 시작해야, initAuth()가 끝나기 전에 첫 렌더가
  // 로그인 폼을 잠깐 반짝였다 사라지는 일 없이 곧장 로딩 화면부터 보여줄 수 있다
  let authChecking = !!sb;
  // 계정이 바뀔 때만(로그인/로그아웃) 클라우드와 동기화하고, 토큰 갱신 같은 부수적인
  // auth 이벤트에서는 다시 끌어오지 않기 위해 마지막으로 동기화한 사용자 id를 기억해둠
  let lastSyncedUserId = null;
  async function handleAuthChange(session){
    if(!sb) return;
    if(!session){
      authSession = null;
      lastSyncedUserId = null;
      // 로그아웃하면 이 브라우저의 데이터는 그 계정 것이었으니 화면에서 지운다 —
      // 실제 데이터는 클라우드에 남아있고, 다시 로그인하면 pullCloudData가 복원해줌
      state.data = buildSkeleton();
      persistLocal();
      authChecking = false;
      render();
      return;
    }
    authSession = session;
    if(session.user.id === lastSyncedUserId){
      authChecking = false;
      render();
      return;
    }
    authChecking = true;
    render();
    await pullCloudData(session.user.id);
    lastSyncedUserId = session.user.id;
    authChecking = false;
    render();
  }
  async function initAuth(){
    if(!sb) return;
    authChecking = true;
    // 리스너를 먼저 걸어야 함 — getSession()을 먼저 기다리면 그 사이에 Google 리다이렉트로
    // 막 로그인된 이벤트가 지나가버려서 로그인 화면에 계속 머무는 경우가 생김
    sb.auth.onAuthStateChange((_event, session)=>{ handleAuthChange(session); });
    const { data } = await sb.auth.getSession();
    if(data.session){ await handleAuthChange(data.session); }
    else { authChecking = false; render(); }
  }
  // Google 로그인은 Supabase 대시보드 Authentication → Providers → Google에서
  // Client ID/Secret을 등록해야 실제로 동작함 (등록 전엔 눌러도 에러만 뜸)
  async function signInGoogle(){
    if(!sb) return;
    await sb.auth.signInWithOAuth({ provider:'google', options:{ redirectTo: window.location.href } });
  }
  async function signOut(){
    state.modal = null;
    if(sb) await sb.auth.signOut();
    await handleAuthChange(null);
  }
  // 로그인은 강제 게이트가 아니라 사이드바/설정에 있는 버튼으로 선택하는 부가 기능임 —
  // 로그인 안 해도 이 브라우저에 바로 저장되고, 로그인하면 그 계정 클라우드로도 동기화됨
  function renderSidebarAuth(){
    if(!sb) return '';
    if(authChecking) return `<div class="sidebar-auth-status">계정 확인 중...</div>`;
    if(authSession) return `<div class="sidebar-account">
      <div class="sidebar-account-email">${escapeHtml(authSession.user.email||'')}</div>
      <button class="footer-link" style="padding:2px 0;" data-action="signOut">로그아웃</button>
    </div>`;
    return `<button class="btn-google sidebar-login-btn" data-action="signInGoogle">
      <svg width="15" height="15" viewBox="0 0 18 18"><path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84a4.14 4.14 0 0 1-1.8 2.72v2.26h2.92c1.7-1.57 2.68-3.88 2.68-6.62z"/><path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.92-2.26c-.81.54-1.84.87-3.04.87-2.34 0-4.32-1.58-5.03-3.7H.96v2.33A9 9 0 0 0 9 18z"/><path fill="#FBBC05" d="M3.97 10.73A5.4 5.4 0 0 1 3.68 9c0-.6.1-1.19.28-1.73V4.94H.96A9 9 0 0 0 0 9c0 1.45.35 2.83.96 4.06l3.01-2.33z"/><path fill="#EA4335" d="M9 3.58c1.32 0 2.51.45 3.44 1.35l2.59-2.59C13.46.89 11.43 0 9 0A9 9 0 0 0 .96 4.94l3.01 2.33C4.68 5.16 6.66 3.58 9 3.58z"/></svg>
      로그인해서 저장
    </button>`;
  }

  /* ============ 광고 배너 ============
     AdSense 승인 후 아래 두 값(ca-pub-... / 광고 단위 슬롯 ID)을 채우면 실제 광고로 바뀐다.
     비어있는 동안은 자리만 차지하는 플레이스홀더를 보여준다. */
  const ADSENSE_PUBLISHER_ID = '';
  const ADSENSE_SLOT_ID = '';
  function renderAdSlot(place){
    const cls = place==='sidebar' ? 'ad-slot ad-slot-sidebar' : 'ad-slot';
    if(!ADSENSE_PUBLISHER_ID || !ADSENSE_SLOT_ID){
      return `<div class="${cls} ad-slot-placeholder"></div>`;
    }
    return `<div class="${cls}"><ins class="adsbygoogle" style="display:block;width:100%;"
      data-ad-client="${ADSENSE_PUBLISHER_ID}" data-ad-slot="${ADSENSE_SLOT_ID}"
      data-ad-format="auto" data-full-width-responsive="true"></ins></div>`;
  }

  const DAYNAME = ['일','월','화','수','목','금','토'];
  const CORNER_LABELS = {review:'수업 과제', self:'자율학습'};

  function genId(){ return 'i'+Date.now().toString(36)+Math.random().toString(36).slice(2,7); }

  // 특정 요일에 시간표가 걸린 게 아니라 매일 필요할 때 등록하는 개인 할 일이라, 요일별
  // 시간표 개념 없이 "할 일" 하나가 곧 시민 하나(자동차/집)가 되는 단순한 구조로 감
  function mondayOf(d){
    const x = new Date(d.getFullYear(), d.getMonth(), d.getDate());
    const day = x.getDay();
    x.setDate(x.getDate() + (day===0 ? -6 : 1-day));
    return x;
  }

  // 과목 박스 색은 고정 팔레트를 순서대로 배정해서 매번 시각적으로 구분되게 한다
  const BOX_PALETTE = [
    { qc:'var(--blue)',   qg:'linear-gradient(135deg,var(--blue),var(--indigo))' },
    { qc:'var(--green)',  qg:'linear-gradient(135deg,var(--green),var(--teal))' },
    { qc:'var(--orange)', qg:'linear-gradient(135deg,var(--orange),var(--pink))' },
    { qc:'var(--purple)', qg:'linear-gradient(135deg,var(--purple),var(--pink))' },
    { qc:'var(--teal)',   qg:'linear-gradient(135deg,var(--teal),var(--blue))' },
    { qc:'var(--red)',    qg:'linear-gradient(135deg,var(--red),var(--orange))' },
    { qc:'var(--indigo)', qg:'linear-gradient(135deg,var(--indigo),var(--purple))' },
    { qc:'var(--pink)',   qg:'linear-gradient(135deg,var(--pink),var(--red))' }
  ];
  function buildSkeleton(){
    return { tasks:[], completed:[], assignments:[], ddays:[], boxes:[], archiveLog:[] };
  }

  /* ============ 오늘 정보 ============ */
  const now = new Date();
  const DAYNAME_FULL = ['일요일','월요일','화요일','수요일','목요일','금요일','토요일'];
  const MONTHNAME = ['1월','2월','3월','4월','5월','6월','7월','8월','9월','10월','11월','12월'];

  const todayMid = new Date(now.getFullYear(),now.getMonth(),now.getDate()).getTime();

        updated_at: new Date().toISOString()

          ddays: data.data.ddays || [],

          archiveLog: data.data.archiveLog || []

  const NAV_ITEMS = [

  /* ============ 렌더 ============
     홈→할일→과제→아카이브→도시 전체가 화면 전환 없이 한 장의 긴 페이지처럼 이어져서
     그려진다(애플 홈페이지처럼). 실제 브라우저 스크롤만 쓰고, 지금 보고 있는 섹션은
     스크롤 위치를 직접 계산해서 판단한다(가짜로 탭을 갈아치우지 않음). */
  const SCROLL_CHAIN = ['home','tasks','assignments','archive','city'];
  const SCROLL_TRIGGER_LINE = 140; // 뷰포트 위에서 이 지점을 넘어간 섹션을 "지금 보는 중"으로 간주
  let lastRenderedView = null; // 같은 화면 안에서 다시 그릴 땐(체크박스 클릭 등) fade-in을 안 태우려고 추적
  let chainModeActive = false;

  function renderChainSection(v){
    switch(v){
      case 'home': return renderHome();
      case 'tasks': return renderTasksPage();
      case 'assignments': return renderAssignmentsPage();
      case 'archive': return renderArchivePage();
      case 'city': return renderCityPage();
      default: return '';

  function captureFeedbackDraft(){
    const el = document.getElementById('feedbackNoteInput');
    const dock = document.querySelector('.feedback-dock');
    if(!el || !el.value) return null;
    return {target: dock ? dock.dataset.target : '', text: el.value};
  }
  function restoreFeedbackDraft(draft){
    if(!draft) return;
    const el = document.getElementById('feedbackNoteInput');
    const dock = document.querySelector('.feedback-dock');
    if(!el || !dock) return;
    if(dock.dataset.target !== draft.target) return; // 다른 항목의 대화창이면 비워둔다
    el.value = draft.text;
  }
  // 모달·대화창만 여닫는 경우엔 본문 전체를 다시 그릴 이유가 없다(측정상 전체 렌더가
  // 훨씬 비싸므로). 본문 데이터가 바뀌는 액션에는 절대 쓰지 말 것 — 화면이 안 바뀜.
  function renderOverlaysOnly(){

  function render(){

    let restoreOffset = null;

    }).join('');
    app.classList.toggle('chain-mode', chainModeActive);

    // 3D 도시 캔버스는 #app 바깥에 살아있으므로 갈아엎은 뒤 제자리에 다시 끼워 넣는다

      // 클릭할 때마다 화면 전체가 깜빡이는 것 방지 — 실제로 다른 화면으로 이동할 때만 페이드인
      const fadeEl = app.querySelector('.fade-in');

    document.querySelectorAll('.modal-overlay, .feedback-dock').forEach(el=>el.remove());
    if(state.modal==='settings') document.body.insertAdjacentHTML('beforeend', renderSettingsModal());

    if(pendingScrollTarget){

      if(sec) window.scrollTo(0, sec.offsetTop);

      const sec = document.getElementById('sec-'+restoreOffset.id);
      if(sec) window.scrollTo(0, sec.offsetTop + restoreOffset.rel);
    } else if(!wasChainMode){
      window.scrollTo(0, 0); // 첫 진입 시 맨 위(홈)부터
    }
    updateActiveSectionFromScroll();
    updateNavActiveClasses();
  }

  // 지금 뷰포트 위쪽 트리거 라인을 넘어간 마지막 섹션을 "활성 섹션"으로 판단한다.
  function updateActiveSectionFromScroll(){
    if(!chainModeActive) return;
    let best = null;
    for(const v of SCROLL_CHAIN){
      const el = document.getElementById('sec-'+v);
      if(!el) continue;
      if(el.getBoundingClientRect().top <= SCROLL_TRIGGER_LINE) best = v; else break;
    }
    if(!best) best = SCROLL_CHAIN[0];
    if(best !== state.activeSection){
      const prev = state.activeSection;
      state.activeSection = best;
      state.view = best;
      updateNavActiveClasses();
      // 홈 미리보기 ↔ 도시 섹션 사이를 넘나들 때만 캔버스를 다시 옮겨 끼운다(둘 다 슬롯을 가짐)
      if(best==='home' || best==='city' || prev==='home' || prev==='city') mountCity3D();
    }
    if(best==='city' || best==='home') startCityLoop(); else stopCityLoop();
  }
  function updateNavActiveClasses(){
    const activeKey = chainModeActive ? state.activeSection : state.view;
    document.querySelectorAll('.nav-item[data-view]').forEach(btn=>{
      btn.classList.toggle('active', btn.dataset.view === activeKey);
    });
  }
  let chainScrollTicking = false;
  function onChainScroll(){
    if(!chainModeActive || chainScrollTicking) return;
    chainScrollTicking = true;
    requestAnimationFrame(()=>{ chainScrollTicking = false; updateActiveSectionFromScroll(); });
  }
  window.addEventListener('scroll', onChainScroll, {passive:true});

  /* 아이콘만 있는 버튼은 스크린리더에서 그냥 "버튼"으로 읽힌다. title이 있는 건
     aria-label로 옮기고, 체크/닫기처럼 title이 없는 것들만 이름을 지어준다. */
  const A11Y_FALLBACK = [
    ['.modal-close', '닫기'],
    ['.task-check, .box-task-check, .asg-check', '완료 처리'],
    ['[data-action="openNotifications"]', '알림'],
    ['[data-action="openSettings"]', '설정']
  ];
  function applyA11yLabels(){
    A11Y_FALLBACK.forEach(([sel, label])=>{
      document.querySelectorAll(sel).forEach(el=>{
        if(!el.getAttribute('aria-label') && !el.getAttribute('title')) el.setAttribute('aria-label', label);
      });
    });
    document.querySelectorAll('button[title]:not([aria-label])').forEach(b=>{
      b.setAttribute('aria-label', b.getAttribute('title'));
    });
  }

      <div class="sidebar-brand" data-action="goView" data-view="home"><div class="mark"></div><b>City of Brain</b></div>

        ${renderSidebarAuth()}
        <button class="nav-item" data-action="openSettings"><span class="nav-icon" style="--nc:rgba(255,255,255,.16)">${icon('settings')}</span><span class="label">설정</span></button>
        <button class="footer-link" data-action="openPrivacy">개인정보처리방침</button>
      </div>
    </div>`;
  }
  function renderBottomNav(){
    const activeKey = chainModeActive ? state.activeSection : state.view;
    const items = NAV_ITEMS.map(n=>`
      <button class="nav-item ${activeKey===n.view?'active':''}" data-action="goView" data-view="${n.view}">
        <span class="nav-icon" style="--nc:${n.color}">${icon(n.icon)}</span><span class="label">${n.label}</span>
      </button>`).join('');
    return `<div class="bottom-nav glass">${items}</div>`;
  }
  function computeNotifications(){
    const list = [];
    (state.data.ddays||[]).forEach(d=>{
      if(d.hidden) return;
      const dueMid = new Date(d.date+'T00:00:00').getTime();
      const daysLeft = Math.round((dueMid-todayMid)/86400000);
      if(daysLeft===7) list.push(`"${d.name}" 디데이가 일주일 남았어요 (D-7)`);
    });
    (state.data.assignments||[]).filter(a=>!a.done).forEach(a=>{
      const dueMid = new Date(a.dueDate+'T00:00:00').getTime();
      const daysLeft = Math.round((dueMid-todayMid)/86400000);
      if(daysLeft===3) list.push(`"${a.title}" 마감이 3일 남았어요`);
      if(daysLeft===1) list.push(`"${a.title}" 마감이 내일이에요`);
    });
    return list;
  }
  function renderTopbarMini(){
    const n = computeNotifications().length;
    return `<div class="topbar-mini"><button class="iconbtn" data-action="openNotifications">${icon('bell')}${n>0?`<span class="notif-badge">${n}</span>`:''}</button></div>`;
  }
  function renderNotificationsModal(){
    const notes = computeNotifications();
    const notesHtml = notes.length===0 ? `<div class="empty">지금은 알림이 없어요.</div>` : notes.map(n=>`<div class="notif-row">${escapeHtml(n)}</div>`).join('');
    return `<div class="modal-overlay" data-action="closeModal">
      <div class="modal" style="max-width:380px;">
        <div class="modal-head"><h2>알림</h2><button class="modal-close" data-action="closeModal">${icon('close')}</button></div>
        <div class="modal-body">
          ${lastCompletion?`<div class="settings-group">
            <h3>마지막 완료 취소</h3>
            <div class="desc">"${escapeHtml(lastCompletion.text)}" 방금 끝낸 걸 잘못 눌렀으면 되돌릴 수 있어요.</div>
            <button class="btn-outline" data-action="undoLastCompletion">되돌리기</button>
          </div>`:''}
          <div class="settings-group">
            <h3>다가오는 일정</h3>
            ${notesHtml}
          </div>
        </div>
      </div>
    </div>`;
  }

  /* ---- Home: 유저가 직접 만드는 과목 박스 ----
     처음엔 박스가 하나도 없다가, 유저가 필요한 과목/분야를 직접 이름 붙여서 추가해간다.
     색은 고정 팔레트를 순서대로 배정해서 매번 시각적으로 구분되게 한다. */
  function boxes(){ return state.data.boxes; }
  function findBox(key){ return state.data.boxes.find(b=>b.key===key) || null; }
  function hasBox(key){ return !!findBox(key); }
  function addBox(label){
    label = (label||'').trim(); if(!label) return;
    const color = BOX_PALETTE[state.data.boxes.length % BOX_PALETTE.length];
    state.data.boxes.push({key:genId(), label, qc:color.qc, qg:color.qg});
    state.boxAddOpen = false;
    persist(); render();
  }
  function deleteBox(key){
    if(!confirm('이 과목을 지우면 여기 달려있던 할 일들은 "미분류"로 남아요. 지울까요?')) return;
    state.data.boxes = state.data.boxes.filter(b=>b.key!==key);
    state.data.tasks.forEach(t=>{ if(t.boxKey===key) t.boxKey=null; });
    state.data.completed.forEach(t=>{ if(t.boxKey===key) t.boxKey=null; });
    persist(); render();
  }
  function toggleBoxAdd(){ state.boxAddOpen = !state.boxAddOpen; render(); }
  function submitAddBox(){
    const input = document.getElementById('newBoxName');
    addBox(input ? input.value : '');
  }

  // 박스마다 살짝 다르게 떠다니도록 key 기반으로 고정된 값을 뽑음 (매 렌더마다 안 바뀌게)
  function hashStr(s){ let h=0; for(let i=0;i<s.length;i++){ h=(h*31 + s.charCodeAt(i))|0; } return Math.abs(h); }
  function boxFloatVars(key){
    const h = hashStr(key);
    const dur = 6.5 + (h%30)/10;
    const delay = -((h>>3)%100)/100*dur;
    const rot = (0.5 + ((h>>5)%6)/10) * (h%2 ? 1 : -1);
    return {dur, delay, rot};
  }
  const boxDragOffsets = {}; // 세션 동안만 유지 (새로고침하면 제자리로)

  function boxTaskItems(box){
    const items = state.data.tasks
      .filter(item=>item.boxKey===box.key)
      .map(item=>({item, corner:item.corner, days:itemStaleDays(item)}));
    items.sort((a,b)=>b.days-a.days);
    return items;
  }

  function boxTaskRowHtml(q){
    const stale = q.days>=4;
    return `<div class="box-task-row ${stale?'stale':''}" draggable="true" data-drag-id="${q.item.id}">
      <button class="box-task-check" data-action="completeTask" data-id="${q.item.id}">${icon('check')}</button>
      <div class="box-task-main">
        <div class="box-task-text" title="${escapeHtml(q.item.text)}">${escapeHtml(q.item.text)}</div>
        <div class="box-task-tag">${CORNER_LABELS[q.corner]||''}${stale?` · ${q.days}일째`:''}</div>
      </div>
    </div>`;
  }

  /* ---- 스톱워치: 항목에 연결해서 얼마나 붙잡고 있었는지 재는 용도 ---- */
  /* 항목 연결은 드롭다운을 없애고 드래그로만 하도록 단순화함(어차피 잘 안 쓰이던
     선택창이었고, select 팝업이 다크 테마와 안 맞아 보였음). 같은 카드 안에서
     스톱워치/뽀모도로 모드만 전환한다(항목 연결은 두 모드가 공유). */
  let swMode = 'stopwatch'; // 'stopwatch' | 'pomodoro' — 새로고침하면 스톱워치로 리셋
  const sw = { running:false, elapsedSec:0, target:null, intervalId:null };
  const POMO_STUDY_SEC = 25*60, POMO_BREAK_SEC = 5*60;
  const pomo = { running:false, phase:'study', remainingSec:POMO_STUDY_SEC, intervalId:null };
  function setSwMode(mode){
    if(mode!=='stopwatch' && mode!=='pomodoro') return;
    swMode = mode;
    render();
  }
  function pomoTick(){
    pomo.remainingSec--;
    if(pomo.remainingSec<=0){
      pomo.phase = pomo.phase==='study' ? 'break' : 'study';
      pomo.remainingSec = pomo.phase==='study' ? POMO_STUDY_SEC : POMO_BREAK_SEC;
      render();
      return;
    }
    const dEl = document.getElementById('pomoDisplay');
    if(dEl) dEl.textContent = swFormat(pomo.remainingSec);
  }
  function pomoStart(){
    if(pomo.running) return;
    pomo.running = true;
    pomo.intervalId = setInterval(pomoTick, 1000);
    render();
  }
  function pomoPause(){
    clearInterval(pomo.intervalId);
    pomo.running = false;
    render();
  }
  function pomoReset(){
    clearInterval(pomo.intervalId);
    pomo.running = false;
    pomo.phase = 'study';
    pomo.remainingSec = POMO_STUDY_SEC;
    render();
  }
  function swTargetLabel(){
    if(!sw.target) return null;
    const t = sw.target;
    if(t.type==='assignment'){
      const a = state.data.assignments.find(x=>x.id===t.id);
      return a ? a.title : null;
    }
    if(t.type==='task'){
      const it = state.data.tasks.find(x=>x.id===t.id);
      return it ? it.text : null;
    }
    return null;
  }
  function swCompleteLinked(){
    if(!sw.target) return;
    const t = sw.target;
    if(t.type==='assignment') toggleAssignment(t.id);
    else if(t.type==='task') completeTask(t.id);
    sw.target = null;
    if(swMode==='pomodoro') pomoReset(); else swReset();
  }
  function swFormat(sec){
    sec = Math.max(0, sec);
    const h = Math.floor(sec/3600), m = Math.floor((sec%3600)/60), s = sec%60;
    if(h>0) return `${h}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
    return `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
  }
  function swTick(){
    sw.elapsedSec++;
    const dEl = document.getElementById('swDisplay');
    if(dEl) dEl.textContent = swFormat(sw.elapsedSec);
  }
  function swStart(){
    if(sw.running) return;
    sw.running = true;
    sw.intervalId = setInterval(swTick, 1000);
    render();
  }
  function swPause(){
    clearInterval(sw.intervalId);
    sw.running = false;
    render();
  }
  function swReset(){
    clearInterval(sw.intervalId);
    sw.running = false;
    sw.elapsedSec = 0;
    render();
  }
  function renderStopwatchCard(){
    const targetLabel = swTargetLabel();
    const modeToggle = `<div class="rotation-actions pomo-mode-toggle">
      <button class="rot-btn ${swMode==='stopwatch'?'active':''}" data-action="setSwMode" data-mode="stopwatch">스톱워치</button>
      <button class="rot-btn ${swMode==='pomodoro'?'active':''}" data-action="setSwMode" data-mode="pomodoro">뽀모도로</button>
    </div>`;
    const completeBtn = targetLabel ? `<button class="btn" data-action="swCompleteLinked">"${escapeHtml(targetLabel)}" 완료 처리</button>` : '';

    if(swMode==='pomodoro'){
      const fullSec = pomo.phase==='study' ? POMO_STUDY_SEC : POMO_BREAK_SEC;
      const startLabel = pomo.remainingSec<fullSec ? '계속' : '시작';
      return `<div class="pomo-card">
        <div class="pomo-drop-hint">여기에 놓으면 연결돼요</div>
        <div class="pomo-ring ${pomo.running?'running':''}" id="pomoRing">
          <div class="pomo-display" id="pomoDisplay">${swFormat(pomo.remainingSec)}</div>
        </div>
        <div class="pomo-body">
          ${modeToggle}
          <div class="pomo-phase">${pomo.phase==='study'?'공부 중':'휴식 중'} · 25분 공부 / 5분 휴식</div>
          <div class="pomo-row">
            ${pomo.running
              ? `<button class="btn-outline" data-action="pomoPause">일시정지</button>`
              : `<button class="btn" data-action="pomoStart">${startLabel}</button>`}
            <button class="btn-outline" data-action="pomoReset">초기화</button>
            ${completeBtn}
          </div>
        </div>
      </div>`;
    }

    return `<div class="pomo-card">
      <div class="pomo-drop-hint">여기에 놓으면 스톱워치에 연결돼요</div>
      <div class="pomo-ring ${sw.running?'running':''}" id="swRing">
        <div class="pomo-display" id="swDisplay">${swFormat(sw.elapsedSec)}</div>
      </div>
      <div class="pomo-body">
        ${modeToggle}
        <div class="pomo-row">
          ${sw.running
            ? `<button class="btn-outline" data-action="swPause">일시정지</button>`
            : `<button class="btn" data-action="swStart">${sw.elapsedSec>0 ? '계속' : '시작'}</button>`}
          <button class="btn-outline" data-action="swReset">초기화</button>
          ${completeBtn}
        </div>
      </div>
    </div>`;
  }

  /* ---- 디데이 (사용자 설정) ---- */
  function addDday(){
    const nameEl = document.getElementById('ddayName');
    const dateEl = document.getElementById('ddayDate');
    const name = nameEl.value.trim();
    const date = dateEl.value;
    if(!name || !date) return;
    state.data.ddays = state.data.ddays || [];
    state.data.ddays.push({id:genId(), name, date, hidden:false, createdAt:Date.now()});
    state.ddayAddOpen = false;
    persist(); render();
  }
  function deleteDday(id){
    state.data.ddays = (state.data.ddays||[]).filter(d=>d.id!==id);
    persist(); render();
  }
  function toggleDdayHidden(id){
    const d = (state.data.ddays||[]).find(x=>x.id===id); if(!d) return;
    d.hidden = !d.hidden;
    persist(); render();
  }
  function toggleDdayAdd(){
    state.ddayAddOpen = !state.ddayAddOpen;
    render();
  }
  function renderDdayCard(){
    const list = (state.data.ddays||[]).slice().sort((a,b)=>a.date.localeCompare(b.date));
    const rowsHtml = list.length===0
      ? `<div class="empty dday-empty">등록된 디데이가 없어요.</div>`
      : list.map(d=>{
        const dueMid = new Date(d.date+'T00:00:00').getTime();
        const dLeft = Math.round((dueMid-todayMid)/86400000);
        const label = dLeft>0?`D-${dLeft}`:(dLeft===0?'D-DAY':`D+${Math.abs(dLeft)}`);
        return `<div class="dday-item">
          <div class="dday-item-name">${escapeHtml(d.name)}</div>
          <div class="dday-item-val ${d.hidden?'masked':''}">${d.hidden?'가려짐':label}</div>
          <button class="dday-eye" title="${d.hidden?'다시 보기':'가리기'}" data-action="toggleDdayHidden" data-id="${d.id}">${icon(d.hidden?'eyeOff':'eye')}</button>
          <button class="dday-del" title="삭제" data-action="deleteDday" data-id="${d.id}">${icon('trash')}</button>
        </div>`;
      }).join('');
    const open = state.ddayAddOpen;
    return `<div class="dday-card">
      <div class="dday-card-head-row">
        <div class="dday-card-head">디데이</div>
        <button class="dday-add-toggle ${open?'open':''}" data-action="toggleDdayAdd">
          디데이 추가 <span class="dday-add-chevron">${icon('chevron')}</span>
        </button>
      </div>
      ${rowsHtml}
      <div class="dday-add-panel ${open?'open':''}">
        <div class="dday-add-row">
          <input type="text" class="dday-add-input" id="ddayName" placeholder="이름 (예: 중간고사)">
          <input type="date" class="dday-add-date" id="ddayDate">
          <button class="btn-outline" data-action="addDday">추가</button>
        </div>
      </div>
    </div>`;
  }

  // 처음 시작하거나 로그아웃해서 과목 박스가 하나도 없을 때, 빈 화면 대신 간단한 사용법을 보여줌.
  // 박스를 하나라도 만들면 더는 필요 없으니 boxes().length===0 조건 하나로만 노출/숨김을 결정함
  function renderOnboardGuide(){
    return `<div class="onboard-guide">
      <div class="onboard-title">시작하는 법</div>
      <ol class="onboard-steps">
        <li>아래 <b>"+ 과목 추가"</b>로 수학, 영어처럼 원하는 과목 박스를 만드세요.</li>
        <li>박스를 누르면 할 일을 추가할 수 있어요 — 수업에서 나온 건 <b>수업 과제</b>, 스스로 하는 공부는 <b>자율학습</b>이에요.</li>
        <li><b>도시</b> 탭에서 수업 과제는 자동차, 자율학습은 사람으로 나타나요. 방치하면 지치고, 완료할수록 도시가 발전해요.</li>
        <li>로그인은 선택이에요 — 사이드바나 설정에서 Google로 로그인하면 다른 기기에서도 같은 목록을 볼 수 있어요.</li>
      </ol>
    </div>`;
  }
  function renderHome(){
    const name = getStudentName();

    const boxHtml = boxes().map(box=>{
      const all = boxTaskItems(box);
      const tasksHtml = all.length===0
        ? `<div class="box-empty">할 일 없음</div>`
        : all.map(boxTaskRowHtml).join('');
      const fv = boxFloatVars(box.key);
      const off = boxDragOffsets[box.key] || {x:0, y:0};
      return `<div class="box-drag" data-boxkey="${box.key}" style="transform:translate(${off.x}px,${off.y}px);">
        <div class="box-float" style="--float-dur:${fv.dur}s;--float-delay:${fv.delay}s;">
          <div class="box-cell" style="--qc:${box.qc};--qg:${box.qg}">
            <button class="box-del" title="과목 삭제" data-action="deleteBox" data-key="${box.key}">${icon('trash')}</button>
            <button class="box-head" data-action="openQuickAdd" data-boxkey="${box.key}">
              <div class="box-label">${box.label}</div>
              <div class="box-meta">${all.length>0?`${all.length}개`:'할 일 추가'}</div>
            </button>
            <div class="box-tasks">${tasksHtml}</div>
          </div>
        </div>
      </div>`;
    }).join('') + `<div class="box-cell box-add-cell">
        ${state.boxAddOpen ? `<div class="box-add-form">
          <input type="text" id="newBoxName" placeholder="과목/분야 이름 (예: 수학)" autofocus>
          <div class="add-row-line">
            <button class="btn" data-action="submitAddBox">추가</button>
            <button class="btn-outline" data-action="toggleBoxAdd">취소</button>
          </div>
        </div>` : `<button class="box-add-btn" data-action="toggleBoxAdd">+ 과목 추가</button>`}
      </div>`;

    const allPending = state.data.assignments.filter(a=>!a.done).sort((a,b)=>a.dueDate.localeCompare(b.dueDate));
    const pending = allPending.slice(0,3);
    const asgHtml = pending.length===0
      ? `<div class="empty">등록된 과제가 없어요.</div>`
      : pending.map(a=>assignmentRowHtml(a,false)).join('');

    const left = `
      <div class="home-date">${todayDateStr}</div>
      <h1 class="home-greeting">${greetingWord()}${name?', '+escapeHtml(name):''}</h1>

      <div class="dday-sw-row">
        ${renderDdayCard()}
        ${renderStopwatchCard()}
      </div>

      ${boxes().length===0 ? renderOnboardGuide() : ''}
      <div class="box-grid">${boxHtml}</div>

      <div class="section">
        <div class="section-head"><div class="section-title">임박한 과제</div><button class="section-link" data-action="goView" data-view="assignments">전체 보기</button></div>
        ${asgHtml}
      </div>`;

    // 데스크탑에서만 오른쪽에 살아있는 도시를 띄운다 (좁은 화면에선 3D를 아예 안 받음)
    if(!isWideScreen()) return `<div class="fade-in">${left}</div>`;
    return `<div class="fade-in home-split">
      <div class="home-main">${left}</div>
      <aside class="home-city">
        <div class="home-city-head">
          <span class="city-title">City of Brain</span>
          <button class="section-link" data-action="goView" data-view="city">크게 보기</button>
        </div>
        <div id="city3dSlotHome" class="city-slot-home"></div>
      </aside>
    </div>`;
  }

  const PRIORITY_LABELS = {high:'상', mid:'중', low:'하'};
  const PRIORITY_RANK = {high:0, mid:1, low:2};
  function assignmentRowHtml(a, showCheckbox){
    // Classroom에서 긁어온 제목이 잘리거나 기한이 틀릴 때가 있어서 직접 고칠 수 있어야 함
    if(state.editingAssignment === a.id){
      return `<div class="asg-row asg-editing">
        <div class="asg-edit-form">
          <input type="text" class="add-input" id="asgEditTitle" value="${escapeHtml(a.title)}" placeholder="과제명">
          <div class="asg-edit-line">
            <input type="date" class="add-input" id="asgEditDate" value="${escapeHtml(a.dueDate||'')}">
            <input type="text" class="add-input" id="asgEditTag" value="${escapeHtml(a.tag||'')}" placeholder="관련 과목">
          </div>
          <div class="asg-edit-line">
            <button class="btn" data-action="saveAssignmentEdit" data-id="${a.id}">저장</button>
            <button class="btn-outline" data-action="cancelAssignmentEdit">취소</button>
          </div>
        </div>
      </div>`;
    }
    const dueMid = new Date(a.dueDate+'T00:00:00').getTime();
    const dLeft = Math.round((dueMid-todayMid)/86400000);
    const ddLabel = dLeft>0?`D-${dLeft}`:(dLeft===0?'D-DAY':`D+${Math.abs(dLeft)} 지남`);
    const ddClass = dLeft<0?'overdue':(dLeft<=2?'urgent':'');
    const priorityRow = (showCheckbox && !a.done) ? `<div class="asg-priority">
      <span class="asg-priority-label">가성비</span>
      ${['high','mid','low'].map(p=>`<button class="pri-btn ${a.priority===p?'active':''}" data-action="setAssignmentPriority" data-id="${a.id}" data-val="${p}">${PRIORITY_LABELS[p]}</button>`).join('')}
    </div>` : '';
    return `<div class="asg-row ${a.done?'done':''}" data-row-id="${a.id}">
      <button class="asg-check" data-action="toggleAssignment" data-id="${a.id}">${icon('check')}</button>

  /* ---- Tasks ---- */
  function itemStaleDays(item){ return Math.floor((Date.now()-item.createdAt)/86400000); }

  function isEditingTask(id){
    const e = state.editingTask;
    return !!e && e.id===id;
  }
  function taskEditRowHtml(item){
    return `<div class="task-row task-editing">
      <div class="task-edit-form">
        <input type="text" class="add-input" id="taskEditText" data-role="taskEditText" value="${escapeHtml(item.text)}" placeholder="할 일 내용">
        <div class="task-edit-line">
          <select class="add-input" id="taskEditBox">

  let taskAddType = 'review'; // 'review' | 'self' — 저장 안 됨, 새로고침하면 기본값(수업 과제)으로
  function setTaskAddType(type){

  function addTaskUnified(){

        <div class="add-row">
          <select class="add-input" id="taskAddBox" style="flex:0 0 128px;">

  /* ---- Assignments ---- */
  function fmtShortDate(iso){
    const d = new Date(iso+'T00:00:00');
    return `${MONTHNAME[d.getMonth()]} ${d.getDate()}일(${DAYNAME[d.getDay()]})`;
  }

  // 마감일들을 가로 타임라인에 흩뿌려서 특정 날짜에 몰려있는지 한눈에 보이게 함
  // (peakDailyLoad와 같은 문제의식: 합계/평균만으로는 클러스터링이 안 보임)
  function renderDdayTimeline(assignments){
    const pending = assignments.filter(a=>!a.done);
    if(pending.length===0) return '';
    const dueTimes = pending.map(a=>new Date(a.dueDate+'T00:00:00').getTime());
    let maxDue = Math.max.apply(null, dueTimes.concat([todayMid]));
    const minSpan = 7*86400000; // 폭이 너무 좁으면(전부 임박) 점들이 뭉개지니 최소 폭 보장
    if(maxDue - todayMid < minSpan) maxDue = todayMid + minSpan;
    const span = maxDue - todayMid;

    const byDate = {};
    pending.forEach(a=>{ (byDate[a.dueDate] = byDate[a.dueDate] || []).push(a); });

    const clusters = Object.keys(byDate).map(dateStr=>{
      const dueMs = new Date(dateStr+'T00:00:00').getTime();
      const overdue = dueMs < todayMid;
      const pct = Math.max(0, Math.min(100, ((dueMs-todayMid)/span)*100));
      const items = byDate[dateStr];
      const shown = items.slice(0,4);
      const dotsHtml = shown.map(a=>`<div class="dday-dot ${overdue?'overdue':''}" title="${escapeHtml(fmtShortDate(dateStr))} · ${escapeHtml(a.title)}"></div>`).join('');
      const moreHtml = items.length>4 ? `<div class="dday-count">+${items.length-4}</div>` : '';
      return `<div class="dday-cluster" style="left:${pct}%;" title="${escapeHtml(fmtShortDate(dateStr))} · 과제 ${items.length}개">${dotsHtml}${moreHtml}</div>`;
    }).join('');

    return `<div class="dday-legend">점 = 그 날짜 마감인 과제 (겹치면 숫자로 표시) · <span class="dday-legend-dot"></span> 대기 중 · <span class="dday-legend-dot overdue"></span> 기한 지남</div>
    <div class="dday-timeline">
      <div class="dday-track"></div>
      <div class="dday-today" style="left:0%;"></div>
      ${clusters}
      <div class="dday-label start">오늘</div>
      <div class="dday-label end">${fmtShortDate(toISODate(new Date(maxDue)))}</div>
    </div>`;
  }

  function renderAssignmentsPage(){
    const sorted = state.data.assignments.filter(a=>!a.done).slice().sort((a,b)=>{
      if(state.asgSortMode==='priority'){
        const ra = PRIORITY_RANK[a.priority]??1, rb = PRIORITY_RANK[b.priority]??1;
        if(ra!==rb) return ra-rb;
      }
      return a.dueDate.localeCompare(b.dueDate);
    });
    const rows = sorted.map(a=>assignmentRowHtml(a,true)).join('');

    return `<div class="fade-in">
      <div class="page-head"><h1>과제</h1></div>
      ${renderDdayTimeline(sorted)}
      <div class="asg-form">
        <input type="text" class="title" id="asgTitle" placeholder="과제명">
        <input type="date" class="date" id="asgDate">
        <input type="text" class="tag" id="asgTag" placeholder="관련 과목">
        <button class="btn" data-action="addAssignment">추가</button>
      </div>
      ${sorted.length>0?`<div class="corner-tabs" style="margin-bottom:14px;">
        <button class="corner-tab ${state.asgSortMode==='due'?'active':''}" data-action="setAsgSortMode" data-mode="due">마감일순</button>
        <button class="corner-tab ${state.asgSortMode==='priority'?'active':''}" data-action="setAsgSortMode" data-mode="priority">가성비순</button>
      </div>`:''}
      ${sorted.length===0?`<div class="empty">등록된 과제가 없어요.</div>`:rows}
