<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>City of Brain</title>
<meta name="theme-color" content="#FFF8EE">
<link rel="icon" href="favicon.ico?v=4" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="assets/icon-32.png?v=4">
<link rel="icon" type="image/png" sizes="512x512" href="assets/icon-512.png?v=4">
<link rel="apple-touch-icon" href="assets/icon-180.png?v=4">
<link rel="manifest" href="manifest.json?v=4">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="City of Brain">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.css" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&display=swap">
<style>
  :root{
    /* 디자인: 밝고 따뜻한 "동네 분식집" 톤 — 글래스/블러 효과는 전부 폐기하고 종이 같은
       플랫 카드로 바꿨다. 색은 여전히 블루 하나(accent) + 화이트/블랙 계열만 쓰되,
       배경 자체가 크림색이라 "화이트/블랙"은 크림~진갈색 범위로 치환된다. */
    color-scheme: light;
    --bg:#FFF8EE;
    --glass:#FFFFFF; --glass-strong:#FFF1DC; --glass-press:#FFE7C4;
    --border:rgba(90,58,24,.14); --border-strong:rgba(90,58,24,.26); --border-hi:rgba(90,58,24,.14);
    --text:#2B2017; --text-2:rgba(43,32,23,.7); --text-3:rgba(43,32,23,.48);
    --blue:#0A84FF;
    --accent:var(--blue);
    --danger:var(--blue); --good:var(--blue);
    --sans:'Jua','Pretendard Variable','Pretendard','Malgun Gothic',sans-serif;
    --r-sm:10px; --r-md:16px; --r-lg:22px; --r-pill:999px;
    --dur:200ms; --ease:cubic-bezier(.4,0,.2,1);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);font-family:var(--sans);min-height:100vh;-webkit-font-smoothing:antialiased;font-feature-settings:'tnum' 1;
  }
  ::selection{background:rgba(10,132,255,.25);}
  button,input,textarea{font-family:inherit;}
  a{color:inherit;}
  :focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:6px;}
  button{cursor:pointer;}

  /* ---- 카드 표면 유틸(예전엔 glass였으나 지금은 플랫 종이 카드) ---- */
  .glass{
    background:var(--glass);
    border:1px solid var(--border);
    border-top-color:var(--border-hi);
  }

  /* ---- shell / top nav ---- */
  .app-shell{min-height:100vh;}
  .topnav{position:sticky;top:0;z-index:50;background:var(--bg);border-bottom:1px solid var(--border);}
  .topnav-inner{max-width:1100px;margin:0 auto;padding:12px 24px;display:flex;align-items:center;gap:4px;}
  .topnav-brand{display:flex;align-items:center;gap:9px;cursor:pointer;margin-right:14px;flex-shrink:0;}
  .topnav-brand .mark{
    width:28px;height:28px;border-radius:10px;flex-shrink:0;position:relative;overflow:hidden;
    background:linear-gradient(135deg, var(--blue), #FFFFFF);
    box-shadow:
      inset 0 1px 1px rgba(255,255,255,.6),
      0 2px 5px rgba(90,58,24,.18);
  }
  .topnav-brand b{font-size:17px;font-weight:400;letter-spacing:0;}
  .nav-list{display:flex;align-items:center;gap:2px;flex:1;}
  .nav-item{display:flex;align-items:center;gap:8px;padding:8px 14px;border-radius:var(--r-pill);font-size:14.5px;color:var(--text-2);background:none;border:none;text-align:left;transition:background var(--dur) var(--ease),color var(--dur) var(--ease);position:relative;white-space:nowrap;}
  .nav-icon{width:24px;height:24px;border-radius:50%;background:var(--nc,var(--blue));display:flex;align-items:center;justify-content:center;flex-shrink:0;color:#fff;}
  .nav-icon svg{width:13px;height:13px;}
  .nav-item:hover{background:var(--glass-strong);color:var(--text);}
  .nav-item.active{background:var(--glass-strong);color:var(--text);font-weight:600;}
  .nav-item .label{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .footer-link{display:block;width:100%;background:none;border:none;color:var(--text-3);font-size:11px;text-align:left;padding:8px 12px;cursor:pointer;font-family:var(--sans);}
  .footer-link:hover{color:var(--text-2);}

  .topnav-ad-wrap{max-width:1100px;margin:0 auto;padding:0 24px;}
  .main{flex:1;min-width:0;}
  .main-inner{max-width:720px;margin:0 auto;padding:32px 32px 80px;}

  @media(max-width:979px){
    .nav-item{padding:8px 10px;}
    .main-inner{padding:28px 20px 80px;}
  }
  @media(max-width:639px){
    .topnav-inner{padding:10px 14px;}
    .main-inner{padding:20px 14px 48px;max-width:100%;}
  }

  /* ---- page header ---- */
  .page-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:30px;flex-wrap:wrap;}
  .page-head h1{font-size:28px;font-weight:700;letter-spacing:-.02em;margin:0;}
  .page-head .sub{font-size:13px;color:var(--text-3);}

  .home-date{font-size:13px;color:var(--text-3);margin-bottom:6px;}
  .home-greeting{font-size:32px;font-weight:700;letter-spacing:-.02em;margin:0 0 40px;}

  /* ---- 식당 분위기: 맨 위 주방 창 ---- */
  .kitchen-scene{position:relative;height:104px;margin-bottom:22px;border-radius:var(--r-lg);overflow:hidden;background:linear-gradient(180deg,#FFE9C7,#FFF8EE 88%);border:1px solid var(--border);}
  .kitchen-ledge{position:absolute;left:0;right:0;bottom:0;height:20px;background:var(--glass-strong);border-top:3px solid var(--border-strong);}
  .kitchen-cook{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);}
  .kitchen-arm{animation:armStir 1.7s ease-in-out infinite;transform-origin:center;}
  @keyframes armStir{0%,100%{transform:rotate(0deg);}50%{transform:rotate(10deg);}}
  .kitchen-caption{position:absolute;right:14px;bottom:26px;font-size:12px;color:var(--text-2);background:var(--glass);padding:4px 10px;border-radius:var(--r-pill);border:1px solid var(--border);}
  .kitchen-steam{position:absolute;bottom:38px;width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.85);filter:blur(2.5px);opacity:0;animation:steamRise 3.1s ease-in infinite;}
  .kitchen-steam.s1{left:calc(50% - 15px);animation-delay:0s;}
  .kitchen-steam.s2{left:calc(50% - 1px);animation-delay:1.05s;}
  .kitchen-steam.s3{left:calc(50% + 13px);animation-delay:2.05s;}
  @keyframes steamRise{0%{opacity:0;transform:translateY(0) scale(.6);}15%{opacity:.8;}80%{opacity:0;}100%{opacity:0;transform:translateY(-42px) scale(1.3);}}

  /* ---- 이번주: 과목별 간식 게이지(음식집 주문서 컨셉) ---- */
  .exam-add-wrap{margin-bottom:24px;}
  .exam-add-trigger{background:none;border:none;color:var(--text-3);font-size:13px;font-weight:600;cursor:pointer;padding:10px 16px;transition:color var(--dur) var(--ease);}
  .exam-add-trigger:hover{color:var(--text);}
  .exam-add-form{
    background:var(--glass);
    border:1px solid var(--border);border-top-color:var(--border-hi);border-radius:var(--r-lg);
    padding:18px 20px;display:flex;flex-direction:column;gap:10px;width:100%;
  }
  .exam-add-form input{background:var(--bg);border:1px solid var(--border);border-radius:var(--r-pill);color:var(--text);padding:9px 15px;font-size:14px;}
  .exam-add-form textarea{background:var(--bg);border:1px solid var(--border);border-radius:var(--r-md);color:var(--text);padding:11px 14px;font-size:14px;line-height:1.6;resize:vertical;font-family:inherit;}
  .exam-add-form textarea::placeholder,.exam-add-form input::placeholder{color:var(--text-3);}
  .exam-add-form .add-row-line{display:flex;gap:8px;}
  .exam-add-form .add-row-line button{flex:1;}
  .exam-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:22px;}
  /* 영수증/주문서 느낌 — 흰 종이에 아래쪽만 톱니 모양으로 찢어진 테두리, 그림자는
     clip-path와 같이 써도 안 잘리게 box-shadow 대신 filter:drop-shadow 사용 */
  .exam-card{
    position:relative;background:var(--glass);padding:20px 20px 30px;overflow:hidden;
    clip-path:polygon(0 0,100% 0,100% 100%,95% 95%,90% 100%,85% 95%,80% 100%,75% 95%,70% 100%,65% 95%,60% 100%,55% 95%,50% 100%,45% 95%,40% 100%,35% 95%,30% 100%,25% 95%,20% 100%,15% 95%,10% 100%,5% 95%,0 100%);
    filter:drop-shadow(0 10px 18px rgba(90,58,24,.14));
    transition:filter var(--dur) var(--ease);
  }
  .exam-card.order-done{filter:drop-shadow(0 10px 18px rgba(46,142,78,.22));}
  .exam-card.order-done::before{content:'';position:absolute;inset:0;background:rgba(46,142,78,.07);pointer-events:none;}
  .exam-card-head{position:relative;margin-bottom:14px;padding-bottom:12px;border-bottom:1.5px dashed var(--border-strong);}
  .exam-card-shop{font-size:11px;color:var(--text-3);letter-spacing:.08em;}
  .exam-card-title{font-size:19px;letter-spacing:-.01em;margin-top:2px;}
  .exam-card-meta{font-size:12px;color:var(--text-3);margin-top:3px;}
  .exam-card-del{position:absolute;top:0;right:0;opacity:.55;}
  .exam-card-del:hover{opacity:1;}
  .order-stamp{
    position:absolute;top:18px;right:20px;z-index:2;
    color:#2E8E4E;border:3px solid #2E8E4E;border-radius:10px;
    padding:3px 10px;font-size:15px;font-weight:700;letter-spacing:.04em;
    transform:rotate(-14deg);opacity:.88;pointer-events:none;
  }
  .order-stamp.stamp-pop{animation:stampSlam 480ms cubic-bezier(.3,1.6,.4,1);}
  @keyframes stampSlam{0%{transform:rotate(-14deg) scale(2.6);opacity:0;}60%{opacity:1;}100%{transform:rotate(-14deg) scale(1);opacity:.88;}}
  .food-bar{position:relative;height:40px;border-radius:10px;overflow:hidden;background:var(--glass-strong);border:1px solid var(--border);margin-bottom:14px;}
  .food-bar-img{position:absolute;inset:0;background-repeat:no-repeat;background-size:100% 100%;image-rendering:pixelated;image-rendering:crisp-edges;}
  .food-bar-blocks{position:absolute;inset:0;background-image:repeating-linear-gradient(90deg,transparent 0,transparent calc(100%/var(--n) - 2px),var(--bg) calc(100%/var(--n) - 2px),var(--bg) calc(100%/var(--n)));opacity:.9;}
  /* 오른쪽(음식이 있는 쪽)부터 가려서 먹어치우고, 막대/손잡이가 있는 왼쪽 끝이 맨 마지막에 남게 함 */
  .food-bar-eaten{position:absolute;inset:0 0 0 auto;width:0%;background:var(--bg);opacity:.85;box-shadow:-2px 0 8px rgba(0,0,0,.25);transition:width 420ms var(--ease);}
  .food-bar.just-ate{animation:biteChomp 360ms var(--ease);}
  @keyframes biteChomp{0%{transform:scale(1,1);}30%{transform:scale(.95,1.1);}60%{transform:scale(1.04,.94);}100%{transform:scale(1,1);}}
  .bite-pop{
    position:absolute;top:2px;right:8px;z-index:3;font-size:13px;font-weight:700;color:var(--blue);
    pointer-events:none;animation:bitePopUp 700ms var(--ease) forwards;
  }
  @keyframes bitePopUp{0%{opacity:0;transform:translateY(4px) scale(.7);}20%{opacity:1;transform:translateY(-4px) scale(1.08);}100%{opacity:0;transform:translateY(-24px) scale(1);}}
  .exam-items{display:flex;flex-direction:column;}
  .exam-item{display:flex;align-items:baseline;gap:6px;padding:8px 0;border-bottom:1px dotted var(--border-strong);font-size:13.5px;}
  .exam-item:last-child{border-bottom:none;}
  .exam-item-no{font-size:11px;color:var(--text-3);flex-shrink:0;}
  .exam-item-text{min-width:0;line-height:1.4;word-break:break-word;flex-shrink:1;}
  .exam-item.done .exam-item-text{color:var(--text-3);text-decoration:line-through;text-decoration-color:var(--border-strong);}
  .exam-item-dots{flex:1;min-width:16px;border-bottom:1px dotted var(--border-strong);transform:translateY(-3px);}
  .exam-item-check{flex-shrink:0;background:none;border:1.5px solid var(--border-strong);border-radius:var(--r-pill);color:var(--text-3);font-size:11px;font-weight:400;padding:3px 10px;transition:all var(--dur) var(--ease);}
  .exam-item.done .exam-item-check{background:var(--blue);border-color:var(--blue);color:#fff;}
  .exam-card-total{margin-top:14px;padding-top:12px;border-top:1.5px dashed var(--border-strong);text-align:right;font-size:14px;}
  .exam-add-item-row{margin-top:12px;margin-bottom:0;}

  .empty{color:var(--text-3);font-size:13.5px;padding:18px 0;}


  .task-del{width:22px;height:22px;border-radius:50%;border:none;background:none;color:var(--text-3);flex-shrink:0;display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity var(--dur) var(--ease);}
  .task-del:hover{color:var(--blue);}

  .btn{background:var(--blue);color:#fff;border:none;border-radius:var(--r-pill);padding:9px 20px;font-size:13.5px;font-weight:600;transition:filter var(--dur) var(--ease),transform var(--dur) var(--ease);}
  .btn:hover{filter:brightness(1.12);}
  .btn:active{transform:scale(.97);}
  .btn-outline{background:var(--glass);-webkit-backdrop-filter:blur(var(--blur));backdrop-filter:blur(var(--blur));border:1px solid var(--border-strong);color:var(--text);border-radius:var(--r-pill);padding:9px 20px;font-size:13.5px;font-weight:600;transition:all var(--dur) var(--ease);}
  .btn-outline:hover{background:var(--glass-strong);}
  .btn-outline:active{transform:scale(.97);}
  .btn-danger{background:var(--blue);color:#fff;border:none;border-radius:var(--r-pill);padding:9px 20px;font-size:13.5px;font-weight:600;transition:filter var(--dur) var(--ease);}
  .btn-danger:hover{filter:brightness(1.12);}

  .add-row{display:flex;gap:8px;margin-bottom:14px;}
  .add-row input,.add-row select{flex:1;background:var(--glass);border:1px solid var(--border);border-radius:var(--r-pill);color:var(--text);padding:9px 15px;font-size:13px;min-width:0;}
  .add-row input::placeholder{color:var(--text-3);}

  .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;z-index:80;padding:20px;}
  .modal{background:rgba(28,28,32,.72);-webkit-backdrop-filter:blur(34px) saturate(1.8);backdrop-filter:blur(34px) saturate(1.8);border:1px solid var(--border-strong);border-top-color:var(--border-hi);border-radius:var(--r-lg);max-width:520px;width:100%;max-height:82vh;display:flex;flex-direction:column;box-shadow:0 24px 70px rgba(0,0,0,.55);}
  .modal-head{display:flex;align-items:center;justify-content:space-between;padding:18px 22px;border-bottom:1px solid var(--border);}
  .modal-head h2{margin:0;font-size:16.5px;font-weight:700;}
  .modal-close{width:28px;height:28px;border-radius:50%;border:none;background:var(--glass);color:var(--text-2);display:flex;align-items:center;justify-content:center;}
  .modal-close:hover{background:var(--glass-strong);color:var(--text);}
  .modal-body{padding:8px 22px 24px;overflow-y:auto;}
  .settings-group{padding:20px 0;border-bottom:1px solid var(--border);}
  .settings-group:last-child{border-bottom:none;}
  .settings-group h3{font-size:13px;font-weight:600;margin:0 0 4px;}
  .settings-group .desc{font-size:12px;color:var(--text-3);line-height:1.6;margin-bottom:12px;}
  .settings-group .desc b{color:var(--text-2);}
  .settings-group input[type=password],.settings-group input[type=text]{width:100%;background:rgba(0,0,0,.3);border:1px solid var(--border);border-radius:var(--r-pill);color:var(--text);padding:10px 15px;font-size:13px;margin-bottom:10px;}
  .settings-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
  .fade-in{animation:fadeIn 220ms var(--ease);}
  @keyframes fadeIn{from{opacity:0;transform:translateY(3px);}to{opacity:1;transform:none;}}

  /* ---- 로그인 ---- */
  .btn-google{width:100%;display:flex;align-items:center;justify-content:center;gap:10px;
    background:#fff;color:#1f1f1f;border:1px solid var(--border);border-radius:var(--r-pill);
    padding:11px 16px;font-size:14px;font-weight:600;cursor:pointer;font-family:var(--sans);margin-bottom:14px;}
  .btn-google:hover{background:#f4f4f4;}

  /* ---- 광고 슬롯 ---- */
  .ad-slot{margin:20px 0;min-height:90px;display:flex;align-items:center;justify-content:center;}
  .ad-slot-placeholder{border:1px dashed var(--border);border-radius:var(--r-md);color:var(--text-3);font-size:12px;width:100%;text-align:center;line-height:1.5;}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>

<body>
<div class="app-shell" id="shell">
  <div id="topNavSlot"></div>
  <main class="main"><div class="main-inner" id="app"></div></main>
</div>
<input type="file" id="importFile" accept="application/json" style="display:none">

<script>
(function(){
  "use strict";

  /* ============ 로그인 (Supabase) ============
     아래 두 값이 채워지기 전까지는 로그인 없이 게스트 모드로 그냥 동작한다.
     supabase.com에서 프로젝트를 만든 뒤 Project Settings → API에서 값을 복사해 넣으면
     그 순간부터 이메일 매직 링크 로그인 화면이 켜진다. */
  const SUPABASE_URL = 'https://emgsydavlzdzfkbsihpx.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVtZ3N5ZGF2bHpkemZrYnNpaHB4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc3ODY0ODIsImV4cCI6MjEwMzM2MjQ4Mn0.EoeaLGX94bIETQh14zPjnMW6sP5b3JFh3JyiUCZlSuE';
  // window.supabase가 없으면(CDN 로드 실패 등) 앱 전체가 죽지 않고 게스트 모드로 내려가야 함
  const sb = (SUPABASE_URL.indexOf('https://')===0 && SUPABASE_ANON_KEY && window.supabase)
    ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;
  let authSession = null;
  // sb가 있으면 처음부터 "확인 중" 상태로 시작해야, initAuth()가 끝나기 전에 첫 렌더가
  // 로그인 폼을 잠깐 반짝였다 사라지는 일 없이 곧장 로딩 화면부터 보여줄 수 있다
  let authChecking = !!sb;
  // 계정이 바뀔 때만(로그인/로그아웃) 클라우드와 동기화하고, 토큰 갱신 같은 부수적인
  // auth 이벤트에서는 다시 끌어오지 않기 위해 마지막으로 동기화한 사용자 id를 기억해둠
  let lastSyncedUserId = null;
  async function handleAuthChange(session){
    if(!sb) return;
    if(!session){
      authSession = null;
      lastSyncedUserId = null;
      // 로그아웃하면 이 브라우저의 데이터는 그 계정 것이었으니 화면에서 지운다 —
      // 실제 데이터는 클라우드에 남아있고, 다시 로그인하면 pullCloudData가 복원해줌
      state.data = buildSkeleton();
      persistLocal();
      authChecking = false;
      render();
      return;
    }
    authSession = session;
    if(session.user.id === lastSyncedUserId){
      authChecking = false;
      render();
      return;
    }
    authChecking = true;
    render();
    await pullCloudData(session.user.id);
    lastSyncedUserId = session.user.id;
    authChecking = false;
    render();
  }
  async function initAuth(){
    if(!sb) return;
    authChecking = true;
    // 리스너를 먼저 걸어야 함 — getSession()을 먼저 기다리면 그 사이에 Google 리다이렉트로
    // 막 로그인된 이벤트가 지나가버려서 로그인 화면에 계속 머무는 경우가 생김
    sb.auth.onAuthStateChange((_event, session)=>{ handleAuthChange(session); });
    const { data } = await sb.auth.getSession();
    if(data.session){ await handleAuthChange(data.session); }
    else { authChecking = false; render(); }
  }
  // Google 로그인은 Supabase 대시보드 Authentication → Providers → Google에서
  // Client ID/Secret을 등록해야 실제로 동작함 (등록 전엔 눌러도 에러만 뜸)
  async function signInGoogle(){
    if(!sb) return;
    await sb.auth.signInWithOAuth({ provider:'google', options:{ redirectTo: window.location.href } });
  }
  async function signOut(){
    state.modal = null;
    if(sb) await sb.auth.signOut();
    await handleAuthChange(null);
  }
  // 로그인은 강제 게이트가 아니라 사이드바/설정에 있는 버튼으로 선택하는 부가 기능임 —
  /* ============ 광고 배너 ============
     AdSense 승인 후 아래 두 값(ca-pub-... / 광고 단위 슬롯 ID)을 채우면 실제 광고로 바뀐다.
     비어있는 동안은 자리만 차지하는 플레이스홀더를 보여준다. */
  const ADSENSE_PUBLISHER_ID = '';
  const ADSENSE_SLOT_ID = '';
  function renderAdSlot(place){
    const cls = place==='sidebar' ? 'ad-slot ad-slot-sidebar' : 'ad-slot';
    if(!ADSENSE_PUBLISHER_ID || !ADSENSE_SLOT_ID){
      return `<div class="${cls} ad-slot-placeholder"></div>`;
    }
    return `<div class="${cls}"><ins class="adsbygoogle" style="display:block;width:100%;"
      data-ad-client="${ADSENSE_PUBLISHER_ID}" data-ad-slot="${ADSENSE_SLOT_ID}"
      data-ad-format="auto" data-full-width-responsive="true"></ins></div>`;
  }

  function genId(){ return 'i'+Date.now().toString(36)+Math.random().toString(36).slice(2,7); }

  function buildSkeleton(){
    return { examWeek:{subjects:[]} };
  }

  const now = new Date();

  /* ============ 저장소 ============ */
  const STORAGE_KEY = 'cob-data-v1';
  const SHOP_NAME_KEY = 'cob-shop-name';
  let storageOK = true;
  (function testStorage(){
    try{
      const probe = '__organizer_probe__';
      localStorage.setItem(probe, '1');
      localStorage.removeItem(probe);
    }catch(e){ storageOK = false; }
  })();
  function loadData(){
    if(!storageOK) return null;
    try{
      const raw = localStorage.getItem(STORAGE_KEY);
      return raw ? JSON.parse(raw) : null;
    }catch(e){ return null; }
  }
  function persistLocal(){
    if(!storageOK) return;
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state.data)); }
    catch(e){ storageOK = false; render(); }
  }
  function persist(){
    persistLocal();
    scheduleCloudPush();
  }
  // 데이터는 계정(user_id)에 묶여서 Supabase의 app_data 테이블에 저장됨.
  // 로컬 저장은 오프라인/즉시 반응용 캐시일 뿐이고, 로그인 상태에서는 이 클라우드 사본이 진짜다.
  let cloudPushTimer = null;
  function scheduleCloudPush(){
    if(!sb || !authSession) return;
    clearTimeout(cloudPushTimer);
    cloudPushTimer = setTimeout(pushCloudData, 600);
  }
  async function pushCloudData(){
    if(!sb || !authSession) return;
    try{
      await sb.from('app_data').upsert({
        user_id: authSession.user.id,
        data: state.data,
        updated_at: new Date().toISOString()
      });
    }catch(e){ /* 네트워크 문제 등 — 로컬 사본은 이미 안전하게 저장돼 있음 */ }
  }
  async function pullCloudData(userId){
    if(!sb) return;
    try{
      const { data, error } = await sb.from('app_data').select('data').eq('user_id', userId).maybeSingle();
      if(!error && data && data.data){
        state.data = { examWeek: data.data.examWeek || {subjects:[]} };
        persistLocal();
      } else {
        // 이 계정으로 처음 동기화하는 것 — 지금 갖고 있는 데이터를 클라우드에 올려둔다
        await pushCloudData();
      }
    }catch(e){ /* 네트워크 문제면 일단 로컬 데이터로 계속 진행 */ }
  }
  function getShopName(){ try{ return localStorage.getItem(SHOP_NAME_KEY) || ''; }catch(e){ return ''; } }
  function setShopName(name){
    try{ if(name) localStorage.setItem(SHOP_NAME_KEY, name); else localStorage.removeItem(SHOP_NAME_KEY); }catch(e){}
  }

  /* ============ 상태 ============ */
  const state = {
    modal:null, examAddOpen:false,
    data:buildSkeleton()
  };  /* ============ 아이콘 ============ */
  function icon(name){
    const p = {
      settings:'<circle cx="10" cy="10" r="2.6"/><path d="M10 3v2M10 15v2M3 10h2M15 10h2M5 5l1.4 1.4M13.6 13.6 15 15M15 5l-1.4 1.4M6.4 13.6 5 15"/>',
      close:'<path d="M4.5 4.5l7 7M11.5 4.5l-7 7"/>',
      trash:'<path d="M4 5.5h8M7 5.5V4h2v1.5M5 5.5l.5 6.5h5l.5-6.5"/>'
    }[name] || '';
    return `<svg width="16" height="16" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
  }

  /* ============ 렌더 ============
     남은 화면이 "이번주" 주문서 하나뿐이라 탭 전환도, 스크롤 체인도 필요 없다 —
     매 렌더마다 그냥 그 화면 하나를 통째로 다시 그린다. */
  function render(){
    const topNavSlot = document.getElementById('topNavSlot');
    topNavSlot.innerHTML = renderTopNav();

    const app = document.getElementById('app');
    let html = '';
    if(!storageOK) html += `<div class="empty" style="color:var(--danger);">이 브라우저에서는 로컬 저장이 안 돼요(시크릿 모드이거나 저장 공간이 꽉 찼을 수 있어요). 작업 후 꼭 설정에서 내보내기로 백업해주세요.</div>`;
    html += renderExamPage();
    app.innerHTML = html;
    if(ADSENSE_PUBLISHER_ID){
      document.querySelectorAll('ins.adsbygoogle').forEach(()=>{
        try{ (window.adsbygoogle = window.adsbygoogle || []).push({}); }catch(e){}
      });
    }

    document.querySelectorAll('.modal-overlay').forEach(el=>el.remove());
    if(state.modal==='settings') document.body.insertAdjacentHTML('beforeend', renderSettingsModal());
    else if(state.modal==='privacy') document.body.insertAdjacentHTML('beforeend', renderPrivacyModal());

    const shopInput = document.getElementById('shopNameInput');
    if(shopInput) shopInput.value = getShopName();
    applyA11yLabels();
  }

  /* 아이콘만 있는 버튼은 스크린리더에서 그냥 "버튼"으로 읽힌다. title이 있는 건
     aria-label로 옮기고, 닫기처럼 title이 없는 것만 이름을 지어준다. */
  const A11Y_FALLBACK = [
    ['.modal-close', '닫기'],
    ['[data-action="openSettings"]', '설정']
  ];
  function applyA11yLabels(){
    A11Y_FALLBACK.forEach(([sel, label])=>{
      document.querySelectorAll(sel).forEach(el=>{
        if(!el.getAttribute('aria-label') && !el.getAttribute('title')) el.setAttribute('aria-label', label);
      });
    });
    document.querySelectorAll('button[title]:not([aria-label])').forEach(b=>{
      b.setAttribute('aria-label', b.getAttribute('title'));
    });
  }

  function renderTopNav(){
    const shop = getShopName();
    return `<div class="topnav">
      <div class="topnav-inner">
        <div class="topnav-brand"><div class="mark"></div><b>${shop ? escapeHtml(shop) : '이름 없는 분식집'}</b></div>
        <button class="nav-item" data-action="openSettings"><span class="nav-icon">${icon('settings')}</span><span class="label">설정</span></button>
      </div>
    </div>
    <div class="topnav-ad-wrap">${renderAdSlot('banner')}</div>`;
  }

  /* ---- 개인정보처리방침 (애드센스 심사용 최소 고지) ---- */

    return `<div class="modal-overlay" data-action="closeModal">

    club: { w:54, h:36, label:'클럽 샌드위치', src:'data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAADYAAAAkCAYAAADCW8lNAAACbElEQVR42t2YwStEQRjAv/cSK2VP5CApKfueIg7cKeHg4kApcpHTupA/YeOiHMRBlHBwoZDizkFJnqe2rU0O4rQrWS7rNLMz82bmzVvhzfsuM7P7fTPze99733zfGCCQvqHJImggFyfbBu93Q1cgP0BDBpTqKULCjoUSxHUKsHhlCAFNHlSqp+iBcp2CZ2KVxYPaqNon7BjeJ++NM0goVonnLdcpBPYiaxN0DpE+C056EIOxUDK4sLyKPEFwFeVOEHYxUefGzYPuQjJgj62OdVFKse53LWAK1zWlQQdA3UaGBtvdO6IMmm/jWoBlnRw1ToJNv4pRE+yx5JsNh9NVpVexrVULgGYrjfsjm5/ecD9WS7u0M1ErDPl/HSll67NBbz8fB88BzcKRMj5aDwAAewcv/+IZlfURlNIBrZugA9rkpSO6Q+HsXtdSRVbCmLJiTee6TAnIz6O8B8PasDp+/5erK6ygdamo/eCUn9LOyjwAAEzMLXPHPPHTUZnDT1fpzoPnnbOldm/i+ZCmE2ZBlvJaOQgAAHVfp+pJLTG3LPsZWLiTelF653HY+yRMNrnpjR0PrJ91ctgO9WW2pM3IZaN/8CAP6hs3T6VUSKrv73H/w7Lw+MOypACkXTn6Mlu0V3SGUZc5qoImJVu/TbKbUdVn9VTX8mT3vy1BNvUTG+pqgPy+kGtR1sy2bFb9360ompts0EBQopaFD0vLwuHs/vx4KxIpVf/wVLSvBqhCc30tpTXMzOxiKSpenGxjuJamhshk+NJwn3l8psY88LDpUOGe/PAyj8+eCcIsaL8oaFBgUSw0TdkHqGPQQPINTA+6Irqr6D0AAAAASUVORK5CYII=' },
    corndog: { w:72, h:18, label:'콘도그', src:'data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAEgAAAASCAYAAAD4+JjWAAABFklEQVR42mNkoDNw9or/zzBIwd5tCxnRxRhHAwZ/QDEOROB0mA++sKo4yYg1kBjpGTiDMWDwBdTebQsZWegdOJraHAzXr/5g0NTmGDSBAnPP9as/GDrM/6MEEtNoysHvB0Z6FKxDMYBgqYhpNHDwA4Jl0MYkdorzNT5AjBpiwYXrnxgMNPlI1sPAwIBTHxM9YwPmGPSApBYgNXCIAYwDlcVgtdj1qz8wYp7YlABLfYRSASkAZibBMghbs5saDTBiYp5YjxKTfckpGujS1aBWNU+NMorUsgk5Umnakh6qbSFYAO3dtpCRpoU0cjaFWQorLwYrjV4kDEhnNYLvI4OBJh886Q8GesUn/oHprI4OdwyjgMJWcwMA/5/5feIJ06QAAAAASUVORK5CYII=' },
    cottoncandy: { w:18, h:18, label:'솜사탕', src:'data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAABIAAAASCAYAAABWzo5XAAAA0UlEQVR42mNkwAKcveL/M+ABe7ctZEQXYyTFAHwGMuIyZE9VNlbNLm1TsRrGiG4IhgEaKgwMN+7gNXDvtoWMTARdATNEQwWCcahlwggXJMXEAmev+P9wF+1Z1I/qAmwuQ5OD62FgYGAi2XocLibdIBwuZsJpGzab8cizEKX4xh0Em2ivYQlUYmKSiZzwwCbOiJKqkaKTGOASV4hwEbacjNc1ODIvEy4bCIULilp8uR8GZk7vYGBgYGBIz6zAW5Qw4SusGBgYGJTlJBiU5SQIlkcAYyVRDvv8M0QAAAAASUVORK5CYII=' }
  };
  const FOOD_ORDER = ['corndog','glazed','sausage','cottoncandy','club','sub','choc','straw','cheese','graham'];
  function examSubjects(){ return (state.data.examWeek && state.data.examWeek.subjects) || []; }
  function toggleExamAdd(){ state.examAddOpen = !state.examAddOpen; render(); }
  function addExamSubject(name, itemLines){
    name = (name||'').trim(); if(!name) return;
    const items = (itemLines||'').split('\n').map(s=>s.trim()).filter(Boolean).map(text=>({id:genId(), text, done:false}));
    state.data.examWeek = state.data.examWeek || {subjects:[]};
    const food = FOOD_ORDER[state.data.examWeek.subjects.length % FOOD_ORDER.length];
    state.data.examWeek.subjects.push({id:genId(), name, food, items});
    persist(); render();
  }
  function submitExamSubject(){
    const nameEl = document.getElementById('examNewName');
    const itemsEl = document.getElementById('examNewItems');
    if(!nameEl || !nameEl.value.trim()) return;
    state.examAddOpen = false;
    addExamSubject(nameEl.value, itemsEl ? itemsEl.value : '');
  }
  function deleteExamSubject(id){
    state.data.examWeek.subjects = examSubjects().filter(s=>s.id!==id);
    persist(); render();
  }
  function addExamItem(subjectId, text){
    text = (text||'').trim(); if(!text) return;
    const s = examSubjects().find(x=>x.id===subjectId); if(!s) return;
    s.items.push({id:genId(), text, done:false});
    persist(); render();
  }
  function toggleExamItem(subjectId, itemId){
    const s = examSubjects().find(x=>x.id===subjectId); if(!s) return;
    const it = s.items.find(x=>x.id===itemId); if(!it) return;
    it.done = !it.done;
    persist(); render();
  }
  function deleteExamItem(subjectId, itemId){
    const s = examSubjects().find(x=>x.id===subjectId); if(!s) return;
    s.items = s.items.filter(x=>x.id!==itemId);
    persist(); render();
  }
  function examSubjectCardHtml(s){
    const food = FOOD_SPRITES[s.food] || FOOD_SPRITES.choc;
    const n = s.items.length;
    const done = s.items.filter(i=>i.done).length;
    const pct = n>0 ? Math.round(done/n*100) : 0;
    const finished = n>0 && done===n;
    const itemsHtml = s.items.map((it,i)=>`
      <div class="exam-item ${it.done?'done':''}">
        <span class="exam-item-no">${String(i+1).padStart(2,'0')}</span>
        <div class="exam-item-text">${escapeHtml(it.text)}</div>
        <div class="exam-item-dots"></div>
        <button class="exam-item-check" data-action="toggleExamItem" data-subject="${s.id}" data-id="${it.id}">${it.done?'완료':'대기'}</button>
        <button class="task-del" style="opacity:1;" title="삭제" data-action="deleteExamItem" data-subject="${s.id}" data-id="${it.id}">${icon('trash')}</button>
      </div>`).join('');
    const barHtml = n===0 ? `<div class="empty" style="padding:4px 0 10px;">아직 주문 항목이 없어요 — 아래에서 추가해줘.</div>` : `
      <div class="food-bar" data-subject="${s.id}" style="--n:${n};">
        <div class="food-bar-img" style="background-image:url('${food.src}');"></div>
        <div class="food-bar-blocks"></div>
        <div class="food-bar-eaten" style="width:${pct}%;"></div>
      </div>`;
    return `<div class="exam-card ${finished?'order-done':''}" data-subject="${s.id}">
      ${finished?`<div class="order-stamp">완료!</div>`:''}
      <div class="exam-card-head">
        <div class="exam-card-shop">${escapeHtml(getShopName() || '이름 없는 분식집')} · 오늘의 주문서</div>
        <div class="exam-card-title">${escapeHtml(s.name)}</div>
        <div class="exam-card-meta">${food.label} 세트 · ${done}/${n} 완료</div>
        <button class="task-del exam-card-del" title="과목 삭제" data-action="deleteExamSubject" data-id="${s.id}">${icon('trash')}</button>
      </div>
      ${barHtml}
      <div class="exam-items">${itemsHtml}</div>
      <div class="add-row exam-add-item-row">
        <input type="text" class="add-input exam-item-input" data-subject="${s.id}" placeholder="항목 추가 후 Enter">
        <button class="btn-outline" data-action="addExamItemFromRow" data-subject="${s.id}">추가</button>
      </div>
      <div class="exam-card-total">합계 &nbsp;${done} / ${n}&nbsp; 완료</div>
    </div>`;
  }
  function renderKitchenScene(){
    return `<div class="kitchen-scene">
      <div class="kitchen-steam s1"></div>
      <div class="kitchen-steam s2"></div>
      <div class="kitchen-steam s3"></div>
      <div class="kitchen-cook">
        <svg viewBox="0 0 54 62" width="54" height="62" fill="none">
          <rect x="17" y="6" width="20" height="14" rx="9" fill="#fff" stroke="var(--border-strong)"/>
          <ellipse cx="27" cy="19" rx="13" ry="5" fill="#fff" stroke="var(--border-strong)"/>
          <circle cx="27" cy="29" r="9" fill="#FFD9A6" stroke="var(--border-strong)"/>
          <path d="M10 56c0-12 8-20 17-20s17 8 17 20" fill="var(--blue)" stroke="var(--border-strong)"/>
          <ellipse class="kitchen-arm" cx="13" cy="49" rx="5" ry="3" fill="var(--blue)" stroke="var(--border-strong)"/>
          <ellipse class="kitchen-arm" cx="41" cy="49" rx="5" ry="3" fill="var(--blue)" stroke="var(--border-strong)"/>
        </svg>
      </div>
      <div class="kitchen-ledge"></div>
      <div class="kitchen-caption">오늘도 맛있게 끝내볼까요?</div>
    </div>`;
  }
  function renderExamPage(){
    const subjects = examSubjects();
    const addForm = state.examAddOpen ? `<div class="exam-add-form">
        <input type="text" id="examNewName" placeholder="과목 이름 (예: 수학)" autofocus>
        <textarea id="examNewItems" rows="5" placeholder="이번 주에 끝낼 것들을 한 줄에 하나씩 적어줘
예)
미적분 7단원 복습
기출 3회분 풀기"></textarea>
        <div class="add-row-line">
          <button class="btn" data-action="submitExamSubject">추가</button>
          <button class="btn-outline" data-action="toggleExamAdd">취소</button>
        </div>
      </div>`
      : `<button class="exam-add-trigger" data-action="toggleExamAdd">+ 과목 추가 (새 주문서)</button>`;
    return `<div class="fade-in">
      ${renderKitchenScene()}
      <div class="page-head"><h1>이번주</h1></div>
      <div class="empty" style="padding:0 0 14px;">과목마다 주문서를 하나씩 받았다고 생각하고, 이번 주에 끝낼 것들을 적어줘. 끝낸 만큼 그 과목 간식을 먹어치워.</div>
      <div class="exam-add-wrap">${addForm}</div>
      ${subjects.length===0 ? '' : `<div class="exam-grid">${subjects.map(examSubjectCardHtml).join('')}</div>`}
    </div>`;
  }

  /* ============ 액션: 설정 ============ */
  function saveShopName(){
    const input = document.getElementById('shopNameInput');
    setShopName(input ? input.value.trim() : '');
    render();
  }

  /* ============ 내보내기/가져오기 ============ */
  function exportData(){
    const blob = new Blob([JSON.stringify(state.data,null,2)],{type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href=url; a.download=`city-of-brain-backup-${now.getFullYear()}${String(now.getMonth()+1).padStart(2,'0')}${String(now.getDate()).padStart(2,'0')}.json`;
    document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);
  }
  function importDataFromFile(file){
    const reader = new FileReader();
    reader.onload = e=>{
      try{
        const parsed = JSON.parse(e.target.result);
        state.data = { examWeek: parsed.examWeek || {subjects:[]} };
        persist(); render();
      }catch(err){ alert('파일을 읽지 못했어요. JSON 형식이 맞는지 확인해주세요.'); }
    };
    reader.readAsText(file);
  }

  /* ---- 항목을 체크할 때 한입 베어무는 연출 + 주문서를 다 끝내면 도장 ----
     render()가 매번 DOM을 통째로 새로 그리므로, 이 효과들은 리렌더 뒤에 생긴
     새 DOM에 직접 클래스를 붙였다 animationend에 떼는 방식으로 처리한다
     (박스 드래그의 drop-bounce와 같은 패턴). */
  const BITE_WORDS = ['냠!','아삭!','꿀꺽!','냠냠!'];
  function toggleExamItemWithFx(subjectId, itemId){
    const s = examSubjects().find(x=>x.id===subjectId);
    const it = s && s.items.find(x=>x.id===itemId);
    if(!it) return;
    const wasDone = it.done;
    toggleExamItem(subjectId, itemId); // persist() + render() happens inside
    if(wasDone) return; // 체크를 해제한 거면 먹는 연출은 안 함
    const bar = document.querySelector(`.food-bar[data-subject="${subjectId}"]`);
    if(bar){
      bar.classList.add('just-ate');
      bar.addEventListener('animationend', ()=>bar.classList.remove('just-ate'), {once:true});
      const pop = document.createElement('div');
      pop.className = 'bite-pop';
      pop.textContent = BITE_WORDS[Math.floor(Math.random()*BITE_WORDS.length)];
      bar.appendChild(pop);
      pop.addEventListener('animationend', ()=>pop.remove(), {once:true});
    }
    const stamp = document.querySelector(`.exam-card[data-subject="${subjectId}"] .order-stamp`);
    if(stamp){
      stamp.classList.add('stamp-pop');
      stamp.addEventListener('animationend', ()=>stamp.classList.remove('stamp-pop'), {once:true});
    }
  }

  /* ============ 이벤트 위임 ============ */
  document.body.addEventListener('click', function(e){
    const el = e.target.closest('[data-action]'); if(!el) return;
    if(el.dataset.action==='closeModal' && el.classList.contains('modal-overlay') && e.target!==el) return;
    switch(el.dataset.action){
      case 'openSettings': state.modal='settings'; render(); break;
      case 'openPrivacy': state.modal='privacy'; render(); break;
      case 'closeModal': state.modal=null; render(); break;
      case 'exportData': exportData(); break;
      case 'importTrigger': document.getElementById('importFile').click(); break;
      case 'toggleExamAdd': toggleExamAdd(); break;
      case 'submitExamSubject': submitExamSubject(); break;
      case 'deleteExamSubject': deleteExamSubject(el.dataset.id); break;
      case 'toggleExamItem': toggleExamItemWithFx(el.dataset.subject, el.dataset.id); break;
      case 'deleteExamItem': deleteExamItem(el.dataset.subject, el.dataset.id); break;
      case 'addExamItemFromRow': {
        const input = document.querySelector(`.exam-item-input[data-subject="${el.dataset.subject}"]`);
        if(input) addExamItem(el.dataset.subject, input.value);
        break;
      }
      case 'saveShopName': saveShopName(); break;
      case 'signInGoogle': signInGoogle(); break;
      case 'signOut': signOut(); break;
    }
  });

  document.body.addEventListener('keydown', function(e){
    if(e.key!=='Enter') return;
    if(e.target.classList.contains('exam-item-input')){
      addExamItem(e.target.dataset.subject, e.target.value);
    }
  });

  document.getElementById('importFile').addEventListener('change', function(e){
    if(e.target.files && e.target.files[0]) importDataFromFile(e.target.files[0]);
    e.target.value = '';
  });

  /* ============ 초기화 ============ */
  (function init(){
    const saved = loadData();
    if(saved){
      state.data = { examWeek: saved.examWeek || {subjects:[]} };
    }
    // 세션 확인은 비동기로 흘려보냄 — 네트워크가 느리거나 막혀도 첫 화면은 바로 그려짐.
    // sb가 있으면 세션 확인 전까지는 기본적으로 로그인 게이트가 보이고, 확인되면 initAuth가 다시 그려줌
    render();
    initAuth();
  })();

})();
</script>
</body>
</html>
