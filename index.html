  /* ---- 도시 (City, beta) ----
     새 데이터를 저장하지 않음 — 수업 과제(teachers[key].review)와 자율학습(teachers[key].self + personal.tasks)을
     그대로 읽어서 시각화만 새로 하는 뷰 레이어. 완료 처리도 기존 completeItem/completePersonalTask를 그대로 씀. */
  function citySubjectColor(item){
    const box = item.boxKey && BOX_KEYS.has(item.boxKey) ? BOXES.find(b=>b.key===item.boxKey) : null;
    return box ? box.qc : 'var(--text-3)';
  }
  // 차(수업 과제): 3단계 — 막힘/정체 컨셉은 빼고 정상→연기→고장으로 단순화
  function carDecayStage(days){
    if(days>=12) return 2; // 고장
    if(days>=4) return 1;  // 연기
    return 0;               // 정상 주행
  }
  // 집(자율학습): 4단계 — 평온→연기→화재→붕괴
  function houseDecayStage(days){
    if(days>=15) return 3; // 붕괴
    if(days>=10) return 2; // 화재
    if(days>=4) return 1;  // 연기
    return 0;               // 평온
  }
  // 연기 단계(1단계)에 들어선 뒤로도 4~7일째에 걸쳐 연기가 점점 짙어지게 — 하루 만에
  // 뚝 나타났다 그대로 머무는 대신 방치가 길어질수록 눈에 띄게 다급해 보인다
  function smokeLevel(days){ return Math.max(0, Math.min(3, days-4)); }
  function collectCityCitizens(){
    return state.data.tasks.map(item=>{
      const days = itemStaleDays(item);
      const vehicle = item.corner==='review' ? 'car' : 'house';
      const stage = vehicle==='car' ? carDecayStage(days) : houseDecayStage(days);
      return {vehicle, corner:item.corner, item, days, stage, smoke:smokeLevel(days), color:citySubjectColor(item)};
    });
  }
  function collectGraduatingThisWeek(){
    const weekStart = mondayOf(now).getTime();
    return state.data.completed
      .filter(it=>it.completedAt>=weekStart)
      .map(it=>({vehicle: it.corner==='review'?'car':'house', corner:it.corner, item:it, color:citySubjectColor(it)}));
  }
  function collectGraduationArchive(){
    const groups = {};
    state.data.completed.forEach(it=>{
      const wk = mondayOf(new Date(it.completedAt)).getTime();
      (groups[wk] = groups[wk] || []).push({vehicle: it.corner==='review'?'car':'house', corner:it.corner, item:it, color:citySubjectColor(it)});
    });
    return Object.keys(groups).map(Number).sort((a,b)=>b-a)
      .map(wk=>({weekStart:wk, items:groups[wk].sort((a,b)=>b.item.completedAt-a.item.completedAt)}));
  }

  /* ============ 도시 3D (Kenney CC0 킷 + three.js) ============
     #app은 상태가 바뀔 때마다 innerHTML로 통째로 갈리기 때문에, WebGL 캔버스를 그 안에
     직접 넣으면 클릭 한 번에 도시가 날아간다. 그래서 3D 컨테이너는 #app 바깥에서 딱 한 번
     만들어 두고, 렌더가 끝난 뒤 자리(#city3dSlot)에 끼워 넣는다.
     three.js 번들(160KB gzip)과 모델(363KB gzip)은 도시 탭에 처음 들어올 때만 받는다. */
  const CITY_TILE = 4;
  // 3칸마다 한 줄이 도로 → 나머지 칸이 2x2 블록의 구획이 된다
  function isoRoadAxis(N){ const a=[]; for(let i=0;i<N;i++) if(i%3===2) a.push(i); return a; }
  function isoPlotAxis(N){ const a=[]; for(let i=0;i<N;i++) if(i%3!==2) a.push(i); return a; }
  // 빈 건물을 안 채우니 집 수에 딱 맞게 시작해서 늘려간다 (넓은 빈 땅이 안 생기게)
  function isoGridDim(houseCount){
    let N = 6;
    while(isoPlotAxis(N).length*isoPlotAxis(N).length < houseCount && N < 27) N += 3;
    return N;
  }
  const CITY_BUILDINGS = ['building-a','building-b','building-c','building-d','building-e','building-f',
                          'building-g','building-h','building-i','building-j','building-k','building-l'];
  const CITY_CARS = ['car-sedan','car-suv','car-taxi','car-van','car-hatchback-sports','car-delivery','car-truck'];
  const CITY_CHARS = ['char-male-a','char-male-b','char-male-c','char-male-d',
                      'char-female-a','char-female-b','char-female-c','char-female-d'];
  const CITY3D = {
    THREE:null, host:null, canvasWrap:null, tip:null, statusEl:null,
    renderer:null, scene:null, camera:null, controls:null, raycaster:null, pointer:null,
    proto:{}, cityGroup:null, owned:[], cars:[], peds:[], walkers:[], hazards:[], beacons:[],
    running:false, raf:0, last:0, sig:'', phase:'idle', err:'', hover:null, downAt:null
  };

  function cssVarHex(v){
    const m = /var\((--[\w-]+)\)/.exec(v||'');
    if(!m) return v || '#8a8f9c';
    return (getComputedStyle(document.documentElement).getPropertyValue(m[1])||'').trim() || '#8a8f9c';
  }
  // GitHub Pages가 에셋을 오래 캐시해서, 번들·모델을 갱신하면 이 숫자를 올려야 새로 받는다
  const CITY_ASSET_V = '2';
  function cityAssetUrl(p){
    const u = new URL(p, document.baseURI);
    u.searchParams.set('v', CITY_ASSET_V);
    return u.href;
  }
  // 홈 화면 2단 구성(할 일 + 살아있는 도시)은 가로가 충분할 때만
  function isWideScreen(){ return window.innerWidth >= 1180; }
  function hexToRgbStr(hex){
    const h = (hex||'').replace('#','').trim();
    if(h.length!==6) return '198,204,216';
    return [0,2,4].map(i=>parseInt(h.slice(i,i+2),16)).join(',');
  }
  function citySignature(){
    const cz = collectCityCitizens();
    // smoke는 같은 단계 안에서도 날마다 짙어지는 연기 세기라 signature에 넣어야 갱신됨
    return cz.map(c=>c.item.id+':'+c.stage+':'+c.smoke+':'+c.vehicle).sort().join('|');
  }
  function setCityStatus(msg){
    if(CITY3D.statusEl) CITY3D.statusEl.textContent = msg || '';
    if(CITY3D.statusEl) CITY3D.statusEl.style.display = msg ? '' : 'none';
  }

  async function ensureCity3D(){
    if(CITY3D.phase==='loading' || CITY3D.phase==='ready') return;
    CITY3D.phase = 'loading';
    setCityStatus('3D 도시를 불러오는 중...');
    try{
      const THREE = await import(cityAssetUrl('assets/vendor/three-city.min.js'));
      CITY3D.THREE = THREE;
      const gltf = await new THREE.GLTFLoader().loadAsync(cityAssetUrl('assets/city/city-kit.glb'));
      gltf.scene.children.slice().forEach(n=>{ CITY3D.proto[n.name] = n; });
      applyWarmTownSkin(THREE);
      initCityRenderer();
      CITY3D.phase = 'ready';
      setCityStatus('');
      buildCityScene();
      startCityLoop();
    }catch(e){
      CITY3D.phase = 'error';
      CITY3D.err = (e && e.message) ? e.message : String(e);
      setCityStatus('3D 도시를 불러오지 못했어 — ' + CITY3D.err);
    }
  }

  /* Kenney 시티킷은 같은 UV에 색만 다른 팔레트를 여러 장 준다 —
     기본(초록 마을) 대신 따뜻한 톤(variation-b)으로 갈아끼운다. 건물/나무 쪽 머티리얼만
     건드리면 차·캐릭터는 원래 색을 그대로 유지한다. */
  function applyWarmTownSkin(THREE){
    const tex = new THREE.TextureLoader().load(cityAssetUrl('assets/city/town-warm.png'));
    tex.flipY = false;                 // glTF 텍스처 규약
    tex.colorSpace = THREE.SRGBColorSpace;
    const done = new Set();
    ['tree-large','tree-small','planter'].concat(CITY_BUILDINGS).forEach(name=>{
      const p = CITY3D.proto[name];
      if(!p) return;
      p.traverse(n=>{
        if(!n.isMesh || !n.material) return;
        (Array.isArray(n.material) ? n.material : [n.material]).forEach(m=>{
          if(done.has(m.uuid)) return;
          done.add(m.uuid);
          m.map = tex; m.needsUpdate = true;
        });
      });
    });
  }

  function initCityRenderer(){
    const T = CITY3D.THREE;
    const wrap = CITY3D.canvasWrap;
    const renderer = new T.WebGLRenderer({antialias:true, alpha:true, powerPreference:'low-power'});
    renderer.setPixelRatio(Math.min(2, window.devicePixelRatio||1));
    renderer.outputColorSpace = T.SRGBColorSpace;
    renderer.setClearColor(0x000000, 0);   // 캔버스는 투명 — 유리 상자 배경이 그대로 비침
    wrap.appendChild(renderer.domElement);

    const scene = new T.Scene();
    scene.background = null;
    scene.fog = new T.Fog(0x000000, 40, 130);

    const camera = new T.PerspectiveCamera(42, 1, 0.5, 400);
    camera.position.set(26, 24, 26);

    // 따뜻한 노을빛 조명 — 초록 마을이 아니라 해질녘 타운 느낌으로
    scene.add(new T.HemisphereLight(0xffd9b3, 0x3a2c24, 2.1));
    const sun = new T.DirectionalLight(0xffe3bb, 2.3);
    sun.position.set(20, 30, 14);
    scene.add(sun);
    const rim = new T.DirectionalLight(0xff9f6a, 0.7);
    rim.position.set(-22, 12, -18);
    scene.add(rim);

    const controls = new T.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.08;
    controls.enablePan = false;
    controls.minDistance = 12;
    controls.maxDistance = 90;
    controls.minPolarAngle = 0.18;
    controls.maxPolarAngle = 1.36; // 지면 아래로는 못 내려가게
    controls.target.set(0, 1.5, 0);

    Object.assign(CITY3D, {renderer, scene, camera, controls, raycaster:new T.Raycaster(), pointer:new T.Vector2()});
    bindCityPointer(renderer.domElement);

    const ro = new ResizeObserver(()=>resizeCity3D());
    ro.observe(wrap);
    resizeCity3D();
  }

  function resizeCity3D(){
    const wrap = CITY3D.canvasWrap;
    if(!wrap || !CITY3D.renderer) return;
    const w = wrap.clientWidth || 1, h = wrap.clientHeight || 1;
    CITY3D.renderer.setSize(w, h, false);
    CITY3D.camera.aspect = w/h;
    CITY3D.camera.updateProjectionMatrix();
  }

  function disposeCityGroup(){
    const T = CITY3D.THREE;
    if(CITY3D.cityGroup){
      CITY3D.scene.remove(CITY3D.cityGroup);
      CITY3D.cityGroup.traverse(o=>{ if(o.isMesh && o.geometry && o.geometry.userData.own) o.geometry.dispose(); });
    }
    // 원본(proto)과 공유하는 지오메트리·머티리얼은 두고, 이 도시에서 새로 만든 것만 정리
    CITY3D.owned.forEach(x=>{ try{ x.dispose(); }catch(e){} });
    CITY3D.owned = [];
    CITY3D.cityGroup = null;
  }

  function makePuffTexture(rgb){
    const c = document.createElement('canvas'); c.width = c.height = 64;
    const g = c.getContext('2d');
    const grd = g.createRadialGradient(32,32,0,32,32,32);
    grd.addColorStop(0, `rgba(${rgb},0.85)`);
    grd.addColorStop(0.35, `rgba(${rgb},0.34)`);
    grd.addColorStop(0.7, `rgba(${rgb},0.09)`);
    grd.addColorStop(1, `rgba(${rgb},0)`);
    g.fillStyle = grd; g.fillRect(0,0,64,64);
    const tex = new CITY3D.THREE.CanvasTexture(c);
    CITY3D.owned.push(tex);
    return tex;
  }
  function makeRoadTexture(alongX){
    const c = document.createElement('canvas'); c.width = 64; c.height = 64;
    const g = c.getContext('2d');
    g.fillStyle = '#59504b'; g.fillRect(0,0,64,64);
    g.fillStyle = 'rgba(255,240,215,.34)';
    if(alongX) g.fillRect(8, 30, 26, 4); else g.fillRect(30, 8, 4, 26);
    const tex = new CITY3D.THREE.CanvasTexture(c);
    tex.wrapS = tex.wrapT = CITY3D.THREE.RepeatWrapping;
    CITY3D.owned.push(tex);
    return tex;
  }

  function buildCityScene(){
    const T = CITY3D.THREE;
    if(!T || !CITY3D.scene) return;
    disposeCityGroup();
    const g = new T.Group();
    CITY3D.cityGroup = g; CITY3D.scene.add(g);
    CITY3D.cars = []; CITY3D.peds = []; CITY3D.walkers = []; CITY3D.hazards = []; CITY3D.beacons = [];

    const citizens = collectCityCitizens();
    const cars = citizens.filter(c=>c.vehicle==='car');
    const houses = citizens.filter(c=>c.vehicle==='house');
    const N = isoGridDim(houses.length);
    const half = (N-1)/2;
    const wx = i => (i-half)*CITY_TILE;
    const span = (N+1)*CITY_TILE;

    // 캐릭터는 스킨드 메시라 그냥 clone() 하면 뼈대가 원본에 묶인 채로 복제돼서 뭉개진다
    function spawn(name){
      const p = CITY3D.proto[name];
      if(!p) return null;
      return name.startsWith('char-') ? T.skeletonClone(p) : p.clone(true);
    }
    // 기본 자세가 T포즈라 팔을 내려주고, 걷기 애니메이션용 뼈를 뽑아둔다
    function poseCharacter(o){
      const bones = {};
      o.traverse(n=>{ if(n.isBone) bones[n.name] = n; });
      if(bones['arm-left'])  bones['arm-left'].rotation.z  =  1.28;
      if(bones['arm-right']) bones['arm-right'].rotation.z = -1.28;
      return {armL:bones['arm-left'], armR:bones['arm-right'],
              legL:bones['leg-left'], legR:bones['leg-right']};
    }
    // 모델마다 크기가 제각각이라 기준 치수에 맞춰 스케일하고 바닥(y=0)에 앉힘.
    // 건물·차는 발자국 폭 기준, 나무·사람·잔해처럼 가늘고 긴 건 높이 기준으로 재야
    // 폭으로 맞추다 하늘까지 솟아버리는 일이 없다.
    function fitBy(o, target, axis){
      let box = new T.Box3().setFromObject(o);
      const size = new T.Vector3(); box.getSize(size);
      const base = axis==='h' ? size.y
                 : axis==='m' ? Math.max(size.x, size.y, size.z)
                 : Math.max(size.x, size.z);
      // multiplyScalar가 맞다 — quantize()로 합친 모델 중 상당수가 이미 1이 아닌
      // 스케일을 갖고 있어서 setScalar로 덮으면 그 보정값이 날아가 크기가 뒤틀린다
      o.scale.multiplyScalar(target / (base || 1));
      box = new T.Box3().setFromObject(o);
      const c = new T.Vector3(); box.getCenter(c);
      o.position.x -= c.x; o.position.z -= c.z; o.position.y -= box.min.y;
      return o;
    }
    const fit  = (o, w) => fitBy(o, w, 'w');
    const fitH = (o, h) => fitBy(o, h, 'h');
    // 건물은 발자국 폭과 높이 둘 다 한도를 두고 더 빡빡한 쪽을 따른다.
    // 폭만 맞추면 경사 지붕처럼 위로 긴 모델이 혼자 거대해진다.
    function fitBuilding(o, targetW, maxH){
      let box = new T.Box3().setFromObject(o);
      const size = new T.Vector3(); box.getSize(size);
      const byW = targetW / (Math.max(size.x, size.z) || 1);
      const byH = maxH / (size.y || 1);
      o.scale.multiplyScalar(Math.min(byW, byH));
      box = new T.Box3().setFromObject(o);
      const c = new T.Vector3(); box.getCenter(c);
      o.position.x -= c.x; o.position.z -= c.z; o.position.y -= box.min.y;
      return o;
    }
    // 소품은 가장 긴 변을 기준으로 — 납작한 잔해를 높이로 맞추면 판때기가 하늘을 덮는다
    const fitMax = (o, m) => fitBy(o, m, 'm');
    // strength: 건물은 약하게(마을 색감 유지), 차·사람은 강하게(작아서 티가 나야 함)
    function recolor(o, hex, mode, strength){
      o.traverse(n=>{
        if(!n.isMesh || !n.material) return;
        const arr = Array.isArray(n.material) ? n.material : [n.material];
        const out = arr.map(m=>{
          const cm = m.clone(); CITY3D.owned.push(cm);
          if(mode==='dark') cm.color.multiplyScalar(0.3);
          else cm.color.lerp(new T.Color(hex), strength==null ? 0.6 : strength);
          return cm;
        });
        n.material = Array.isArray(n.material) ? out : out[0];
      });
    }
    function pick(cz, obj){
      obj.traverse(n=>{ n.userData.cz = cz; });
      obj.userData.cz = cz;
    }

    /* 땅덩어리 — 종이 한 장이 아니라 두께 있는 지반으로 (윗면 잔디, 옆면 흙) */
    const SLAB = CITY_TILE*0.9;
    const grassMat = new T.MeshStandardMaterial({color:0x6d7a45, roughness:1, metalness:0});
    const soilMat  = new T.MeshStandardMaterial({color:0x6b5340, roughness:1, metalness:0});
    const rockMat  = new T.MeshStandardMaterial({color:0x4a382c, roughness:1, metalness:0});
    CITY3D.owned.push(grassMat, soilMat, rockMat);
    const slabGeo = new T.BoxGeometry(span, SLAB, span);
    slabGeo.userData.own = true;
    // BoxGeometry 면 순서: +x, -x, +y(윗면), -y(바닥), +z, -z
    const slab = new T.Mesh(slabGeo, [soilMat, soilMat, grassMat, rockMat, soilMat, soilMat]);
    slab.position.y = -SLAB/2;
    g.add(slab);
    // 흙과 잔디 사이 얇은 띠 — 단면이 잘린 느낌을 줄여줌
    const rimGeo = new T.BoxGeometry(span*1.004, 0.28, span*1.004);
    rimGeo.userData.own = true;
    const rimMat = new T.MeshStandardMaterial({color:0x7d6248, roughness:1});
    CITY3D.owned.push(rimMat);
    const rimMesh = new T.Mesh(rimGeo, rimMat);
    rimMesh.position.y = -0.16;
    g.add(rimMesh);

    const roadMatZ = new T.MeshStandardMaterial({map:makeRoadTexture(false), roughness:1});
    const roadMatX = new T.MeshStandardMaterial({map:makeRoadTexture(true), roughness:1});
    CITY3D.owned.push(roadMatZ, roadMatX);
    roadMatZ.map.repeat.set(1, N+1); roadMatX.map.repeat.set(N+1, 1);
    isoRoadAxis(N).forEach(i=>{
      const a = new T.Mesh(new T.PlaneGeometry(CITY_TILE, span), roadMatZ);
      a.geometry.userData.own = true; a.rotation.x = -Math.PI/2; a.position.set(wx(i), 0.02, 0); g.add(a);
      const b = new T.Mesh(new T.PlaneGeometry(span, CITY_TILE), roadMatX);
      b.geometry.userData.own = true; b.rotation.x = -Math.PI/2; b.position.set(0, 0.03, wx(i)); g.add(b);
    });

    /* 구획 배치 — 주민 집이 한쪽에 몰리지 않게 해시로 섞어서 고르게 흩뿌림 */
    const ax = isoPlotAxis(N);
    const plots = [];
    ax.forEach(c=>ax.forEach(r=>plots.push({c,r})));
    plots.sort((a,b)=>hashStr('plot'+a.c+'x'+a.r)-hashStr('plot'+b.c+'x'+b.r));

    const used = new Set();
    houses.forEach((cz,i)=>{
      const cell = plots[i % plots.length];
      used.add(cell.c+'x'+cell.r);
      const holder = new T.Group();
      holder.position.set(wx(cell.c), 0, wx(cell.r));
      holder.rotation.y = (hashStr(cz.item.id+'rot')%4) * Math.PI/2;
      g.add(holder);

      const hex = cssVarHex(cz.color);
      if(cz.stage===3){
        // 붕괴 — 건물을 납작하게 누르고 어둡게, 주변에 잔해
        const b = spawn(CITY_BUILDINGS[hashStr(cz.item.id)%CITY_BUILDINGS.length]);
        if(b){ fitBuilding(b, CITY_TILE*0.74, CITY_TILE*0.7); b.scale.y *= 0.24; recolor(b, null, 'dark'); holder.add(b); }
        ['debris-plate','debris-door','debris-tire'].forEach((d,k)=>{
          const o = spawn(d); if(!o) return;
          fitMax(o, CITY_TILE*0.13);
          o.position.set(Math.cos(k*2.1)*0.85, o.position.y, Math.sin(k*2.1)*0.85);
          o.rotation.y = k*1.7; recolor(o, null, 'dark'); holder.add(o);
        });
      } else {
        const b = spawn(CITY_BUILDINGS[hashStr(cz.item.id)%CITY_BUILDINGS.length]);
        if(b){ fitBuilding(b, CITY_TILE*0.78, CITY_TILE*0.72); recolor(b, hex, 'tint', 0.34); holder.add(b); }
        if(cz.stage===1) addHazard(holder, 'smoke', 2.6, hex, 0.4+cz.smoke*0.2);
        if(cz.stage===2){ addHazard(holder, 'fire', 2.2, hex); addHazard(holder, 'smoke', 3.4, hex); }
      }
      addGlow(holder, hex, CITY_TILE*1.5);
      addRing(holder, hex, CITY_TILE*0.52);
      addBeacon(holder, hex, cz.stage===3 ? 1.6 : 3.6);
      pick(cz, holder);
    });

    // 빈 구획엔 건물을 세우지 않는다 — 집은 할 일 하나당 하나. 대신 가끔 나무만 심어서
    // 허전하지 않게 하고, 어느 집이 진짜 할 일인지 헷갈리지 않게 한다.
    plots.forEach(p=>{
      if(used.has(p.c+'x'+p.r)) return;
      const hs = hashStr('f'+p.c+'_'+p.r);
      if(hs%2!==0) return;
      const holder = new T.Group();
      holder.position.set(wx(p.c), 0, wx(p.r));
      holder.rotation.y = (hs%4)*Math.PI/2;
      g.add(holder);
      const t1 = spawn(hs%2 ? 'tree-large' : 'tree-small');
      if(t1){ fitMax(t1, CITY_TILE*(hs%2?0.6:0.46)); t1.position.x += 0.6; holder.add(t1); }
      if(hs%5===0){
        const t2 = spawn('tree-small');
        if(t2){ fitMax(t2, CITY_TILE*0.38); t2.position.set(-1, t2.position.y, 0.8); holder.add(t2); }
      }
    });

    /* 자동차 — 도로 한 줄을 편도로 끝까지 달린다. 도로 영역(맵) 밖으로 나가는 지점,
       즉 도로 양 끝에서는 차체·링·글로우가 스무스하게 투명해져서 터널 속으로 들어가듯
       사라졌다가, 다시 시작점에서 스무스하게 나타난다 — 안 보일 때만 자리를 바꾸기
       때문에 순간이동이 눈에 보이지 않는다. */
    const roadIdxs = isoRoadAxis(N);
    const roadLines = roadIdxs.map(wx);
    const roads = [];
    roadIdxs.forEach((_,li)=>roads.push({axis:'z', li}));
    roadIdxs.forEach((_,li)=>roads.push({axis:'x', li}));
    cars.forEach((cz, idx)=>{
      const road = roads[idx % roads.length];
      const hs = hashStr(cz.item.id+'car');
      const o = spawn(CITY_CARS[hs % CITY_CARS.length]);
      if(!o) return;
      const hex = cssVarHex(cz.color);
      fit(o, CITY_TILE*0.86);
      recolor(o, hex, 'tint', 0.62);
      const holder = new T.Group();
      holder.add(o);
      const glow = addGlow(holder, hex, CITY_TILE*0.95);
      const ring = addRing(holder, hex, CITY_TILE*0.42);
      g.add(holder);
      pick(cz, holder);

      const dir = (hs%2) ? 1 : -1;
      const lane = roadLines[road.li] + dir*0.8;      // 우측통행
      const a = new T.Vector3(), b = new T.Vector3();
      if(road.axis==='z'){ a.set(lane,0,-span/2); b.set(lane,0,span/2); holder.rotation.y = 0; }
      else { a.set(-span/2,0,lane); b.set(span/2,0,lane); holder.rotation.y = Math.PI/2; }
      if(dir<0){ const t2=a.clone(); a.copy(b); b.copy(t2); holder.rotation.y += Math.PI; }

      if(cz.stage===2){
        // 고장 — 갓길에 비스듬히 서 있고 연기, 옆에 라바콘
        holder.position.lerpVectors(a, b, 0.42);
        holder.position.x += road.axis==='z' ? 1.4 : 0;
        holder.position.z += road.axis==='x' ? 1.4 : 0;
        holder.rotation.y += 0.35;
        addHazard(holder, 'smoke', 1.4, hex);
        const cone = spawn('cone');
        if(cone){ fitMax(cone, 0.42); cone.position.set(1.5, cone.position.y, 0.8); holder.add(cone); }
        addBeacon(holder, hex, 2.2);
      } else {
        const beacon = addBeacon(holder, hex, 2.2);
        const hazard = cz.stage===1 ? addHazard(holder, 'smoke', 1.4, hex, 0.4+cz.smoke*0.2) : null;
        // 차체·링·글로우 재질을 투명 처리 가능하게 만들어서 도로 양 끝에서 페이드시킨다
        const fadeMats = [];
        function collect(n){
          if(!n.isMesh && !n.isSprite) return;
          const arr = Array.isArray(n.material) ? n.material : [n.material];
          arr.forEach(m=>{ m.transparent = true; fadeMats.push({mat:m, base:m.opacity}); });
        }
        [o, ring, glow].forEach(node=>{ if(node) node.traverse(collect); });
        holder.position.copy(a);
        // 도로 폭 0.6칸만큼을 도로 양 끝 '터널 구간'으로 삼는다 — 도시가 커도 항상 같은 물리적 길이
        const fadeFrac = Math.min(0.1, (CITY_TILE*0.6)/span);
        CITY3D.cars.push({obj:holder, a, b, p:(hs%100)/100, fadeMats, fadeFrac, hazard, beacon,
                          speed:(cz.stage===1 ? 0.008 : 0.014) + ((hs>>4)%12)/4000});
      }
    });

    // 연기는 그 항목의 과목 테마색으로 — 어느 과목을 방치하고 있는지 멀리서도 보이게
    function addHazard(parent, type, baseY, hex, intensity){
      // intensity(0~1) — 연기 단계에 갓 들어선 날은 옅게, 며칠 지날수록 짙게(점층적으로)
      const iv = intensity==null ? 1 : Math.max(0.15, Math.min(1, intensity));
      const isFire = type==='fire';
      const rgb = isFire ? '255,120,25' : hexToRgbStr(hex);
      const tex = makePuffTexture(rgb);
      const group = new T.Group();
      group.position.y = baseY;
      parent.add(group);
      const puffs = [];
      const count = Math.max(4, Math.round((isFire ? 14 : 22) * iv));
      for(let i=0;i<count;i++){
        const m = new T.SpriteMaterial({map:tex, transparent:true, depthWrite:false,
          blending: isFire ? T.AdditiveBlending : T.NormalBlending, opacity:0});
        CITY3D.owned.push(m);
        const s = new T.Sprite(m);
        s.position.set((Math.random()-0.5)*0.5, 0, (Math.random()-0.5)*0.5);
        s.raycast = ()=>{};   // 흘러다니는 연기가 클릭을 가로채면 조준이 안 됨
        group.add(s); puffs.push(s);
      }
      const entry = {puffs, rise:isFire?2.0:5.2, speed:isFire?0.8:0.24,
                     size:(isFire?1.3:2.6)*(0.55+0.45*iv), alpha:(isFire?0.5:0.34)*iv,
                     drift:isFire?0.15:1.1, fadeMul:1};
      CITY3D.hazards.push(entry);
      return entry;
    }
    // 테마색 바닥 링 — 글로우만으론 밝은 모델 위에서 묻혀서, 선명한 테두리를 하나 더 깐다
    function addRing(parent, hex, radius){
      const geo = new T.RingGeometry(radius*0.82, radius, 40);
      geo.userData.own = true;
      const mat = new T.MeshBasicMaterial({color:new T.Color(hex), transparent:true,
        opacity:0.85, side:T.DoubleSide, depthWrite:false});
      CITY3D.owned.push(mat);
      const m = new T.Mesh(geo, mat);
      m.rotation.x = -Math.PI/2;
      m.position.y = 0.06;
      m.raycast = ()=>{};
      parent.add(m);
      return m;
    }
    // 테마색 바닥 글로우 — 진짜 할 일이 어디 있는지 한눈에
    function addGlow(parent, hex, size){
      const tex = makePuffTexture(hexToRgbStr(hex));
      const m = new T.SpriteMaterial({map:tex, transparent:true, depthWrite:false,
        blending:T.AdditiveBlending, opacity:0.32});
      CITY3D.owned.push(m);
      const s = new T.Sprite(m);
      s.scale.set(size, size, 1);
      s.position.y = 0.12;
      s.raycast = ()=>{};
      parent.add(s);
      return s;
    }
    function addBeacon(parent, hex, y){
      const mat = new T.MeshBasicMaterial({color:new T.Color(hex), transparent:true, opacity:0.92});
      CITY3D.owned.push(mat);
      const geo = new T.ConeGeometry(0.22, 0.5, 5);
      geo.userData.own = true;
      const m = new T.Mesh(geo, mat);
      m.rotation.x = Math.PI;      // 아래를 가리키는 핀
      m.position.y = y;
      parent.add(m);
      const entry = {obj:m, baseY:y, phase:Math.random()*6.28, baseOpacity:0.92, fadeMul:1};
      CITY3D.beacons.push(entry);
      return entry;
    }

    // 도시가 화면에 다 들어오도록 카메라 거리 계산 (도시가 커지면 다시 맞춤)
    CITY3D.controls.maxDistance = span*2.2;
    CITY3D.controls.minDistance = span*0.28;
    const dist = span*1.72, el = 0.62;                // 약 35도 위에서 내려다보는 각도
    const horiz = dist*Math.cos(el)/Math.SQRT2;
    CITY3D.homePos = new T.Vector3(horiz, dist*Math.sin(el), horiz);
    CITY3D.homeTarget = new T.Vector3(0, 1.5, 0);
    if(CITY3D.lastSpan !== span){
      CITY3D.camera.position.copy(CITY3D.homePos);
      CITY3D.controls.target.copy(CITY3D.homeTarget);
      CITY3D.controls.update();
      CITY3D.lastSpan = span;
    }
    CITY3D.scene.fog.near = span*0.9;
    CITY3D.scene.fog.far = span*3.2;
    CITY3D.atHome = true;
    CITY3D.lastInteract = 0;
    CITY3D.sig = citySignature();
  }

  // 팔다리를 번갈아 흔들어서 걷는 것처럼 보이게 (뼈 4개짜리 아주 단순한 워크 사이클)
  function stepRig(rig, phase){
    if(!rig) return;
    const s = Math.sin(phase);
    if(rig.legL) rig.legL.rotation.x =  s*0.45;
    if(rig.legR) rig.legR.rotation.x = -s*0.45;
    if(rig.armL) rig.armL.rotation.x = -s*0.35;
    if(rig.armR) rig.armR.rotation.x =  s*0.35;
  }
  function cityFrame(){
    CITY3D.raf = requestAnimationFrame(cityFrame);
    const now = performance.now();
    const dt = Math.min(0.05, (now - CITY3D.last)/1000 || 0.016);
    CITY3D.last = now;
    const t = now/1000;

    CITY3D.cars.forEach(c=>{
      c.p += c.speed*dt;
      if(c.p > 1) c.p -= 1;
      c.obj.position.lerpVectors(c.a, c.b, c.p);
      // 도로 양 끝(터널 구간)에서 스무스하게 투명해졌다가, 반대쪽 시작점에서 다시 나타난다
      const f = c.fadeFrac;
      const fade = c.p < f ? c.p/f : (c.p > 1-f ? (1-c.p)/f : 1);
      c.fadeMats.forEach(e=>{ e.mat.opacity = e.base*fade; });
      if(c.hazard) c.hazard.fadeMul = fade;
      if(c.beacon) c.beacon.fadeMul = fade;
    });
    CITY3D.peds.forEach(p=>{
      p.t += dt;
      if(p.t >= p.dur){
        p.t = 0; p.dur = 4 + Math.random()*4;
        p.from.copy(p.obj.position);
        const r = p.range || 2.6;
        p.to.set(p.home.x + (Math.random()-0.5)*r*2, 0, p.home.z + (Math.random()-0.5)*r*2);
        p.obj.rotation.y = Math.atan2(p.to.x-p.from.x, p.to.z-p.from.z);
      }
      p.obj.position.lerpVectors(p.from, p.to, p.t/p.dur);
      p.obj.position.y = Math.abs(Math.sin(t*4 + p.bob))*0.07;   // 걷는 느낌의 작은 위아래
      stepRig(p.rig, t*4 + p.bob);
    });
    CITY3D.walkers.forEach(w=>{
      w.p += w.speed*dt;
      if(w.p > 1) w.p -= 1;
      w.obj.position.lerpVectors(w.a, w.b, w.p);
      w.obj.position.y = Math.abs(Math.sin(t*4 + w.bob))*0.07;
      stepRig(w.rig, t*4 + w.bob);
    });
    CITY3D.hazards.forEach(h=>{
      h.puffs.forEach((s,i)=>{
        const ph = ((t*h.speed) + i/h.puffs.length) % 1;
        s.position.y = ph*h.rise;
        // 올라가면서 옆으로 퍼지게 — 안 그러면 빛기둥처럼 뭉쳐 보임
        s.position.x = Math.sin(i*2.1 + ph*2.4)*h.drift*ph;
        s.position.z = Math.cos(i*1.7 + ph*2.0)*h.drift*ph;
        s.material.opacity = Math.sin(ph*Math.PI)*h.alpha*(h.fadeMul==null?1:h.fadeMul);
        const sc = h.size*(0.4 + ph*1.1);
        s.scale.set(sc, sc, 1);
      });
    });
    CITY3D.beacons.forEach(b=>{
      b.obj.position.y = b.baseY + Math.sin(t*2 + b.phase)*0.16;
      b.obj.rotation.y = t*1.3;
      if(b.baseOpacity!=null) b.obj.material.opacity = b.baseOpacity*(b.fadeMul==null?1:b.fadeMul);
    });

    // 10초 동안 안 건드리면 알아서 기본 시점으로 돌아감
    if(!CITY3D.tween && !CITY3D.atHome && CITY3D.lastInteract
       && now - CITY3D.lastInteract > CITY_IDLE_RETURN_MS){
      resetCityView(1.1);
    }

    const tw = CITY3D.tween;
    if(tw){
      tw.t = Math.min(1, tw.t + dt/tw.dur);
      const e = tw.t<0.5 ? 2*tw.t*tw.t : 1-Math.pow(-2*tw.t+2,2)/2;   // ease-in-out
      CITY3D.camera.position.lerpVectors(tw.fromPos, tw.toPos, e);
      CITY3D.controls.target.lerpVectors(tw.fromTgt, tw.toTgt, e);
      if(tw.t>=1) CITY3D.tween = null;
    }

    CITY3D.controls.update();
    CITY3D.renderer.render(CITY3D.scene, CITY3D.camera);
  }
  function startCityLoop(){
    if(CITY3D.running || CITY3D.phase!=='ready') return;
    CITY3D.running = true; CITY3D.last = performance.now();
    CITY3D.raf = requestAnimationFrame(cityFrame);
  }
  function stopCityLoop(){
    CITY3D.running = false;
    if(CITY3D.raf) cancelAnimationFrame(CITY3D.raf);
    CITY3D.raf = 0;
    hideCityTip();
  }

  /* 마우스를 올리면 무슨 할 일인지 바로 보여줌 (클릭은 상세 모달) */
  function czUnderPointer(ev){
    if(!CITY3D.renderer) return null;
    const r = CITY3D.renderer.domElement.getBoundingClientRect();
    CITY3D.pointer.x = ((ev.clientX - r.left)/r.width)*2 - 1;
    CITY3D.pointer.y = -((ev.clientY - r.top)/r.height)*2 + 1;
    CITY3D.raycaster.setFromCamera(CITY3D.pointer, CITY3D.camera);
    const hits = CITY3D.raycaster.intersectObjects(CITY3D.cityGroup ? CITY3D.cityGroup.children : [], true);
    for(const h of hits){
      let o = h.object;
      while(o){ if(o.userData && o.userData.cz) return o.userData.cz; o = o.parent; }
    }
    return null;
  }
  function showCityTip(cz, ev){
    if(!CITY3D.tip) return;
    const isCar = cz.vehicle==='car';
    const tag = cz.item.boxKey && BOX_KEYS.has(cz.item.boxKey) ? BOXES.find(b=>b.key===cz.item.boxKey).label : '미분류';
    const stageLabel = isCar
      ? ['정상 주행 중','연기가 나는 중','완전히 고장남'][cz.stage]
      : ['평온함','굴뚝에서 연기','집에 불이 남','집이 무너짐'][cz.stage];
    CITY3D.tip.innerHTML = `<div class="ct-tag">${escapeHtml(tag)} · ${isCar?'수업 과제':'자율학습'}</div>`
      + `<div class="ct-text">${escapeHtml(cz.item.text)}</div>`
      + `<div class="ct-meta">${cz.days}일째 · ${stageLabel}</div>`;
    placeCityTip(ev);
  }
  function placeCityTip(ev){
    CITY3D.tip.style.display = 'block';
    const host = CITY3D.host.getBoundingClientRect();
    let x = ev.clientX - host.left + 14, y = ev.clientY - host.top + 14;
    const tw = CITY3D.tip.offsetWidth, th = CITY3D.tip.offsetHeight;
    if(x + tw > host.width - 6) x = ev.clientX - host.left - tw - 14;
    if(y + th > host.height - 6) y = ev.clientY - host.top - th - 14;
    CITY3D.tip.style.left = Math.max(6, x)+'px';
    CITY3D.tip.style.top = Math.max(6, y)+'px';
  }
  function hideCityTip(){ if(CITY3D.tip) CITY3D.tip.style.display = 'none'; }

  function bindCityPointer(el){
    el.addEventListener('pointermove', ev=>{
      if(CITY3D.downAt) return; // 카메라 돌리는 중엔 툴팁 안 띄움
      const cz = czUnderPointer(ev);
      CITY3D.hover = cz;
      el.style.cursor = cz ? 'pointer' : 'grab';
      if(cz) showCityTip(cz, ev); else hideCityTip();
    });
    el.addEventListener('pointerleave', ()=>{ hideCityTip(); CITY3D.hover = null; });
    el.addEventListener('pointerdown', ev=>{
      CITY3D.downAt = {x:ev.clientX, y:ev.clientY};
      markCityInteraction();
      hideCityTip();
    });
    el.addEventListener('wheel', markCityInteraction, {passive:true});
    el.addEventListener('pointerup', ev=>{
      const d = CITY3D.downAt; CITY3D.downAt = null;
      CITY3D.lastInteract = performance.now();
      if(!d) return;
      if(Math.abs(ev.clientX-d.x) > 4 || Math.abs(ev.clientY-d.y) > 4) return; // 드래그는 클릭 아님
      const cz = czUnderPointer(ev);
      if(!cz) return;
      openCityInspect(cz.item.id);
    });
  }

  // 카메라를 처음 잡아둔 시점으로 부드럽게 되돌림 (돌리다 길을 잃었을 때)
  const CITY_IDLE_RETURN_MS = 10000;
  function resetCityView(dur){
    if(!CITY3D.camera || !CITY3D.homePos) return;
    CITY3D.tween = {
      fromPos: CITY3D.camera.position.clone(), toPos: CITY3D.homePos.clone(),
      fromTgt: CITY3D.controls.target.clone(), toTgt: CITY3D.homeTarget.clone(),
      t: 0, dur: dur || 0.55
    };
    CITY3D.atHome = true;
  }
  function markCityInteraction(){
    CITY3D.lastInteract = performance.now();
    CITY3D.atHome = false;
    CITY3D.tween = null;   // 사용자가 카메라를 잡으면 복귀 애니메이션은 중단
  }

  function makeCityHost(){
    const host = document.createElement('div');
    host.className = 'city3d';
    host.innerHTML = `<div class="city3d-canvas"></div>
      <div class="city3d-tip"></div>
      <div class="city3d-status"></div>
      <button class="city3d-reset" type="button">기본 시점</button>
      <div class="city3d-hint">드래그로 회전 · 휠로 확대 · 마우스를 올리면 무슨 할 일인지 나와</div>`;
    host.querySelector('.city3d-reset').addEventListener('click', ()=>resetCityView());
    CITY3D.host = host;
    CITY3D.canvasWrap = host.querySelector('.city3d-canvas');
    CITY3D.tip = host.querySelector('.city3d-tip');
    CITY3D.statusEl = host.querySelector('.city3d-status');
    hideCityTip();
    return host;
  }

  // render()가 #app을 갈아엎은 뒤 3D 컨테이너를 제자리에 다시 끼워 넣는다
  function mountCity3D(){
    const slot = document.getElementById('city3dSlot');
    if(!slot) { stopCityLoop(); return; }
    if(!CITY3D.host) makeCityHost();
    if(CITY3D.host.parentElement !== slot) slot.appendChild(CITY3D.host);
    if(CITY3D.phase==='idle' || CITY3D.phase==='error'){ ensureCity3D(); return; }
    if(CITY3D.phase!=='ready') return;
    if(citySignature() !== CITY3D.sig) buildCityScene();
    resizeCity3D();
    startCityLoop();
  }

  function renderCityPage(){
    if(state.cityView==='archive') return renderGraduationArchive();
    const citizens = collectCityCitizens();
    const graduating = collectGraduatingThisWeek();
    return `<div class="fade-in">
      <div class="page-head"><h1>도시 <span class="beta-pill" style="margin-left:6px;">BETA</span></h1><button class="iconbtn" data-action="goCityArchive">${icon('external')} 졸업 앨범</button></div>
      <div class="empty" style="padding:0 0 14px;">수업 과제는 도로를 달리는 자동차, 자율학습은 집에 사는 시민이야. 방치하면 연기가 나고 결국 불이 붙어.</div>
      ${graduating.length>0?`<div class="city-graduating">🎓 이번 주 졸업 예정 ${graduating.length}명 — 다음 주 월요일에 졸업 앨범으로 넘어가</div>`:''}
      <div id="city3dSlot" class="city-slot-full"></div>
      ${citizens.length===0?`<div class="empty">아직 시민이 없어 — 할 일 탭에서 수업 과제나 자율학습을 추가하면 도시에 나타나.</div>`:''}
    </div>`;
  }
  function findCityItem(target){
    if(!target) return null;
    return state.data.tasks.find(i=>i.id===target.id) || null;
  }
  function renderCityInspectModal(){
    const item = findCityItem(state.cityInspectTarget);
    if(!item) return '';
    const isCar = item.corner==='review';
    const days = itemStaleDays(item);
    const stage = isCar ? carDecayStage(days) : houseDecayStage(days);
    const stageLabel = isCar
      ? ['정상 주행 중이야','연기가 나고 있어','완전히 고장났어'][stage]
      : ['평온해','굴뚝에서 연기가 나','집에 불이 났어','집이 무너졌어'][stage];
    const box = item.boxKey && BOX_KEYS.has(item.boxKey) ? BOXES.find(b=>b.key===item.boxKey) : null;
    const tag = box ? box.label : '미분류';
    return `<div class="modal-overlay" data-action="closeModal">
      <div class="modal" style="max-width:360px;">
        <div class="modal-head"><h2>${isCar?icon('car'):icon('house')} ${escapeHtml(tag)}</h2><button class="modal-close" data-action="closeModal">${icon('close')}</button></div>
        <div class="modal-body">
          <div class="city-inspect-text">${escapeHtml(item.text)}</div>
          <div class="city-inspect-meta">등록한 지 ${days}일째 · ${stageLabel}</div>
          <button class="btn" data-action="cityCompleteFromInspect" data-id="${item.id}">지금 완료 처리</button>
        </div>
      </div>
    </div>`;
  }
  function renderGraduationArchive(){
    const weeks = collectGraduationArchive();
    const weeksHtml = weeks.length===0 ? `<div class="empty">아직 졸업한 시민이 없어.</div>` : weeks.map(w=>{
      const label = fmtShortDate(toISODate(new Date(w.weekStart)));
      const rows = w.items.map(entry=>{
        const box = entry.item.boxKey && BOX_KEYS.has(entry.item.boxKey) ? BOXES.find(b=>b.key===entry.item.boxKey) : null;
        const tag = box ? box.label : '미분류';
        return `<div class="city-grad-row">
          <span class="city-grad-icon" style="--fc:${entry.color};">${icon(entry.vehicle==='car'?'car':'house')}</span>
          <div class="city-grad-body"><div class="city-grad-tag">${escapeHtml(tag)}</div><div class="city-grad-text">${escapeHtml(entry.item.text)}</div></div>
          <button class="city-grad-del" title="졸업 취소하고 기록 지우기" data-action="deletePermanent" data-id="${entry.item.id}">${icon('trash')}</button>
        </div>`;
      }).join('');
      return `<div class="section">
        <div class="section-head"><div class="section-title">${label} 주 — 졸업생 ${w.items.length}명</div></div>
        ${rows}
      </div>`;
    }).join('');
    return `<div class="fade-in">
      <div class="page-head"><h1>졸업 앨범</h1><button class="iconbtn" data-action="goCityMain">${icon('arrowLeft')} 도시로</button></div>
      ${weeksHtml}
    </div>`;
  }

  /* ---- Schedule ---- */
  function renderCompletedModal(){
    const groups = ['review','self'].map(corner=>{
      const items = state.data.completed.filter(c=>c.corner===corner).sort((a,b)=>b.completedAt-a.completedAt);
      if(items.length===0) return '';
      const rows = items.map(it=>`<div class="item">
        <div class="item-top">
          <div class="item-text">${escapeHtml(it.text)}</div>
          <div class="item-actions" style="display:flex;gap:4px;">
            <button class="task-del" style="opacity:1;" title="복원" data-action="restoreTask" data-id="${it.id}">${icon('retry')}</button>
            <button class="task-del" style="opacity:1;" title="영구삭제" data-action="deletePermanent" data-id="${it.id}">${icon('trash')}</button>
          </div>
        </div>
        <div class="item-date">완료: ${fmtDate(it.completedAt)}</div>
      </div>`).join('');
      return `<div style="margin-bottom:16px;"><div class="section-title" style="margin-bottom:8px;">${CORNER_LABELS[corner]}</div>${rows}</div>`;
    }).join('');
    return `<div class="modal-overlay" data-action="closeModal">
      <div class="modal completed-modal">
        <div class="modal-head"><h2>완료 목록</h2><button class="modal-close" data-action="closeModal">${icon('close')}</button></div>
        <div class="modal-body">${state.data.completed.length===0?`<div class="empty">아직 완료한 항목이 없어.</div>`:groups}</div>
      </div>
    </div>`;
  }

  function renderQuickAddModal(){
    const boxKey = state.quickAddBoxKey;
    const box = BOXES.find(b=>b.key===boxKey);
    if(!box) return '';
    const corner = state.quickAddCorner;
    const tabs = ['review','self'].map(c=>`<button class="corner-tab ${corner===c?'active':''}" data-action="setQuickAddCorner" data-corner="${c}">${CORNER_LABELS[c]}</button>`).join('');
    const recent = state.data.tasks.filter(t=>t.boxKey===boxKey && t.corner===corner).sort((a,b)=>b.createdAt-a.createdAt).slice(0,4);
    const recentHtml = recent.length===0 ? `<div class="empty" style="padding:10px 0;">아직 항목이 없어.</div>` : recent.map(it=>`
      <div class="task-row">
        <button class="task-check" data-action="completeTask" data-id="${it.id}">${icon('check')}</button>
        <div class="task-body"><div class="task-text">${escapeHtml(it.text)}</div></div>
        <button class="task-del" title="삭제" data-action="deleteTask" data-id="${it.id}">${icon('trash')}</button>
      </div>`).join('');
    return `<div class="modal-overlay" data-action="closeModal">
      <div class="modal" style="max-width:440px;">
        <div class="modal-head"><h2>${box.label}</h2><button class="modal-close" data-action="closeModal">${icon('close')}</button></div>
        <div class="modal-body">
          <div class="corner-tabs">${tabs}</div>
          <div class="add-row">
            <input type="text" class="add-input" id="quickAddInput" data-boxkey="${boxKey}" data-corner="${corner}" placeholder="추가할 내용 입력 후 Enter" autofocus>
            <button class="btn" data-action="quickAddSubmit" data-boxkey="${boxKey}" data-corner="${corner}">추가</button>
          </div>
          <div>${recentHtml}</div>
        </div>
      </div>
    </div>`;
  }

  /* ---- Settings ---- */
  function renderSettingsModal(){
    const templates = getTemplates();
    const tplRows = templates.map(t=>`
      <div class="tpl-item">
        <div class="tpl-head">
          <input type="text" class="tpl-name" data-role="templateName" data-id="${t.id}" value="${escapeHtml(t.name)}">
          <button class="btn-outline" data-action="copyTemplate" data-id="${t.id}">${templateCopyStatus===t.id?'복사됨!':'복사'}</button>
          <button class="task-del" style="opacity:1;" title="삭제" data-action="deleteTemplate" data-id="${t.id}">${icon('trash')}</button>
        </div>
        <textarea class="tpl-content" data-role="templateContent" data-id="${t.id}" rows="4">${escapeHtml(t.content)}</textarea>
      </div>`).join('');

    return `<div class="modal-overlay" data-action="closeModal">
      <div class="modal">
        <div class="modal-head"><h2>설정</h2><button class="modal-close" data-action="closeModal">${icon('close')}</button></div>
        <div class="modal-body">
          <div class="settings-group">
            <h3>이름</h3>
            <div class="desc">홈 화면 인사말에 쓰여. (예: "좋은 아침이야, 준혁")</div>
            <input type="text" id="studentNameInput" placeholder="이름">
            <div class="settings-actions">
              <button class="btn-outline" data-action="saveStudentName">저장</button>
            </div>
          </div>

          <div class="settings-group">
            <h3>보고서 템플릿</h3>
            <div class="desc">자주 쓰는 보고서 뼈대나 기본 코드를 저장해두고 "복사" 버튼으로 바로 클립보드에 복사해서 붙여넣을 수 있어. 여기서 자유롭게 수정·추가·삭제해줘 (이 브라우저에만 저장, 내보내기 백업에는 포함 안 됨).</div>
            ${tplRows}
            <div class="add-row">
              <input type="text" class="add-input" id="newTplName" placeholder="새 템플릿 이름 (예: 정보 수행평가)">
              <button class="btn-outline" data-action="addTemplate">추가</button>
            </div>
          </div>

          <div class="settings-group">
            <h3>데이터</h3>
            <div class="desc">정기적으로 내보내기 백업을 해두는 걸 추천해.</div>
            <div class="settings-actions">
              <button class="btn-outline" data-action="exportData">내보내기</button>
              <button class="btn-outline" data-action="importTrigger">가져오기</button>
            </div>
          </div>
        </div>
      </div>
    </div>`;
  }

  /* ============ 유틸 ============ */
  function escapeHtml(s){ return (s||'').replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
  function fmtDate(ts){ const d=new Date(ts); return `${d.getMonth()+1}/${d.getDate()}`; }

  /* ============ 액션: 할 일 ============ */
  function addTask(text, boxKey, corner){
    text = (text||'').trim(); if(!text) return;
    state.data.tasks.push({id:genId(), text, boxKey: BOX_KEYS.has(boxKey) ? boxKey : null,
                           corner: corner==='review' ? 'review' : 'self', createdAt:Date.now()});
    persist(); render();
  }
  function saveTaskEdit(id){
    const t = document.getElementById('taskEditText');
    const text = t ? t.value.trim() : '';
    if(!text) return;                       // 빈 내용으로는 저장 안 함
    const it = state.data.tasks.find(x=>x.id===id); if(!it) return;
    it.text = text;
    const bs = document.getElementById('taskEditBox');
    if(bs) it.boxKey = BOX_KEYS.has(bs.value) ? bs.value : null;
    const cs = document.getElementById('taskEditCorner');
    if(cs) it.corner = cs.value==='review' ? 'review' : 'self';
    state.editingTask = null;
    persist(); render();
  }
  function completeTask(id){
    const idx = state.data.tasks.findIndex(i=>i.id===id); if(idx<0) return;
    const [it] = state.data.tasks.splice(idx,1);
    state.data.completed.push({...it, completedAt:Date.now()});
    persist(); render();
  }
  function deleteTask(id){
    state.data.tasks = state.data.tasks.filter(i=>i.id!==id);
    persist(); render();
  }
  function restoreTask(id){
    const idx = state.data.completed.findIndex(i=>i.id===id); if(idx<0) return;
    const [it] = state.data.completed.splice(idx,1);
    delete it.completedAt;
    state.data.tasks.push(it);
    persist(); render();
  }
  function deletePermanent(id){
    state.data.completed = state.data.completed.filter(i=>i.id!==id);
    persist(); render();
  }

  /* ============ 액션: 과제 ============ */
  function addAssignment(){
    const title = document.getElementById('asgTitle').value.trim();
    const date = document.getElementById('asgDate').value;
    const tag = document.getElementById('asgTag').value.trim();
    if(!title || !date){ return; }
    state.data.assignments.push({id:genId(), title, dueDate:date, tag, done:false, createdAt:Date.now(), source:'manual'});
    persist(); render();
  }
  function saveAssignmentEdit(id){
    const a = state.data.assignments.find(x=>x.id===id); if(!a) return;
    const t = document.getElementById('asgEditTitle');
    const d = document.getElementById('asgEditDate');
    const g = document.getElementById('asgEditTag');
    const title = t ? t.value.trim() : '';
    const date = d ? d.value : '';
    if(!title || !date) return;          // 제목·기한은 비울 수 없음
    a.title = title; a.dueDate = date; a.tag = g ? g.value.trim() : a.tag;
    state.editingAssignment = null;
    persist(); render();
  }
  function toggleAssignment(id){
    const a = state.data.assignments.find(x=>x.id===id); if(!a) return;
    a.done = !a.done; persist(); render();
  }
  function deleteAssignment(id){
    state.data.assignments = state.data.assignments.filter(x=>x.id!==id);
    persist(); render();
  }

  /* ============ 액션: 설정 ============ */
  let templateCopyStatus = ''; // 방금 복사한 템플릿 id (버튼에 "복사됨!" 잠깐 표시용)
  function saveStudentName(){
    const input = document.getElementById('studentNameInput');
    setStudentName(input ? input.value.trim() : '');
    render();
  }

  /* ============ 액션: 도시 ============ */
  function openCityInspect(id){
    state.cityInspectTarget = {id};
    state.modal = 'cityInspect';
    render();
  }
  function cityCompleteFromInspect(){
    const item = findCityItem(state.cityInspectTarget);
    if(!item) return;
    const isCar = item.corner==='review';
    const modalBody = document.querySelector('.modal-body');
    if(modalBody){
      modalBody.innerHTML = `<div class="city-fix-flourish ${isCar?'repair':'fire'}">
        <span class="city-fix-icon">${icon('truck')}</span>
        <div>${isCar?'수리차가 와서 고쳐주고 있어...':'소방차가 와서 불을 끄고 있어...'}</div>
      </div>`;
    }
    setTimeout(()=>{
      state.modal = null;
      state.cityInspectTarget = null;
      completeTask(item.id);
    }, 700);
  }
  /* ============ 내보내기/가져오기 ============ */
  function exportData(){
    const blob = new Blob([JSON.stringify(state.data,null,2)],{type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href=url; a.download=`city-of-brain-backup-${now.getFullYear()}${String(now.getMonth()+1).padStart(2,'0')}${String(now.getDate()).padStart(2,'0')}.json`;
    document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);
  }
  function importDataFromFile(file){
    const reader = new FileReader();
    reader.onload = e=>{
      try{
        const parsed = JSON.parse(e.target.result);
        state.data = {
          tasks: parsed.tasks || [],
          completed: parsed.completed || [],
          assignments: parsed.assignments || [],
          ddays: parsed.ddays || []
        };
        persist(); render();
      }catch(err){ alert('파일을 읽지 못했어. JSON 형식이 맞는지 확인해줘.'); }
    };
    reader.readAsText(file);
  }

  /* ============ 홈 박스 드래그 (물방울처럼 마우스로 움직이기) ============ */
  const BOX_DRAG_RANGE = 90;
  let suppressNextClick = false;
  let boxDrag = null;
  document.body.addEventListener('pointerdown', function(e){
    if(e.button!=null && e.button!==0) return;
    const wrap = e.target.closest('.box-drag');
    if(!wrap || e.target.closest('button') || e.target.closest('.box-task-row')) return;
    const key = wrap.dataset.boxkey;
    const off = boxDragOffsets[key] || {x:0, y:0};
    boxDrag = { key, el:wrap, startX:e.clientX, startY:e.clientY, origX:off.x, origY:off.y, moved:false, pointerId:e.pointerId };
    wrap.classList.add('dragging');
    // setPointerCapture는 일부러 안 씀 — 캡처를 걸면 click 이벤트의 target이 wrap(래퍼)으로
    // 바뀌어서 안쪽 <button data-action>을 closest()로 못 찾게 됨. document.body에서
    // pointerId로 걸러 듣고 있어서 캡처 없이도 드래그 추적에는 문제 없음.
  });
  document.body.addEventListener('pointermove', function(e){
    if(!boxDrag || e.pointerId!==boxDrag.pointerId) return;
    const dx = e.clientX - boxDrag.startX, dy = e.clientY - boxDrag.startY;
    if(Math.abs(dx)>4 || Math.abs(dy)>4) boxDrag.moved = true;
    if(boxDrag.moved){
      const x = Math.max(-BOX_DRAG_RANGE, Math.min(BOX_DRAG_RANGE, boxDrag.origX+dx));
      const y = Math.max(-BOX_DRAG_RANGE, Math.min(BOX_DRAG_RANGE, boxDrag.origY+dy));
      boxDrag.el.style.transform = `translate(${x}px,${y}px)`;
    }
  });
  function endBoxDrag(e){
    if(!boxDrag || (e.pointerId!==undefined && e.pointerId!==boxDrag.pointerId)) return;
    boxDrag.el.classList.remove('dragging');
    if(boxDrag.moved){
      const dx = e.clientX - boxDrag.startX, dy = e.clientY - boxDrag.startY;
      const x = Math.max(-BOX_DRAG_RANGE, Math.min(BOX_DRAG_RANGE, boxDrag.origX+dx));
      const y = Math.max(-BOX_DRAG_RANGE, Math.min(BOX_DRAG_RANGE, boxDrag.origY+dy));
      boxDragOffsets[boxDrag.key] = {x, y};
      suppressNextClick = true;
      const cell = boxDrag.el.querySelector('.box-cell');
      if(cell){
        cell.classList.add('drop-bounce');
        cell.addEventListener('animationend', ()=>cell.classList.remove('drop-bounce'), {once:true});
      }
    }
    boxDrag = null;
  }
  document.body.addEventListener('pointerup', endBoxDrag);
  document.body.addEventListener('pointercancel', endBoxDrag);

  /* ============ 할 일 항목을 스톱워치 카드로 드래그해서 연결하기 ============ */
  document.body.addEventListener('dragstart', function(e){
    const row = e.target.closest('.box-task-row');
    if(!row) return;
    const payload = {type:'task', id:row.dataset.dragId};
    e.dataTransfer.setData('application/json', JSON.stringify(payload));
    e.dataTransfer.effectAllowed = 'copy';
    row.classList.add('dragging-task');
  });
  document.body.addEventListener('dragend', function(e){
    const row = e.target.closest('.box-task-row');
    if(row) row.classList.remove('dragging-task');
    document.querySelectorAll('.pomo-card.drag-over').forEach(c=>c.classList.remove('drag-over'));
  });
  document.body.addEventListener('dragover', function(e){
    const card = e.target.closest('.pomo-card');
    if(!card) return;
    e.preventDefault();
    e.dataTransfer.dropEffect = 'copy';
    card.classList.add('drag-over');
  });
  document.body.addEventListener('drop', function(e){
    const card = e.target.closest('.pomo-card');
    if(!card) return;
    e.preventDefault();
    card.classList.remove('drag-over');
    try{
      const data = JSON.parse(e.dataTransfer.getData('application/json'));
      if(data && data.type){
        sw.target = data;
        render();
        const newCard = document.querySelector('.pomo-card');
        if(newCard){
          newCard.classList.add('linked-flash');
          newCard.addEventListener('animationend', ()=>newCard.classList.remove('linked-flash'), {once:true});
        }
      }
    }catch(err){}
  });

  /* ============ 이벤트 위임 ============ */
  document.body.addEventListener('click', function(e){
    if(suppressNextClick){ suppressNextClick = false; return; }
    const el = e.target.closest('[data-action]'); if(!el) return;
    if(el.dataset.action==='closeModal' && el.classList.contains('modal-overlay') && e.target!==el) return;
    switch(el.dataset.action){
      case 'goView': state.view=el.dataset.view; render(); break;
      case 'addTaskFromRow': {
        const corner = el.dataset.corner;
        const boxSel = document.getElementById('taskAddBox-'+corner);
        const input = document.getElementById('taskAddInput-'+corner);
        addTask(input.value, boxSel ? boxSel.value : null, corner);
        break;
      }
      case 'completeTask': completeTask(el.dataset.id); break;
      case 'deleteTask': deleteTask(el.dataset.id); break;
      case 'restoreTask': restoreTask(el.dataset.id); break;
      case 'deletePermanent': deletePermanent(el.dataset.id); break;
      case 'openCompleted': state.modal='completed'; render(); break;
      case 'openCityInspect': openCityInspect(el.dataset.id); break;
      case 'cityCompleteFromInspect': cityCompleteFromInspect(); break;
      case 'goCityArchive': state.cityView='archive'; render(); break;
      case 'goCityMain': state.cityView='main'; render(); break;
      case 'openQuickAdd': state.quickAddBoxKey = el.dataset.boxkey; state.quickAddCorner = 'review'; state.modal = 'quickAdd'; render(); break;
      case 'setQuickAddCorner': state.quickAddCorner = el.dataset.corner; render(); break;
      case 'quickAddSubmit': {
        const input = document.getElementById('quickAddInput');
        addTask(input.value, el.dataset.boxkey, el.dataset.corner);
        break;
      }
      case 'openSettings': state.modal='settings'; render(); break;
      case 'closeModal': state.modal=null; render(); break;
      case 'exportData': exportData(); break;
      case 'importTrigger': document.getElementById('importFile').click(); break;
      case 'addAssignment': addAssignment(); break;
      case 'addDday': addDday(); break;
      case 'deleteDday': deleteDday(el.dataset.id); break;
      case 'toggleDdayHidden': toggleDdayHidden(el.dataset.id); break;
      case 'toggleDdayAdd': toggleDdayAdd(); break;
      case 'toggleAssignment': {
        const id = el.dataset.id;
        const a = state.data.assignments.find(x=>x.id===id);
        const row = el.closest('.asg-row');
        if(a && !a.done && row && !row.classList.contains('asg-complete-anim')){
          row.classList.add('asg-complete-anim');
          setTimeout(()=>toggleAssignment(id), 520);
        } else {
          toggleAssignment(id);
        }
        break;
      }
      case 'deleteAssignment': deleteAssignment(el.dataset.id); break;
      case 'editAssignment': state.editingAssignment = el.dataset.id; render(); break;
      case 'cancelAssignmentEdit': state.editingAssignment = null; render(); break;
      case 'saveAssignmentEdit': saveAssignmentEdit(el.dataset.id); break;
      case 'editTask': state.editingTask = {id:el.dataset.id}; render(); break;
      case 'cancelTaskEdit': state.editingTask = null; render(); break;
      case 'saveTaskEdit': saveTaskEdit(el.dataset.id); break;
      case 'setAssignmentPriority': {
        const a = state.data.assignments.find(x=>x.id===el.dataset.id);
        if(a){ a.priority = a.priority===el.dataset.val ? null : el.dataset.val; persist(); render(); }
        break;
      }
      case 'setAsgSortMode': state.asgSortMode = el.dataset.mode; render(); break;
      case 'swStart': swStart(); break;
      case 'swPause': swPause(); break;
      case 'swReset': swReset(); break;
      case 'swCompleteLinked': swCompleteLinked(); break;
      case 'saveStudentName': saveStudentName(); break;
      case 'copyTemplate': {
        const t = getTemplates().find(x=>x.id===el.dataset.id);
        if(t){
          navigator.clipboard.writeText(t.content).then(()=>{
            templateCopyStatus = el.dataset.id;
            render();
            setTimeout(()=>{ if(templateCopyStatus===el.dataset.id){ templateCopyStatus=''; render(); } }, 1500);
          }).catch(()=>{});
        }
        break;
      }
      case 'addTemplate': {
        const input = document.getElementById('newTplName');
        const name = (input.value||'').trim();
        if(!name) break;
        const list = getTemplates();
        list.push({id:genId(), name, content:''});
        setTemplates(list);
        input.value = '';
        render();
        break;
      }
      case 'deleteTemplate': {
        setTemplates(getTemplates().filter(t=>t.id!==el.dataset.id));
        render();
        break;
      }
    }
  });

  document.body.addEventListener('keydown', function(e){
    if(e.key!=='Enter') return;
    if(e.target.dataset.role==='taskEditText'){
      const ed = state.editingTask;
      if(ed) saveTaskEdit(ed.id);
      return;
    }
    if(e.target.id==='quickAddInput'){
      addTask(e.target.value, e.target.dataset.boxkey, e.target.dataset.corner);
    } else if(e.target.classList.contains('add-input') && e.target.dataset.corner){
      addTask(e.target.value, document.getElementById('taskAddBox-'+e.target.dataset.corner)?.value, e.target.dataset.corner);
    }
  });

  let debTimer = null;
  document.body.addEventListener('input', function(e){
    if(e.target.id==='swTargetSelect'){
      const v = e.target.value;
      if(!v){ sw.target = null; }
      else {
        const parts = v.split(':');
        if(parts[0]==='assignment'){ sw.target = {type:'assignment', id:parts[1]}; }
        else if(parts[0]==='task'){ sw.target = {type:'task', id:parts[1]}; }
      }
      render();
    } else if(e.target.dataset.role==='templateName' || e.target.dataset.role==='templateContent'){
      const field = e.target.dataset.role==='templateName' ? 'name' : 'content';
      const id = e.target.dataset.id, val = e.target.value;
      clearTimeout(debTimer);
      debTimer = setTimeout(()=>{
        const list = getTemplates();
        const t = list.find(x=>x.id===id);
        if(t){ t[field] = val; setTemplates(list); }
      }, 400);
    }
  });

  // 홈 2단 ↔ 1단 경계를 넘어갈 때만 다시 그림 (매 resize마다 그리면 낭비)
  let lastWide = isWideScreen(), resizeTimer = null;
  window.addEventListener('resize', function(){
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(()=>{
      const w = isWideScreen();
      if(w !== lastWide){ lastWide = w; if(state.view==='home') render(); }
    }, 180);
  });

  document.getElementById('importFile').addEventListener('change', function(e){
    if(e.target.files && e.target.files[0]) importDataFromFile(e.target.files[0]);
    e.target.value = '';
  });

  /* ============ 초기화 ============ */
  (function init(){
    const saved = loadData();
    if(saved){
      state.data = {
        tasks: saved.tasks || [],
        completed: saved.completed || [],
        assignments: saved.assignments || [],
        ddays: saved.ddays || []
      };
    }
    render();
  })();

})();
</script>
</body>
</html>
